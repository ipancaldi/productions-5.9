<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch Pad — Productions</title>
<!--
  ============================================================================
  SKETCH PAD — the free-drawing input panel for the Productions v5 agent.

  DELIBERATELY SEPARATE from production-hub-v5.html, for the same reasons
  the Scene Study is: it can be opened, iterated and demoed on its own, and a
  failure in here cannot take the workspace with it. The protocol is written down
  in AGENT-BRIDGE.md and versioned.

  WHAT THIS PANEL IS NOT: it is not a client of the agent API. It holds no take
  and it calls no service. It posts a payload to the host and the host — the only
  thing that owns the facts — talks to :3902. One auth path, no key in an HTML
  file, and this panel still boots standalone.

  THE DESIGN ARGUMENT: a sketch is ambiguous in three specific ways, and each one
  is cheap to remove if you make removing it cheaper than not.
      PROJECTION — plan or elevation? A toggle, and the canvas says which.
      SCALE      — how big is any of this? Two clicks and a number.
      ANCHORS    — what IS this blob? A stamp palette: PROJ · CAM · LED · TRACK.
  Everything else here is ordinary drawing. Those three are the accuracy.

  TWO THINGS TRAVEL, NOT ONE: the rasterised PNG is what the model looks at; the
  vector record — strokes, stamps, scale, origin — is what makes its answers snap
  to what was actually drawn. Neither is sufficient alone.

  ---------------------------------------------------------------------------
  v5.5 — SOLIDS. The pad can now build the thing it drew.

  A sketch of a stage is a curve, and a curve was the one thing this panel could
  not turn into anything: strokes travelled as pixels and the far side guessed a
  box. So the pad grew a FITTER. It reads a traced outline, decides which parts of
  it are genuinely circular ARCS and which are STRAIGHTS, and re-states the whole
  thing as the few vertices and true arcs the hand was aiming at — then hands that
  to the Scene Study, which builds it in 3D.

  Three roles, because three things behave differently in a real room:
    STAGE  a closed footprint, extruded — curves kept, corrected and simplified
    WALL   an open free-form surface, and a projector can throw an image at it
    LED    flat cabinets on a tiled grid; a curve is FACETED, because LED does not
           bend — the geometry says so, and the tile count is what gets ordered

  Every correction the fitter makes is reported on the canvas and on the wire:
  raw points in, vertices out, arc radii, the RMS it gave away, whether symmetry
  fired. A correction you cannot see is a different drawing, not a correction.
  ============================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   The palette is NOT authored here. :root carries the BrandOS AA values as a
   standalone default; hosted, the prototype sends its resolved tokens in `hello`
   and they are written onto :root at runtime. One palette, transmitted — there is
   no second copy to keep in step.
   ========================================================================= */
:root {
  --gray-300: #D0D5DD; --gray-400: #A2ABBA; --gray-500: #858FA2; --gray-550: #62748E;
  --gray-600: #475467; --gray-650: #4F5D72; --gray-700: #344054; --gray-800: #1D2939;
  --gray-900: #101828;

  --surface-canvas: var(--gray-900); --surface-panel: var(--gray-800);
  --surface-raised: var(--gray-700); --surface-selected: var(--gray-700);
  --surface-emphasis: var(--gray-600); --surface-emphasis-hover: var(--gray-650);
  --border-subtle: var(--gray-700); --border-strong: var(--gray-550); --border-emphasis: var(--gray-300);
  --text-primary: var(--gray-300); --text-secondary: var(--gray-400);
  --text-meta: var(--gray-500); --text-disabled: var(--gray-600);

  --status-complete: #6BFFDC; --status-progress: #FF8559; --status-failed: #FF98F4;
  --status-active: #FEFF34; --status-info: #D2B3ED; --status-live: #A74CEE;
  /* Z-UP NAMING: red X across, blue Y into the room, green Z up */
  --axis-x: #F04438; --axis-y: #2E90FA; --axis-z: #12B76A;
  --scene-beam: #F79009; --scene-range: #D0D5DD;
  --tint-emphasis: rgba(208,213,221,0.18); --tint-emphasis-s: rgba(208,213,221,0.08);
  --ring-emphasis: rgba(208,213,221,0.65); --scrim: rgba(16,24,40,0.82);
  --elev-3: 0 12px 24px rgba(16,24,40,0.50);

  --space-2: 2px; --space-4: 4px; --space-6: 6px; --space-8: 8px; --space-10: 10px;
  --space-12: 12px; --space-16: 16px;
  --radius-xs: 3px; --radius-sm: 5px; --radius-card: 8px; --radius-pill: 999px;

  --font: "Inter", system-ui, -apple-system, sans-serif;
  --t-body-m: 400 12px/18px var(--font);
  --t-body-s: 400 10.5px/16px var(--font);
  --t-label-m: 500 10.5px/14px var(--font); --tr-label-m: 0.07em;
  --t-label-s: 500 9.5px/13px var(--font);  --tr-label-s: 0.09em;
  --t-mono: 500 10.5px/14px ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--surface-panel); color: var(--text-primary); font: var(--t-body-m);
  overflow: hidden; user-select: none; -webkit-font-smoothing: antialiased;
}
.app { height: 100%; display: flex; flex-direction: column; gap: var(--space-6); padding: var(--space-8); }

/* ---------- toolbar — the panel is routinely 260px wide, so the middle scrolls
     sideways and BUILD 3D is pinned, the same arrangement the Scene Study uses
     to keep DELETE reachable in a narrow tile. ---------- */
.bar { display: flex; align-items: center; gap: var(--space-4); flex: 0 0 auto; }
/* THE BAR WRAPS RATHER THAN SCROLLS. It used to be an overflow-x container with the
   scrollbar hidden, which in a Hub-sized panel put everything past the drawing tools
   off the end of a bar that did not look scrollable — a control nobody can see is a
   control that is not there. Wrapping costs one row of height in a narrow panel and
   nothing at all in a wide one. */
.bar-scroll { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; flex-wrap: wrap;
  gap: var(--space-4) var(--space-6); padding-bottom: 1px; }
.bar-fixed { flex: 0 0 auto; display: flex; align-items: center; gap: var(--space-4);
  padding-left: var(--space-6); border-left: 1px solid var(--border-subtle); }
.btn {
  font: var(--t-label-m); letter-spacing: var(--tr-label-m); color: var(--text-secondary);
  background: transparent; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
  padding: 0 var(--space-8); height: 22px; display: inline-flex; align-items: center; gap: var(--space-4);
  cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { color: var(--text-primary); border-color: var(--border-strong); }
.btn.on { color: var(--gray-900); background: var(--text-primary); border-color: var(--text-primary); }
.btn:disabled { color: var(--text-disabled); cursor: default; border-color: var(--border-subtle); }
/* a locked shape's row: the knobs that would CHANGE it read as unavailable rather than
   just failing quietly when pressed */
.btn.off { opacity: 0.45; }
.tin:disabled { color: var(--text-disabled); cursor: default; }
input[type="range"]:disabled { opacity: 0.4; cursor: default; }
.foot.locked .chip { color: var(--text-disabled); }
.foot.locked #sol-lockk { color: var(--status-complete); }
.btn.cta { color: var(--gray-900); background: var(--status-complete); border-color: var(--status-complete); font: var(--t-label-m); letter-spacing: var(--tr-label-m); }
.btn.cta:disabled { color: var(--text-disabled); background: transparent; border-color: var(--border-subtle); }
.btn.danger:hover:not(:disabled) { color: var(--status-failed); border-color: var(--status-failed); }
.sep { width: 1px; height: 16px; background: var(--border-subtle); margin: 0 var(--space-2); flex: 0 0 auto; }

/* ---------- ICON BUTTONS ----------
   The bar outgrew its words. Eighteen labels at this type size is 640px of toolbar in
   a panel that is routinely 260px wide, so everything scrolled and the things at the
   end — the stamps among them — were effectively gone. Icons are 26px each, the groups
   are separated, and every one keeps a full-sentence `title`: the icon is for finding
   it again, the tooltip is for learning it the first time. */
.btn.ico { padding: 0; width: 30px; height: 30px; justify-content: center; }
/* the Disguise glyphs are a FILLED family drawn on a 24px grid — stroked at 1.6 they
   were a different typeface wearing the same names */
.btn.ico svg { width: 20px; height: 20px; display: block; fill: currentColor; stroke: none; }
.btn.ico.wide { width: auto; padding: 0 var(--space-6); gap: var(--space-4); }
/* the caret on a button that opens a menu, so a palette does not look like a toggle */
.btn.ico .caret { width: 10px; height: 10px; margin-left: -2px; opacity: 0.7; }
.seg { display: inline-flex; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); overflow: hidden; flex: 0 0 auto; }
.seg .btn { border: 0; border-radius: 0; height: 30px; }
.tool-group { display: inline-flex; align-items: center; gap: 2px; padding: 2px;
  border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); background: var(--surface-canvas); flex: 0 0 auto; }
.tool-group .btn { border-color: transparent; }
.tool-group .btn:hover:not(:disabled) { border-color: var(--border-strong); }
.seg .btn + .btn { border-left: 1px solid var(--border-subtle); }

/* dropdown, fixed and parented to body: the bar is a scroll container, so
   anything hanging off it inside would be clipped */
.menu {
  position: fixed; z-index: 40; min-width: 190px; max-height: 320px; overflow: auto;
  background: var(--surface-raised); border: 1px solid var(--border-strong); border-radius: var(--radius-card);
  box-shadow: var(--elev-3); padding: var(--space-4); display: none; flex-direction: column;
}
.menu.open { display: flex; }
.menu .k { font: var(--t-label-s); letter-spacing: var(--tr-label-s); color: var(--text-meta);
  text-transform: uppercase; padding: var(--space-6) var(--space-8) var(--space-4); }
.menu button {
  font: var(--t-body-s); color: var(--text-primary); background: transparent; border: 0; text-align: left;
  padding: var(--space-6) var(--space-8); border-radius: var(--radius-sm); cursor: pointer;
  display: flex; justify-content: space-between; gap: var(--space-8); align-items: baseline;
}
.menu button:hover { background: var(--surface-selected); }
/* the role this shape ALREADY is, so the menu answers the question as well as asking it */
.chip.act { cursor: pointer; }
.chip.act:hover { color: var(--text-primary); border-color: var(--border-strong); }
.menu button.on { color: var(--gray-900); background: var(--text-primary); }
.menu button.on i { color: var(--gray-800); }
.menu button i { font-style: normal; color: var(--text-meta); font: var(--t-mono); }

/* ---------- the drawing surface ---------- */
.stage { position: relative; flex: 1 1 auto; min-height: 0; border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card); background: var(--surface-canvas); overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#under { opacity: 0.34; }
/* the cursor is set from JS per-position — see `paintCursor` — so this is only the
   value before the pointer has ever been inside */
#ink { touch-action: none; cursor: crosshair; }
.stage.locked #ink { cursor: default; }

/* the state a panel must have: an interpret in flight, and nothing pretending */
.veil { position: absolute; inset: 0; background: var(--scrim); display: none;
  align-items: center; justify-content: center; flex-direction: column; gap: var(--space-6); }
.veil.on { display: flex; }
/* WORKING — one indeterminate sweep, in the agent's violet. Indeterminate on
   purpose: an interpret has no honest percentage, and a fake one is worse. */
.work { position: relative; height: 2px; width: 120px; overflow: hidden; flex: 0 0 auto;
  border-radius: var(--radius-pill); background: var(--border-subtle); }
.work i { position: absolute; top: 0; bottom: 0; width: 38%; border-radius: inherit;
  background: var(--status-info); animation: work-sweep 1.15s ease-in-out infinite; }
@keyframes work-sweep { from { left: -38%; } to { left: 100%; } }
.veil .t { font: var(--t-label-m); letter-spacing: var(--tr-label-m); color: var(--text-primary); text-transform: uppercase; }
.veil .s { font: var(--t-body-s); color: var(--text-meta); max-width: 240px; text-align: center; }

/* the text-label editor, positioned over the canvas */
#tin { position: absolute; display: none; z-index: 12; font: var(--t-label-m); letter-spacing: var(--tr-label-m);
  text-transform: uppercase; color: var(--text-primary); background: var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: var(--radius-xs); padding: 2px var(--space-4);
  width: 130px; outline: none; }

/* ---------- the footer: what has been declared, and what has not ---------- */
.foot { flex: 0 0 auto; display: flex; align-items: center; gap: var(--space-6); flex-wrap: wrap; }
.chip { font: var(--t-label-s); letter-spacing: var(--tr-label-s); text-transform: uppercase;
  color: var(--text-meta); border: 1px solid var(--border-subtle); border-radius: var(--radius-pill);
  padding: 2px var(--space-8); display: inline-flex; gap: var(--space-4); align-items: center; white-space: nowrap; }
/* v5.8 · `display` on the class beats the UA's `[hidden]` rule — author styles always do —
   so a chip hidden by the property alone stayed on screen as an empty pill. */
.chip[hidden] { display: none; }
.chip.ok { color: var(--status-complete); border-color: color-mix(in srgb, var(--status-complete) 40%, transparent); }
.chip.warn { color: var(--status-progress); border-color: color-mix(in srgb, var(--status-progress) 40%, transparent); }
.chip b { font-weight: 600; color: inherit; }
.grow { flex: 1 1 auto; }
input.tin, input.note {
  font: var(--t-body-s); color: var(--text-primary); background: var(--surface-canvas);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 0 var(--space-6);
  height: 22px; outline: none; min-width: 0;
}
input.note { flex: 1 1 140px; }
input.tin { width: 74px; }
input:focus { border-color: var(--border-strong); }

/* ---------- the solid row ----------
   Its own row, scrolling sideways: the panel is routinely 260px wide and the knobs
   for one solid are more than fit. It is only ever present while a solid is
   selected, for the same reason the scale prompt is — a row that is always there
   and usually empty reads as broken. */
#sol { overflow-x: auto; scrollbar-width: none; flex-wrap: nowrap; }
#sol::-webkit-scrollbar { height: 0; }
#sol .chip { border: 0; padding-left: var(--space-4); padding-right: var(--space-4); }
input[type=range] {
  -webkit-appearance: none; appearance: none; height: 3px; border-radius: var(--radius-pill);
  background: var(--border-subtle); outline: none; flex: 0 0 auto;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%;
  background: var(--text-primary); cursor: pointer; border: 0;
}
#sol-fit { font: var(--t-mono); color: var(--status-info); white-space: nowrap; }

/* standalone only — the same dev strip the Scene Study grew, for the same
   reason: the panel must be provably exercisable on its own */
#dev { display: none; flex: 0 0 auto; max-height: 116px; overflow: auto; border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm); padding: var(--space-6); background: var(--surface-canvas); }
#dev.on { display: block; }
#dev .l { font: var(--t-mono); color: var(--text-meta); white-space: pre-wrap; word-break: break-all; }
#dev .l.out { color: var(--status-complete); }
#dev .l.in { color: var(--status-info); }
</style>
</head>

<!-- ============================================================================
     THE ICONS. One sprite, drawn here rather than fetched: this panel has to boot
     from a file:// URL with no network, and a toolbar whose meaning arrives over
     HTTP is a toolbar that is sometimes blank.

     They are all built from the same three moves — a 20-unit box, a 1.6 stroke, and
     round caps — so that at 14px they read as one family rather than as eight
     borrowed glyphs. The two view icons are the only ones carrying a filled mark,
     because which projection you are drawing in is the one thing on this bar that
     is a STATE rather than an action.
     ========================================================================= -->

     3,627-glyph set the workspace's own icons come from) and embedded as a sprite.
     Nothing was redrawn and nothing was approximated: the first version of this bar was
     hand-drawn SVG that LOOKED like the family and was not in it, which is exactly the
     mistake v2 made with typographic characters — off-grid, off-weight, and answerable
     to nobody.

     Two rules carried over from the workspace's own icon block, for the same reasons:

     · `fill: currentColor`, so an icon takes the colour of the text it sits with and
       every contrast rule already written applies to icons too.
     · INLINE. This panel has to boot from a `file://` URL with no network, and a
       toolbar whose meaning arrives over HTTP is a toolbar that is sometimes blank.

     The `fill="#EAECF0"` each source file carries is stripped on the way in — a glyph
     that painted itself would ignore the palette the host transmits.

     Each symbol is named for what it DOES here; the comment above it names the glyph it
     is, so the mapping back to the library is greppable.
     ========================================================================= -->

      <!-- 2 · SELECT. Click a thing to select it; drag it to move it. A shape selected
           here is selected in the Scene Study at the same time. -->
      <div class="tool-group"><button class="btn ico" data-tool="select" title="SELECT (V) — click anything to select it, drag to move it. A shape is selected in the Scene Study too."><svg><use href="#i-select"/></svg></button></div>
      <span class="sep"></span>
      <!-- 3 · DRAWING -->
      <div class="tool-group">
      <button class="btn ico" data-tool="pen" title="PEN (P) — freehand annotation, pressure-sensitive"><svg><use href="#i-pen"/></svg></button>
      <button class="btn ico" data-tool="line" title="LINE (L) — a straight line"><svg><use href="#i-line"/></svg></button>
      <button class="btn ico" data-tool="rect" title="RECTANGLE (R) — hold Option while dragging to cut an opening from the solid underneath"><svg><use href="#i-rect"/></svg></button>
      <button class="btn ico" data-tool="ellipse" title="ELLIPSE (E) — hold Option while dragging to cut an opening from the solid underneath"><svg><use href="#i-oval"/></svg></button>
      <button class="btn ico" data-tool="text" title="LABEL (T) — type a word onto the drawing"><svg><use href="#i-text"/></svg></button>
      </div>
      <span class="sep"></span>
      <!-- 4 · GEOMETRY. Trace a shape, then say what it is. -->
      <div class="tool-group">
      <button class="btn ico on" data-tool="trace" title="TRACE (C) — draw a shape, then RIGHT-CLICK it to say what it is. Hold Option to cut a freeform opening from the solid underneath."><svg><use href="#i-trace"/></svg></button>
      <button class="btn ico" data-tool="aim" title="AIM (D) — drag out of a PROJ, CAM or AUDIENCE anchor to say which way it points. Shift-drag does it from any tool."><svg><use href="#i-aim"/></svg></button>
      </div>
      <span class="sep"></span>
      <!-- 4b · THE THINGS YOU PUT SOMEWHERE.
           A shape's ROLE is not here, and deliberately: what a traced outline IS belongs
           to that outline, so it is a right-click on the shape. What is left are the
           three things that are a POSITION and nothing else — drag one onto the paper. -->
      <div class="tool-group" id="anchors">
      <button class="btn ico" data-anchor="PROJ" title="PROJECTOR — drag onto the drawing to declare one there"><svg><use href="#i-proj"/></svg></button>
      <button class="btn ico" data-anchor="CAM" title="CAMERA — drag onto the drawing to declare one there"><svg><use href="#i-cam"/></svg></button>
      <button class="btn ico" data-anchor="AUDIENCE" title="AUDIENCE — drag onto the drawing to declare a seating region there"><svg><use href="#i-aud"/></svg></button>
      <button class="btn ico" data-anchor="PERSON" title="PERSON — drag onto the drawing to stand one person there. A crowd is a ruler; one person is a mark."><svg><use href="#i-person"/></svg></button>
      </div>
      <span class="sep"></span>
      <!-- 5 · EDITING -->
      <div class="tool-group">
      <button class="btn ico" data-tool="erase" title="ERASE (X) — remove whatever you click"><svg><use href="#i-erase"/></svg></button>
      <button class="btn ico" id="b-undo" title="UNDO (⌘Z)"><svg><use href="#i-undo"/></svg></button>
      <button class="btn ico" id="b-redo" title="REDO (⇧⌘Z)"><svg><use href="#i-redo"/></svg></button>
      <button class="btn ico danger" id="b-clear" title="CLEAR the sketch — this does not un-build what is already in the scene"><svg><use href="#i-clear"/></svg></button>
      </div>
      <span class="sep"></span>
      <!-- 6 · WHAT THE DRAWING IS MEASURED AGAINST -->
      <div class="tool-group">
      <button class="btn ico" data-tool="scale" title="SCALE (S) — only if you are drawing over a plan at some other scale. The grid is already 1 m squares."><svg><use href="#i-scale"/></svg></button>
      <button class="btn ico" data-tool="origin" title="ORIGIN — where the middle of the room is on this drawing"><svg><use href="#i-origin"/></svg></button>
      <button class="btn ico" id="b-under" title="UNDERLAY — show the current scene underneath, seen from above"><svg><use href="#i-underlay"/></svg></button>
      </div>
    </div>
    <div class="bar-fixed">
      <button class="btn ico wide on" id="b-live" aria-pressed="true" title="LIVE ON — Scene Study follows the sketch with a translucent provisional shape. Click to pause the preview."><svg><use href="#i-live"/></svg>LIVE ON</button>
      <!-- ONE BUTTON, and now it does ONE THING: build what was drawn into the scene.
           There were two, and they were different actions wearing similar labels —
           BUILD 3D turned the VECTORS into geometry and then asked a model to read
           whatever was left ambiguous; MAKE 3D sent a PNG of the pad to an
           image-to-3D service to have a mesh generated. Neither model round-trip is
           wanted: the drawing already says what it is. So this builds, the pad stays
           where it is, and anything drawn afterwards ghosts until it is built too. -->
      <button class="btn cta" id="b-go" title="Build the traced shapes into the scene">BUILD 3D</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="under"></canvas>
    <canvas id="ink"></canvas>
    <input id="tin" maxlength="24" placeholder="LABEL">
    <div class="veil" id="veil">
      <span class="t" id="veil-t">READING THE SKETCH</span>
      <span class="work"><i></i></span>
      <span class="s" id="veil-s">The agent is working. Nothing has changed in the take yet — it comes back as a plan you accept.</span>
      <button class="btn" id="b-cancel">CANCEL</button>
    </div>
  </div>

  <div class="foot" id="foot">
    <span class="chip" id="c-proj">PLAN</span>
    <span class="chip warn" id="c-scale">NO SCALE</span>
    <span class="chip" id="c-anchors">0 ANCHORS</span>
    <!-- WHICH TOOL IS ARMED, in words. The bar is icons now, and an icon that is
         `on` is legible only once you already know the icon — so the footer says it. -->
    <span class="chip" id="c-tool">PEN</span>
    <span class="chip" id="c-solids">0 SOLIDS</span>
    <span class="chip" id="c-faces" hidden></span>
    <span class="chip" id="c-strokes">0 STROKES</span>
    <!-- clickable, because the only other way back to 1:1 was to scroll exactly as far
         as you had scrolled in -->
    <button class="chip act" id="c-zoom" title="Zoom · click to fit the drawing (0 for 1:1)">100%</button>
    <span class="grow"></span>
    <input class="note" id="note" maxlength="120" placeholder="WHAT IS THIS? (OPTIONAL)">
  </div>

  <!-- the scale prompt and the stamp inspector share this row: only one can be
       relevant at a time, and a row that is always there but usually empty reads
       as broken -->
  <div class="foot" id="ask" style="display: none;">
    <span class="chip" id="ask-k">SCALE</span>
    <input class="tin" id="ask-v" placeholder="10">
    <span class="chip" id="ask-u" style="border: 0;">METRES</span>
    <button class="btn" id="ask-ok">SET</button>
    <button class="btn" id="ask-x">CANCEL</button>
  </div>

  <!-- v5.5 · one solid's declarations. Present only while one is selected. -->
  <div class="foot" id="sol" style="display: none;">
    <div class="seg" id="sol-role">
      <button class="btn" data-role="stage">STAGE</button>
      <button class="btn" data-role="wall">WALL</button>
      <button class="btn" data-role="led">LED</button>
    </div>
    <input class="tin" id="sol-name" maxlength="18" placeholder="NAME" style="width: 84px;">
    <span class="chip">H</span>
    <input class="tin" id="sol-h" style="width: 50px;">
    <span class="chip" id="sol-hu">M HIGH</span>
    <span class="chip" title="How much of the wobble to throw away. The fitter simplifies to this tolerance, and the arcs it finds have to beat it to count as curves.">SIMPLIFY</span>
    <input type="range" id="sol-tol" min="2" max="80" step="1" style="width: 74px;">
    <span class="chip" id="sol-tolv">15 CM</span>
    <button class="btn" id="sol-snap" title="Vertices to a 25 cm grid, near-axial edges made exactly axial, arc radii rounded to 25 cm — the corrections that make it buildable">SNAP</button>
    <button class="btn" id="sol-sym" title="If the shape is nearly mirror-symmetric about its own centre line, make it exactly so">SYMMETRY</button>
    <button class="btn" id="sol-square" title="Fit to Rectangle — replace this outline with its closest oriented rectangle">SQUARE UP</button>
    <button class="btn" id="sol-close" title="Closed footprint or open run">CLOSED</button>
    <span class="chip" id="sol-tilek" title="Cabinet size — a 500 mm panel is the common one">TILE</span>
    <input class="tin" id="sol-tile" style="width: 46px;">
    <button class="btn" id="sol-refit" title="Read the ink again at the current settings — this throws away hand-moved vertices">REFIT</button>
    <button class="btn danger" id="sol-del">DELETE</button>
    <!-- shown only on a shape that is already in the scene: it is locked so that the
         next gesture on the pad cannot move it by accident -->
    <span class="chip" id="sol-lockk" style="display:none" title="This shape is already in the scene. BUILD 3D will leave it alone until you unlock and change it.">BUILT</span>
    <button class="btn" id="sol-unlock" style="display:none" title="Unlock this shape for editing — BUILD 3D will then send the change">UNLOCK</button>
    <span class="grow"></span>
    <span id="sol-fit"></span>
  </div>

  <div id="dev"></div>
</div>

<div class="menu" id="m-role"></div>

<script>
/* ==========================================================================
   0 · BRIDGE — the whole contract with the host lives in this block.
   See AGENT-BRIDGE.md § Part 1. Nothing below talks to the parent window
   directly; it all goes through `post()` and the `IN` dispatch table, so the
   protocol is one file, one place, greppable.
   ========================================================================== */
const AGENT_V = 1;
/* THE GRID IS THE SCALE. One square is one metre — the same metre the Scene Study's
   floor grid draws, so both surfaces mean the same thing by a square and nobody has
   to be asked how big anything is. The scale gesture still exists, for drawing over
   a plan at some other scale, and an explicit scale wins. The default is no longer
   "unknown". */
const GRID_PX = 40;          // pixels per square
const GRID_M = 1;            // metres per square
const EMBEDDED = window.parent !== window;
const KIND = 'sketch';

/* what the host tells us in `hello`; the defaults keep the panel honest alone */
const HOST = {
  unitsPerMetre: 10,
  venue: null,
  stamps: ['PROJ', 'CAM', 'LED', 'WALL', 'TRACK', 'STAGE', 'AUDIENCE', 'PERSON', 'SCREEN'],
};

const post = (type, body, transfer) => {
  const msg = Object.assign({ v: AGENT_V, type, kind: KIND }, body || {});
  if (EMBEDDED) window.parent.postMessage(msg, '*', transfer || []);
  devLog('out', type, body);
};

const IN = {
  hello(m) {
    if (m.tokens) applyTokens(m.tokens);
    if (m.unitsPerMetre) HOST.unitsPerMetre = m.unitsPerMetre;
    if (m.venue) HOST.venue = m.venue;
    /* the host still names its vocabulary and the pad still records it — but the pad's
       own controls are fixed now: three roles on a right-click, three anchors in the
       toolbar. A palette assembled from whatever the host happened to list is what made
       TRACK and SCREEN appear as things you could place. */
    if (m.stamps && m.stamps.length) HOST.stamps = m.stamps;
    status();
    /* Inventory is state, not an edit event. Send the whole current set on every
       handshake so an Object List opened later never waits for another gesture. */
    post('inventory', { inventory: sketchInventory() });
  },
  /* a top-down render of the current scene, so you can draw OVER the rig that
     already exists and registration comes for free */
  underlay(m) { setUnderlay(m.png || null); },
  /* the host names the phase; the panel does not work it out from its own half */
  busy(m) { setBusy(!!m.on, m.label, m.note); },
  result(m) {
    setBusy(false);
    S.lastPlan = m.planId || null;
    flash(m.opCount ? (m.opCount + ' ops proposed — review them in the plan panel')
                    : 'read, nothing proposed');
  },
  clear() { reset(); },
  /* THE HEIGHT WAS PULLED IN THE ROOM. A plan-drawn deck is capped at 0.5 m here on
     purpose — from directly above there is nothing to judge a height against — so the
     one place a rostrum's real height can be chosen is the 3D, and this is it arriving
     back. `hTouched` is the important half: without it the next default would quietly
     put 0.5 m back, and the number somebody just pulled would evaporate. The cap is
     NOT applied to it, because the whole point is that 3D is allowed to exceed it. */
  solidHeight(m) {
    const i = solidFor(m.srcId);
    if (i < 0 || !(m.h > 0)) return;
    const it = S.items[i];
    it.hM = m.h / HOST.unitsPerMetre;
    it.hTouched = true;
    /* CONFIRMED IN THE ROOM, so the plan-view cap stands aside from now on — see the
       note on `capped` in solidRecord. This is the flag that makes the height survive
       the next thing anybody draws. */
    it.hFree = true;
    /* the ELEVATION view draws a plan shape at its height, and the solid row states it,
       so both have to be told rather than waiting for the next gesture */
    if (S.sel === i) { const f = el('sol-h'); if (f) f.value = it.hM.toFixed(2); }
    agreeWithScene(it);
    flash((it.name || 'DECK') + ' is ' + it.hM.toFixed(2) + ' M HIGH — set in the scene');
  },
  /* v5.8 · MOVED OR TURNED IN THE ROOM. Only the height ever came back, so the drawing
     stopped describing the scene the moment anybody nudged a deck in 3D — and then put
     it back where the paper said on the next BUILD. `at` is the shape's centre in take
     units and `rot` is degrees about the vertical: the same two fields the pad writes. */
  solidPlaced(m) {
    const i = solidFor(m.srcId);
    if (i < 0) return;
    const it = S.items[i];
    const U = HOST.unitsPerMetre, s = pxPerMetre(), own = it.view || 'plan';
    const at = Array.isArray(m.at) ? m.at.map(Number) : null;
    if (at && at.every(v => isFinite(v))) {
      /* THE INVERSE OF `solidRecord`, and it has to stay the inverse: that function is
         the only thing that decides what a page pixel means out there, so this reads
         its arithmetic backwards rather than inventing its own. */
      const [ax, ay] = solidCentre(it);
      const wantX = originOf()[0] + at[0] * s / U;
      if (own === 'elevation') {
        /* a front outline carries its own height, so at[1] is where the shape sits on
           the page; DEPTH has no axis on that page at all and is kept on the item */
        const wantY = baseY('elevation') - at[1] * s / U;
        translateItem(i, wantX - ax, wantY - ay);
        it.depthM = at[2] / U;
      } else {
        const wantY = baseY('plan') + at[2] * s / U;
        translateItem(i, wantX - ax, wantY - ay);
        /* a floor outline's at[1] is not on the page either: it is how far the deck
           stands off the floor, which is exactly what the Elevation draws it at */
        it.baseM = at[1] / U;
      }
    }
    /* A TURN, ABSORBED. The pad has no rotation field — its own rotate handle turns the
       vertices — so a turn from the room is baked into the geometry the same way, and
       `rotBaked` remembers how much of the take's angle is already in there so a second
       message about the same angle does not turn it twice. */
    /* A TURN LANDS IN ONE OF TWO PLACES, and which one is not a preference — it is what
       the page the shape was drawn on is able to say.

       A FLOOR outline is drawn in the plane the turn happens in, so the turn IS the
       drawing: it is baked into the vertices, the same thing the pad's own rotate handle
       does, and `rotBaked` remembers how much is in there so a repeat of the same angle
       does not turn it twice. Plan shows the turned outline; Elevation shows the band
       narrow or widen as the footprint swings, which is the foreshortening a turned deck
       actually has.

       A FRONT outline is drawn in a plane the turn is NOT in. Baking it would tilt the
       elevation of a wall that is standing perfectly upright — the wrong rotation
       entirely — so the angle is carried on the item and used where each view can
       honestly show it: the footprint swings in Plan, and the face foreshortens in
       Elevation. It is also STATED on the wire, because for these shapes the pad has a
       rotation field and the take should take the pad's word for it. */
    if (typeof m.rot === 'number' && isFinite(m.rot)) {
      if (own === 'elevation') it.yawDeg = m.rot;
      else {
        const delta = m.rot - (it.rotBaked || 0);
        if (Math.abs(delta) > 0.01) {
          spinSolid(it, -delta * Math.PI / 180);
          it.rotBaked = m.rot;
        }
      }
    }
    if (S.sel === i) showSolidRow(i);
    agreeWithScene(it);
    flash(solidTitle(it) + ' — moved in the scene');
  },
  /* v5.8 · RESIZED IN THE ROOM. The take holds it as a transform — it is an ask, not an
     authored change — and this is where it becomes geometry, because the pad is the only
     surface that holds the fit and so the only one entitled to rewrite the outline.
     `scaleBaked` remembers how much of the take's transform is already in the vertices,
     so a message repeating the same size does not stretch the shape twice. */
  solidScaled(m) {
    const i = solidFor(m.srcId);
    if (i < 0 || !Array.isArray(m.scale)) return;
    const it = S.items[i], own = it.view || 'plan';
    const sc = m.scale.map(Number).map(v => (isFinite(v) && v > 0 ? v : 1));
    const had = it.scaleBaked || [1, 1, 1];
    /* WHICH TWO OF THE THREE ARE ON THIS PAGE. The room counts [across, up, depth]; a
       floor outline is drawn in across/depth and a front one in across/up. The third is
       a named field with its own control — height for a deck, the sweep for a wall — and
       is not a stretch of the drawing. */
    const pick = own === 'elevation' ? [0, 1] : [0, 2];
    const fx = sc[pick[0]] / (had[pick[0]] || 1);
    const fy = sc[pick[1]] / (had[pick[1]] || 1);
    if (Math.abs(fx - 1) > 0.002 || Math.abs(fy - 1) > 0.002) {
      mark();
      stretchSolid(it, fx, fy);
      it.scaleBaked = sc.slice();
      it.edited = true;
    } else it.scaleBaked = sc.slice();
    if (S.sel === i) showSolidRow(i);
    agreeWithScene(it);
    flash(solidTitle(it) + ' — resized in the scene');
  },
  /* v5.8 · WHICH SCREENS ARE ONE CANVAS, as the Scene Study holds it. The pad cannot work
     this out for itself — it takes the geometry of the room to say what a canvas is — so it
     is told, and it draws the tie and offers the way out of it. */
  /* v5.8 · WHAT THE TAKE ALREADY HOLDS. The counterpart of `objects` and the opposite kind
     of thing: those are the room's and are drawn as shadows, this is the take's and is
     REDRAWN — as real, editable outlines, because a solid is an outline and the pad is the
     surface that authors outlines. Sent on the handshake, so opening or reloading the pad
     no longer starts on blank paper beside a scene full of shapes, and again whenever a
     shape appears out there that the paper did not draw. */
  scene(m) {
    const id = m.takeId || null;
    /* ANOTHER TAKE IS ANOTHER SHOW. What this pad adopted from the last one describes
       nothing here, so it is taken off the paper — and only what was ADOPTED is: anything
       somebody drew themselves is theirs and stays, whichever take is open. */
    if (id !== sceneTakeId) { dropAdopted(); sceneTakeId = id; }
    sceneSolids = Array.isArray(m.solids) ? m.solids : [];
    adoptSceneSolids();
  },
  /* v5.8 · what is standing in the room. Not editable and not selectable: it is a shadow of
     something that lives in the Scene Study, and the only thing to do with it here is not draw
     through it. */
  objects(m) {
    roomObjects = (m.objects || []).filter(o => o && o.id && (o.w || 0) > 0 && (o.d || 0) > 0);
    draw(); status();
  },
  /* v5.8 · WHICH SURFACES THAT MODEL OFFERS. The footprint above stops the paper drawing
     through an import; this is what lets somebody draw WITH one — the Scene Study's
     segmentation of it, as the outline each face would become. Not editable either, but
     unlike the footprint it is SELECTABLE: right-click one and the room builds it. */
  objectFaces(m) {
    roomFaces = (m.faces || []).filter(f => f && f.id && (f.poly || f.line));
    /* A HELD FACE THAT HAS BEEN TAKEN, OR DELETED, OR WHOSE MODEL HAS GONE IS NOT HELD ANY
       MORE. Without this a set survives its own faces and the next DEL asks the room to
       delete things that are not there. */
    if (faceHover && !roomFaces.some(f => f.id === faceHover && !f.taken)) faceHover = null;
    [...faceHeld].forEach(id => {
      if (!roomFaces.some(f => f.id === id && !f.taken)) faceHeld.delete(id);
    });
    if (faceSel && !roomFaces.some(f => f.id === faceSel)) faceSel = null;
    draw(); status();
  },
  ledLinks(m) {
    ledCanvases = (m.links || []).map(g => ({ id: g.id, sids: (g.srcIds || []).filter(Boolean) }))
      .filter(g => g.sids.length > 1);
    draw(); status();
  },
  /* v5.5 · somebody picked the shape in the Scene Study */
  selectSolid(m) {
    const i = m.srcId ? S.items.findIndex(x => x.t === 'solid' && x.sid === m.srcId) : -1;
    /* THE WHOLE SET ARRIVES, or the room shift-selecting three walls would land here as
       one and throw the other two away. Ids the pad does not know are simply not held —
       a shape built from a plan the pad never drew has no outline here to light. */
    S.selMany.clear();
    const many = Array.isArray(m.srcIds) ? m.srcIds.filter(x => x) : [];
    many.forEach(sid => { if (S.items.some(x => x.t === 'solid' && x.sid === sid)) S.selMany.add(sid); });
    /* the same key `announceSelection` builds, or the very next frame posts this straight
       back as news — see the note there */
    announced = (m.srcId || null) + '|' + [...S.selMany].join(',');
    /* v5.8 · AND A FACE, WHEN THAT IS WHAT IT NAMES. This is what makes a face STAY selected
       after it is taken: the host fans the new solid's `srcId` out to this panel, no item
       here has it, and until now that meant the paper simply cleared its selection. */
    faceSel = (i < 0 && m.srcId && roomFaces.some(f => f.id === m.srcId)) ? m.srcId : null;
    S.sel = i;
    if (i >= 0) showSolidRow(i); else hideSolidRow();
    draw(); status();
  },
};

window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.v !== AGENT_V || !IN[d.type]) return;
  devLog('in', d.type, d);
  IN[d.type](d);
});

/* the tool never transcribes a colour: the host's resolved values are written
   straight onto :root */
function applyTokens(tokens) {
  Object.entries(tokens).forEach(([k, v]) => {
    if (k.startsWith('--') && typeof v === 'string') document.documentElement.style.setProperty(k, v);
  });
}

/* ---------- standalone: the panel must exercise itself, or "separate file" is
     a slogan. BUILD 3D cannot reach the API from here by design — this panel is
     never an API client — so it prints the payload it would have posted. ---------- */
const devLines = [];
function devLog(dir, type, body) {
  if (EMBEDDED) return;
  devLines.unshift('<div class="l ' + dir + '">' + (dir === 'out' ? '→ ' : '← ') + type + ' '
    + (body ? summarise(body) : '') + '</div>');
  devLines.length = Math.min(devLines.length, 40);
  document.getElementById('dev').innerHTML = devLines.join('');
}
function summarise(o) {
  return JSON.stringify(o, (k, v) => {
    if (v instanceof ArrayBuffer) return '[' + v.byteLength + ' bytes]';
    if (k === 'strokes' && Array.isArray(v)) return '[' + v.length + ' strokes]';
    return v;
  }).slice(0, 220);
}

/* ==========================================================================
   1 · STATE — the vector record IS the state. The canvas is a rendering of it,
   which is what makes undo, erase and the payload the same three lines of code.
   ========================================================================== */
const S = {
  /* TRACE is the default because the primary gesture in this prototype is drawing an
     object, not annotating a page. It is also the gesture that has a meaningful live
     3D preview; PEN remains available for marks the model should interpret. */
  tool: 'trace',
  projection: 'plan',
  armedFrom: 'select',    // the tool a stamp came from, and goes back to
  armedSticky: false,     // shift-armed: stay in stamp mode and keep placing
  items: [],            // {t:'stroke'|'stamp'|'label', …}
  origin: null,         // [x, y] in canvas px; centre when null
  groundLine: null,     // elevation only
  scale: null,          // { pxPerMetre, metres, from, to }
  sel: -1,              // index of a selected stamp
  /* MORE THAN ONE, by SHIFT. Held as ids rather than indices because an index is a
     position in a list that erase, undo and the interpreter all reorder — a selection
     that silently comes to mean a different shape is worse than no selection. */
  selMany: new Set(),
  armed: null,          // a stamp label waiting for a click
  busy: false,
  lastPlan: null,
  underlay: null,

   and nobody can read its dimensions. But the WRONG fix is to reduce it to a

   So the pad does what a draughtsman does. It reads the drawing, decides which

function dedupe(pts) {

/* uniform arc-length resample. Without this, RDP's tolerance means one thing

function resample(pts, step) {
  if (pts.length < 2) return pts.slice();

  for (let i = 1; i < pts.length; i++) {
    let a = out[out.length - 1], b = pts[i];
    let d = vdist(a, b);
    while (carry + d >= step) {
      const t = (step - carry) / d;
      const n = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];

      a = n; d = vdist(a, b); carry = 0;

   the same point and the base segment has zero length, every perpendicular
   distance comes out zero, and the whole shape reduces to one vertex. So the loop
   is split at the point furthest from its start and the two halves are simplified
   separately — which is also the standard fix, and the reason a rectangle came
   back as a dot until it was in. */

    for (let i = 1; i < P.length - 1; i++) { const d = vdist(P[i], P[0]); if (d > fd) { fd = d; far = i; } }
    keep.add(far);

function circleFit(run) {
  const n = run.length;
  if (n < 3) return null;
  let Sx = 0, Sy = 0, Sxx = 0, Syy = 0, Sxy = 0, Sxz = 0, Syz = 0, Sz = 0;
  run.forEach(([x, y]) => {
    const z = x * x + y * y;
    Sx += x; Sy += y; Sxx += x * x; Syy += y * y; Sxy += x * y;
    Sxz += x * z; Syz += y * z; Sz += z;
  });
  const M = [[Sxx, Sxy, Sx], [Sxy, Syy, Sy], [Sx, Sy, n]];
  const V = [-Sxz, -Syz, -Sz];
  const det = (m) => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1])
                   - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0])
                   + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
  const D0 = det(M);
  if (Math.abs(D0) < 1e-9) return null;                     // collinear: no circle
  const col = (k) => M.map((row, i) => row.map((v, j) => (j === k ? V[i] : v)));
  const D = det(col(0)) / D0, E = det(col(1)) / D0, F = det(col(2)) / D0;
  const cx = -D / 2, cy = -E / 2;
  const r2 = cx * cx + cy * cy - F;

    let d = a1 - a0;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    if (d === 0) continue;
    const s = Math.sign(d);

/* THE ONE DEFINITION OF A BULGE, and everything else derives from it:

  const mid = [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2];
  const chord = vsub(p1, p0), d = vlen(chord) / 2;

  const n = vperp(chord).map(v => v / (d * 2));

     far side, and taking the near side would quietly halve the shape. */
  const toMid = vsub(mid, fit.c), tl = vlen(toMid) || 1;
  const far = Math.abs(sweep) > Math.PI;
  const u = [toMid[0] / tl * (far ? -1 : 1), toMid[1] / tl * (far ? -1 : 1)];
  const apex = [fit.c[0] + u[0] * fit.r, fit.c[1] + u[1] * fit.r];
  return +(vdot(vsub(apex, mid), n) / d).toFixed(4);

/* bulge → the points that draw it. The reader picks the resolution; the arc is

  const d = c / 2, sag = bulge * d;
  const r = Math.abs((d * d + sag * sag) / (2 * sag));

  const cen = [p0[0] + chord[0] / 2 + n[0] * (sag - Math.sign(sag) * r),

  const a0 = Math.atan2(p0[1] - cen[1], p0[0] - cen[0]);
  /* how finely to walk it: the angle whose chord sits `chordTol` inside the arc.

     in the Scene Study — and the arc is exact at either. */
  const step = 2 * Math.acos(Math.max(-1, Math.min(1, 1 - Math.min(r, chordTol || 0.25) / r)));
  const segs = Math.max(3, Math.min(240, Math.ceil(Math.abs(theta) / Math.max(step, 0.02))));

  for (let i = 0; i <= segs; i++) {
    const a = a0 - theta * (i / segs);
    out.push([cen[0] + Math.cos(a) * r, cen[1] + Math.sin(a) * r]);

}
/* radius and arc length of a bulged segment — what the panel prints and what the

function arcInfo(p0, p1, bulge) {
  const c = vdist(p0, p1);
  if (!bulge || c < 1e-6) return { r: Infinity, len: c, sweep: 0 };
  const d = c / 2, sag = bulge * d;
  const r = Math.abs((d * d + sag * sag) / (2 * sag));

/* ---------- 2 · 3 · the fit itself ---------- */
function fitPath(raw, opt) {

      /* AND IT HAS TO BE VISIBLY CURVED. A jittery straight line fits a circle of
         enormous radius perfectly well, and turns far enough to pass a sweep test,
         so without this a hand-drawn stage edge came back as three gentle arcs of
         300-metre radius — technically a good fit, and a lie about the drawing.
         The rule: if the arc departs from its own chord by no more than the noise
         we just simplified away, a STRAIGHT is the truer story. */
      const bulge = bulgeFor(work[keys[a]], work[keys[b]], fit, sweep);
