      if (Math.abs(hit.sweep) > ARC_MAX_SWEEP) {
        const mid = Math.floor((keys[a] + keys[hit.b]) / 2);
        const halves = [[keys[a], mid], [mid, keys[hit.b]]];
        halves.forEach(([i0, i1]) => {
          const run = work.slice(i0, i1 + 1);
          const f = circleFit(run) || hit.fit;
          const s = sweepOf(run, f) || hit.sweep / 2;
          verts.push(work[i0].slice());
          bulges.push(bulgeFor(work[i0], work[i1], f, s));
          arcs++;
        });
      } else {
        verts.push(work[keys[a]].slice());
        bulges.push(hit.bulge);
        arcs++;
      }
      a = hit.b;
    } else {
      verts.push(work[keys[a]].slice());
      bulges.push(0);
      a++;
    }
  }
  /* the last key closes the chain: on an open path it is a vertex with no segment
     after it, on a closed one it IS the first vertex and must not be repeated */
  if (!closed) verts.push(work[keys[keys.length - 1]].slice());
  else bulges.length = verts.length;

  const out = { verts, bulges, closed, arcs, rawCount: raw.length, tol };
  if (opt.snap) regularise(out, opt);
  if (opt.sym && closed) out.symmetric = symmetrise(out, opt);
  out.rms = rmsAgainst(out, P);
  return out;
}

/* ---------- 4 · REGULARISE — the corrections that make it buildable ---------- */
function regularise(f, opt) {
  const q = opt.snapPx;
  if (q > 0) f.verts = f.verts.map(p => [Math.round(p[0] / q) * q, Math.round(p[1] / q) * q]);
  /* a segment within AXIAL_DEG of the page's axes is MADE axial, by moving both of
     its ends onto the average — which keeps a closed loop closed, where rotating
     the segment would have opened it */
  const n = f.verts.length, last = f.closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    if (f.bulges[i]) continue;
    const j = (i + 1) % n;
    const A = f.verts[i], B = f.verts[j];
    const dx = B[0] - A[0], dy = B[1] - A[1];
    if (!dx && !dy) continue;
    const ang = Math.abs(Math.atan2(dy, dx) * 180 / Math.PI);
    if (Math.min(ang, 180 - ang) < AXIAL_DEG) { const y = (A[1] + B[1]) / 2; A[1] = y; B[1] = y; }
    else if (Math.abs(90 - ang) < AXIAL_DEG) { const x = (A[0] + B[0]) / 2; A[0] = x; B[0] = x; }
  }
  /* arc radii to a buildable step. The endpoints are facts — the drawing put them
     there — so the radius moves and the bulge is recomputed to keep them. */
  const qr = opt.radiusPx;
  if (qr > 0) {
    for (let i = 0; i < last; i++) {
      const b = f.bulges[i];
      if (!b) continue;
      const A = f.verts[i], B = f.verts[(i + 1) % n];
      const info = arcInfo(A, B, b);
      if (!isFinite(info.r)) continue;
      const d = vdist(A, B) / 2;
      let r = Math.max(d, Math.round(info.r / qr) * qr);
      const root = Math.sqrt(Math.max(0, r * r - d * d));
      const sag = Math.abs(b) > 1 ? r + root : r - root;     // major arc keeps the far side
      f.bulges[i] = +(Math.sign(b) * sag / d).toFixed(4);
    }
  }
}

/* ---------- 5 · SYMMETRISE ----------
   Only for a closed shape, and only about the vertical axis through the centroid,
   because that is the axis a stage actually has. The match is found by reversing
   the loop and rotating it — n² on twenty-odd vertices, which is nothing — and it
   is applied only if the whole loop agrees. A shape that is not symmetric is left
   exactly as drawn and says so. */
function symmetrise(f, opt) {
  const n = f.verts.length;
  if (n < 4) return false;
  const cx = f.verts.reduce((s, p) => s + p[0], 0) / n;
  const mir = (p) => [2 * cx - p[0], p[1]];
  let best = null;
  for (let k = 0; k < n; k++) {
    let sum = 0;
    for (let i = 0; i < n; i++) {
      const j = (k - i + n * 2) % n;                          // reversed and rotated
      sum += vdist(f.verts[i], mir(f.verts[j])) ** 2;
    }
    const rms = Math.sqrt(sum / n);
    if (!best || rms < best.rms) best = { k, rms };
  }
  if (!best || best.rms > f.tol * 2.5) return false;
  const verts = f.verts.map(p => p.slice()), bulges = f.bulges.slice();
  for (let i = 0; i < n; i++) {
    const j = (best.k - i + n * 2) % n;
    const m = mir(f.verts[j]);
    verts[i] = [(f.verts[i][0] + m[0]) / 2, (f.verts[i][1] + m[1]) / 2];
    /* The segment LEAVING vertex i mirrors the segment ARRIVING at its partner —
       so it pairs with jb, not with j. And the two bulges have the SAME sign, not
       opposite ones: reflecting the shape flips the sign and traversing the partner
       backwards flips it again. Getting that wrong cancelled every arc that crossed
       the axis, which is exactly the one a curved thrust is made of. A segment that
       is its own partner (the front of a thrust) then averages with itself and is
       left alone, which is the right answer for free. */
    const jb = (j - 1 + n) % n;
    bulges[i] = +(((f.bulges[i] || 0) + (f.bulges[jb] || 0)) / 2).toFixed(4);
  }
  f.verts = verts; f.bulges = bulges;
  return true;
}

/* what the correction cost, in pixels. Printed, because a correction nobody can
   see is a lie. */
function rmsAgainst(f, P) {
  const poly = fitPoints(f, 0.5);
  if (poly.length < 2) return 0;
  let sum = 0;
  P.forEach((p) => {
    let d = Infinity;
    for (let i = 1; i < poly.length; i++) d = Math.min(d, segDist(p, poly[i - 1], poly[i]));
    sum += d * d;
  });
  return +Math.sqrt(sum / P.length).toFixed(2);
}
function segDist(p, a, b) {
  const ab = vsub(b, a), L2 = vdot(ab, ab);
  if (!L2) return vdist(p, a);
  let t = vdot(vsub(p, a), ab) / L2;
  t = Math.max(0, Math.min(1, t));
  return vdist(p, [a[0] + ab[0] * t, a[1] + ab[1] * t]);
}

/* the fitted path as a polyline, for drawing and for hit-testing */
function fitPoints(f, chordTol) {
  const n = f.verts.length, last = f.closed ? n : n - 1;
  const out = [];
  for (let i = 0; i < last; i++) {
    const A = f.verts[i], B = f.verts[(i + 1) % n];
    const seg = arcPts(A, B, f.bulges[i] || 0, chordTol || 0.25);
    seg.forEach((p, k) => { if (k || !out.length) out.push(p); });
  }
  if (!last && f.verts.length) out.push(f.verts[0]);
  return out;
}

/* ---------- LED: A CURVE DOES NOT BEND, IT FACETS ----------
   An LED wall is flat cabinets on a frame. So a curved LED path is not a curved
   surface: it is a chain of FLAT panels, each a whole number of cabinets wide,
   and the number of them is decided by how far the flat chord may sit from the
   curve the hand drew — half a cabinet. That is the physical truth of the thing,
   and it is why LED gets its own builder rather than the wall's. */
function ledFacets(f, tilePx) {
  const out = [];
  const n = f.verts.length, last = f.closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const A = f.verts[i], B = f.verts[(i + 1) % n], b = f.bulges[i] || 0;
    if (!b) { out.push([A, B]); continue; }
    const info = arcInfo(A, B, b);
    /* chord sagitta of one facet ≈ r(1 - cos(φ/2)); solve for the φ that keeps it
       under half a tile, then take a whole number of facets */
    const allow = tilePx * 0.5;
    const phi = 2 * Math.acos(Math.max(-1, Math.min(1, 1 - allow / info.r)));
    const count = Math.max(1, Math.ceil(Math.abs(info.sweep) / Math.max(phi, 0.05)));
    const pts = arcPts(A, B, b, 0.25);
    for (let k = 0; k < count; k++) {
      const p0 = pts[Math.round((k / count) * (pts.length - 1))];
      const p1 = pts[Math.round(((k + 1) / count) * (pts.length - 1))];
      out.push([p0, p1]);
    }
  }
  return out.map(([a, b]) => {
    const L = vdist(a, b);
    const cols = Math.max(1, Math.round(L / tilePx));
    return { a, b, len: L, cols };
  });
}

/* ==========================================================================
   2c · SOLIDS IN THE PAD — a fitted curve as an editable object.

   A solid is an item like a stroke or a stamp: it lives in `S.items`, so undo,
   erase, the two views and the payload are the same three lines of code they
   already were. What it holds is the RAW ink it was traced from and the FIT that
   was made of it, side by side and both drawn — because the whole feature is a
   correction, and a correction you cannot see against the thing it corrected is
   just a different drawing.

   Every knob is PER SOLID, not global: two stages in one drawing are allowed to
   be simplified differently, and the one you are editing is the one the row at
   the bottom is about.
   ========================================================================== */
const solidDefaults = (role) => ({
  role,
  name: '',
  hM: SOLID_ROLES[role].h,
  baseM: 0,
  thickM: role === 'stage' ? 0.5 : 0.1,
  tolM: FIT_TOL_M,
  snap: true,
  sym: role !== 'wall',
  closedPref: undefined,          // undefined = let the drawing decide
  tileM: { w: TILE_M.w, h: TILE_M.h },
  edited: false,                  // a hand-moved vertex; a refit would throw it away
});

/* the fit options in PIXELS, from the metre-denominated knobs and the scale that
   is in force. One place, so the tolerance means the same thing at every zoom. */
function fitOptsFor(it) {
  const s = pxPerMetre();
  return {
    tol: Math.max(1.5, it.tolM * s),
    snap: it.snap, snapPx: it.snap ? SNAP_M * s : 0,
    radiusPx: it.snap ? RADIUS_Q_M * s : 0,
    sym: it.sym, maxR: 250 * s,
    closed: it.closedPref,
  };
}
function refit(it) {
  const f = fitPath(it.raw, fitOptsFor(it));
  if (f) { it.fit = f; it.edited = false; }
  return !!f;
}
/* THE TRACE IN PROGRESS, AS A SHAPE. Fitted the same way a finished one is — there is no
   second, looser fitter for previews, because a preview that is fitted differently from
   the thing it previews is a lie with a short lifespan. It is not pushed into `S.items`:
   it exists for one frame of the ghost and is replaced by the real shape on pointerup. */
function draftFrom(pts, view, objectId) {
  if (!pts || pts.length < 3) return null;
  const it = makeSolid(pts, S.role, view || S.projection);
  if (!it) return null;
  it.sid = objectId || nextItemId('shape');
  return it;
}

/* Every drawing tool gets the same provisional 3D lane. The stored result is still
   exactly what that tool always produced (a stroke for PEN/LINE/RECT/ELLIPSE, a solid
   for TRACE); this only translates the gesture that is currently under the pointer
   into enough outline points for Scene Study to render a translucent preview. */
function draftPoints(item) {
  if (!item || !item.pts || item.pts.length < 2) return null;
  const a = item.pts[0], b = item.pts[item.pts.length - 1];
  if (item.t === 'trace' || item.kind === 'pen') return item.pts;
  if (item.kind === 'line') {
    /* draftFrom deliberately rejects two-point taps; the midpoint keeps a real line a
       line while giving the fitter a proper run to work with. */
    return [a, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], b];
  }
  if (item.kind === 'rect') {
    return [a, [b[0], a[1]], b, [a[0], b[1]], a];
  }
  if (item.kind === 'ellipse') {
    const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
    const rx = Math.abs(b[0] - a[0]) / 2, ry = Math.abs(b[1] - a[1]) / 2;
    if (rx < 2 || ry < 2) return null;
    return Array.from({ length: 33 }, (_, i) => {
      const q = Math.PI * 2 * i / 32;
      return [cx + Math.cos(q) * rx, cy + Math.sin(q) * ry];
    });
  }
  return null;
}

function previewGesture(item) {
  if (!S.live) return;
  const now = Date.now();
  if (now - draftAt < 70) return;
  draftAt = now;
  /* A NEGATIVE DRAG IS NOT A SHAPE BEING ADDED, so it must not be previewed as one.
     It becomes a provisional hole on the solid it started in, and the parent carries
     it — see `solidToTake`. Nothing is previewed at all if the gesture has no target,
     because a subtraction with nothing to subtract from is not yet anything. */
  if (item.negative) {
    draftSolid = null;
    const solid = draftFrom(draftPoints(item), item.view || S.projection,
                            item.oid || (item.oid = nextItemId('cutout')));
    draftCut = solid ? { solid } : null;
    liveNow();
    return;
  }
  draftCut = null;
  draftSolid = draftFrom(draftPoints(item), item.view || S.projection,
                         item.oid || (item.oid = nextItemId('stroke')));
  /* Plane ownership belongs to the object, never to whichever tab is currently open.
     Without this, changing PLAN → ELEVATION reinterpreted an existing floor rectangle
     as a vertical one on the next preview push. */
  if (draftSolid) draftSolid.view = item.view || S.projection;
  liveNow();
}

/* Completed drawing gestures stay visible as provisional geometry until BUILD 3D,
   erase/clear, or LIVE OFF. They never enter `solidsOut()`, so persistence in the
   preview lane cannot accidentally turn them into committed scene geometry. */
/* WHAT IS BUILDABLE IS NOT A QUESTION ABOUT THE PREVIEW. This used to answer "nothing"
   whenever LIVE was off — which is right for the ghost lane and wrong for BUILD, and
   BUILD is the other caller. So a rectangle drawn with LIVE off was a rectangle the
   button could not see: it greyed out, and pressing it said there was nothing to build
   while the thing to build was on the paper. The lane decides what it previews; it does
   not decide what exists. */
function strokeGhostsOut() {
  return S.items.filter(it => it.t === 'stroke').map(it => {
    const draft = draftFrom(draftPoints(it), it.view || 'plan',
                            it.oid || (it.oid = nextItemId('stroke')));
    if (!draft) return null;
    draft.view = it.view || 'plan';
    draft.sid = it.oid;
    return solidTakes(draft);
  }).filter(Boolean).flat();
}

/* THE NAME BOTH SURFACES KNOW A PERSON BY. A shape travels by the id of its trace; a
   PERSON travels by this, because it is what the figure in the room is keyed on and what
   the take records as the person's source. Assigned on first use from either side — the
   selection may be announced before any preview has been pushed — so the two can never
   end up naming the same person differently. */
const personGhostId = (it) => it.ghostSid || (it.ghostSid = 'person-ghost-' + (++solidSeq));

function stampPreviewOps() {
  const U = HOST.unitsPerMetre;
  const deviceReq = { PROJ: 'projectors', CAM: 'capture' };
  return S.items.filter(it => it.t === 'stamp').map(it => {
      const label = String(it.label).toUpperCase();
      const w = stampWorld(it);
      const at = [+(w.x * U).toFixed(1), +(w.z * U).toFixed(1), +(w.y * U).toFixed(1)];
      let look = null;
      if (it.aim !== undefined && it.aim !== null) {
        const a = it.aim * Math.PI / 180;
        const len = Math.max(it.aimLen || 34, 1);
        const aimView = it.aimView || it.view || 'plan';
        const start = worldToPageIn(w, aimView);
        const end = [start[0] + Math.cos(a) * len, start[1] + Math.sin(a) * len];
        const q = pageToWorld(end, aimView);
        look = [+(q.x * U).toFixed(1), +(q.z * U).toFixed(1), +(q.y * U).toFixed(1)];
      }
      if (label === 'PERSON') return {
        id: personGhostId(it),
        /* one person, not a one-person crowd: no width and no depth, because those are
           the two numbers a region has and a person does not */
        kind: 'person', confidence: 'declared', why: 'PERSON stamped in the sketch pad',
        at, look, view: it.view || 'plan', provisional: true };
      if (label === 'AUDIENCE') return {
        id: it.ghostSid || (it.ghostSid = 'audience-ghost-' + (++solidSeq)),
        kind: 'audience', confidence: 'declared', why: 'AUDIENCE stamped in the sketch pad',
        at, look,
        w: 80, d: 50, view: it.view || 'plan', provisional: true };
      const req = deviceReq[label];
      if (!req) return null;
      return { id: it.ghostSid || (it.ghostSid = label.toLowerCase() + '-ghost-' + (++solidSeq)),
        kind: 'add', req, confidence: 'declared',
        why: label + ' anchored in the sketch pad', at, look,
        view: it.view || 'plan', provisional: true };
    }).filter(Boolean);
}

function sketchInventory() {
  const ppm = pxPerMetre();
  return S.items.map(it => {
    const id = it.oid || it.sid || (it.oid = nextItemId(it.t));
    if (it.t === 'solid') {
      const s = solidToTake(it), xs = s.verts.map(v => v[0]), ys = s.verts.map(v => v[1]);
      if (built.has(s.id)) return null;
      return { id, kind: 'shape', name: it.name || it.role.toUpperCase(), role: it.role,
        view: it.view || 'plan', w: (Math.max(...xs) - Math.min(...xs)) / HOST.unitsPerMetre,
        d: s.plane === 'floor' ? (Math.max(...ys) - Math.min(...ys)) / HOST.unitsPerMetre : s.thick / HOST.unitsPerMetre,
        h: s.plane === 'front' ? (Math.max(...ys) - Math.min(...ys)) / HOST.unitsPerMetre : s.h / HOST.unitsPerMetre };
    }
    if (it.t === 'stroke') {
      const pts = draftPoints(it) || it.pts, xs = pts.map(v => v[0]), ys = pts.map(v => v[1]);
      return { id, kind: 'shape', name: (it.kind || 'DRAWING').toUpperCase(),
        role: (it.view || 'plan') === 'elevation' ? 'wall' : 'stage', view: it.view || 'plan',
        w: (Math.max(...xs) - Math.min(...xs)) / ppm,
        d: (it.view || 'plan') === 'plan' ? (Math.max(...ys) - Math.min(...ys)) / ppm : 0.1,
        h: (it.view || 'plan') === 'elevation' ? (Math.max(...ys) - Math.min(...ys)) / ppm : 0.5 };
    }
    if (it.t === 'stamp') return { id, kind: 'anchor', name: it.label, role: String(it.label).toLowerCase(),
      view: it.view || 'plan', w: 0, d: 0, h: 0 };
    return null;
  }).filter(Boolean);
}

function makeSolid(raw, role, creationView) {
  /* A neutral closed outline in elevation is a surface, not a floor deck standing on
     edge. A semantic stamp may replace this immediately. */
  const ownView = creationView || S.projection;
  if (role === 'stage' && ownView === 'elevation') role = 'wall';
  const it = Object.assign({ t: 'solid', view: ownView, raw: raw.map(p => [p[0], p[1]]) },
                           solidDefaults(role));
  /* WHAT THE DRAWING SAID, and then what we do anyway. A hand rarely closes a loop
     exactly, and a shape that came back open was built as a ribbon with nothing
     inside it — so a trace is CLOSED by default and gets a face. The drawing's own
     answer is remembered, because it is the right answer the moment somebody stamps
     the shape WALL or LED: those are runs, and a run is open. */
  const probe = fitPath(it.raw, Object.assign(fitOptsFor(it), { closed: undefined }));
  it.drawnClosed = !!(probe && probe.closed);
  /* A STRAIGHT DRAG IS A LINE, NOT A SLIVER. Closure is forced because a hand never
     quite closes a loop — but force it on a gesture that went in one direction and you
     get a closed shape of no area, which is a worse answer than the one the hand gave.
     So a path that never leaves its own chord stays OPEN, and stamping it WALL or LED
     then does the obvious thing. */
  it.straight = isStraightish(it.raw);
  /* AND A LINE IS A WALL, NOT A DECK. A closed outline gets a face because that is what
     a shape drawn on a plan is; a stroke that went in one direction has no face to fill,
     and calling it a deck produced a `stage` solid the 3D could not extrude at all — an
     open two-vertex outline has no area, so nothing appeared and the drawing looked
     ignored. A run is a wall: it renders, it can be projected on, and a stamp still
     renames it in one click. */
  if (it.straight && role === 'stage') {
    it.role = 'wall';
    if (!it.hTouched) it.hM = SOLID_ROLES.wall.h;
    it.sym = false;
  }
  it.closedPref = (SOLID_ROLES[it.role].closed === false || it.straight) ? it.drawnClosed : true;
  if (!refit(it)) return null;
  return it;
}

/* ---------- the numbers the panel prints, and the ones the payload carries ---------- */
/* how far the path strays from the straight line between its ends, as a fraction of
   that line. Below a few per cent it is a line somebody drew, whatever else it is. */
function isStraightish(raw) {
  if (raw.length < 3) return true;
  const a = raw[0], b = raw[raw.length - 1];
  const L = vdist(a, b);
  if (L < 1) return false;                     // a loop: the ends met
  let worst = 0;
  raw.forEach(p => { worst = Math.max(worst, segDist(p, a, b)); });
  return worst / L < 0.06;
}

function solidPoints(it, chordTol) { return fitPoints(it.fit, chordTol || 0.4); }
function solidBBox(it) {
  const p = solidPoints(it, 1);
  const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
  return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
}
function solidCentre(it) {
  const b = solidBBox(it);
  return [(b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2];
}
/* enclosed area, by shoelace over the tessellation — so an arc contributes the
   area an arc actually has rather than the area of its chord */
function solidArea(it) {
  if (!it.fit.closed) return 0;
  const p = solidPoints(it, 0.5);
  let a = 0;
  for (let i = 0; i < p.length; i++) {
    const q = p[i], r = p[(i + 1) % p.length];
    a += q[0] * r[1] - r[0] * q[1];
  }
  return Math.abs(a / 2) / (pxPerMetre() ** 2);
}
function solidLength(it) {
  const p = solidPoints(it, 0.5);
  let L = 0;
  for (let i = 1; i < p.length; i++) L += vdist(p[i - 1], p[i]);
  if (it.fit.closed && p.length > 1) L += vdist(p[p.length - 1], p[0]);
  return L / pxPerMetre();
}
/* LED, in cabinets. The grid is the point of an LED wall — a wall is not 15 m
   wide, it is 30 cabinets wide, and the difference is whether it can be built. */
function ledGrid(it) {
  const s = pxPerMetre();
  /* v5.8 · AN LED FLOOR IS A FACE, NOT A RUN — the same thing an elevation-drawn LED is, and
     the same arithmetic: the outline is the emitting surface, so the grid is its bounding box
     clipped to its own shape. The run branch below would instead read `hM` as a height and
     facet the perimeter, which is the upright reading of the very outline this is not. */
  if ((it.view || 'plan') === 'elevation' || isFlatLed(it)) {
    const poly = solidPoints(it, 0.5);
    const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
    const w = (Math.max(...xs) - Math.min(...xs)) / s;
    const h = (Math.max(...ys) - Math.min(...ys)) / s;
    const cols = Math.max(1, Math.round(w / it.tileM.w));
    const rows = Math.max(1, Math.round(h / it.tileM.h));
    let tiles = 0;
    const inside = p => pointInPoly(p, poly);
    for (let iy = 0; iy < rows; iy++) for (let ix = 0; ix < cols; ix++) {
      const p = [Math.min(...xs) + (ix + 0.5) * (Math.max(...xs) - Math.min(...xs)) / cols,
                 Math.min(...ys) + (iy + 0.5) * (Math.max(...ys) - Math.min(...ys)) / rows];
      if (inside(p)) tiles++;
    }
    return { facets: [{ cols }], rows, cols, tiles,
             w: cols * it.tileM.w, h: rows * it.tileM.h };
  }
  const facets = ledFacets(it.fit, Math.max(4, it.tileM.w * s));
  const rows = Math.max(1, Math.round(it.hM / it.tileM.h));
  const cols = facets.reduce((n, f) => n + f.cols, 0);
  return { facets, rows, cols, tiles: cols * rows,
           w: cols * it.tileM.w, h: rows * it.tileM.h };
}

/* ---------- the view it was drawn in, and the other one ----------
   Same rule as a stroke: a solid drawn in FRONT is a real thing in the room, so
   from above it is a line. The fitted geometry is re-projected rather than the raw
   ink, because the fit is what the solid IS. */
function solidPtsHere(it, chordTol) {
  const pts = solidPoints(it, chordTol);
  const own = it.view || 'plan';
  if (own === S.projection) return pts;
  /* A FOOTPRINT SEEN FROM THE FRONT IS ITS HEIGHT, NOT A LINE ON THE FLOOR. Every
     point of a plan outline is at Z 0, so projecting it through the room laid the
     whole deck flat on the ground line — and a height confirmed in the 3D, the one
     number the elevation exists to show, was the one thing the elevation refused to
     draw. `elevationProfile` draws it as what it is instead. */
  if (it.t === 'solid' && own === 'plan' && S.projection === 'elevation') return elevationProfile(it);
  const w = pts.map(p => worldOf(it, p));
  /* THE FOOTPRINT OF A TURNED WALL. Every point of a front outline is at the same depth,
     so from above the shape is a line — and a line is exactly the thing a turn about the
     vertical is visible on. Without this a wall swung 40° in the room went on lying flat
     across the plan, which is the one view that could have shown it. */
  yawWorld(it, w);
  return w.map(q => worldToPage(q));
}
/* turns a front shape's world points about the vertical through its own centre, in place.
   Positive `rot` is three's rotation about up: (across, depth) → (x cosθ + z sinθ,
   −x sinθ + z cosθ), and every point shares the centre's depth, so only the first term
   of each survives. */
function yawWorld(it, w) {
  const yaw = ((it.view || 'plan') === 'elevation' ? (it.yawDeg || 0) : 0) * Math.PI / 180;
  if (!yaw || !w.length) return w;
  const xs = w.map(q => q.x);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = w[0].y;
  const ca = Math.cos(yaw), sa = Math.sin(yaw);
  w.forEach(q => { const u = q.x - cx; q.x = cx + u * ca; q.y = cy - u * sa; });
  return w;
}

/* WHERE A POINT OF THIS SHAPE IS IN THE ROOM. `pageToWorld` can only answer for the two
   axes the page has; a front-drawn shape's third one is on the item, and this is the one
   place that has to remember to put it back. Without it every front-drawn shape read as
   standing on the setting line no matter where the room had moved it to. */
function worldOf(it, p) {
  const w = pageToWorld(p, it.view || 'plan');
  if ((it.view || 'plan') === 'elevation') w.y = it.depthM || 0;
  return w;
}

/* ---------- WHAT A PLAN SHAPE LOOKS LIKE FROM THE AUDIENCE ----------
   The outline says nothing about height, but the SOLID does: `baseM` is where it
   stands and `hM` is how far up it goes, and once somebody has pulled that height in
   the room it is a stated fact rather than a default. So from the front the shape is
   a band — its own width, from its base to its top.

   The width is the outline's X extent, which is what a draughtsman means by the
   elevation of a deck. A concave footprint's notch does not read from the front and
   is not pretended to; the plan is where that is answered. */
function elevationProfile(it) {
  const s = pxPerMetre(), ground = baseY('elevation');
  const xs = solidPoints(it, 0.5)
    .map(p => worldToPageIn(pageToWorld(p, 'plan'), 'elevation')[0]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  /* v5.8 · A FLOOR IS A PLATE AT A HEIGHT, not a band rising from the deck. `hM` is its
     ELEVATION, so the band this function draws for an extruded shape would say the screen
     fills everything underneath it — and dragging that band's top edge still means the one
     thing it should, which is "put it at this height". */
  if (isFlatLed(it)) {
    const y = ground - (it.hM || 0) * s;
    const t = Math.max(2, 0.04 * s);            // a screen has no thickness; draw it as a plate
    return [[x0, y - t], [x1, y - t], [x1, y], [x0, y], [x0, y - t]];
  }
  const foot = ground - (it.baseM || 0) * s;
  /* a shape with no height still has to be visible as a line rather than vanish */
  const top = foot - Math.max(it.hM || 0, 0.02) * s;
  return [[x0, top], [x1, top], [x1, foot], [x0, foot], [x0, top]];
}
/* the grab point for the height: the middle of the top edge, where the drag reads as
   "lift the top of this", rather than a corner, which reads as "resize it" */
function heightHandleAt(it) {
  const p = elevationProfile(it);
  return [(p[0][0] + p[1][0]) / 2, p[0][1]];
}
const HEIGHT_HANDLE_HIT = 9;
/* the whole top edge is the target, not only the dot — a 9 px circle on an 8 m band is
   a pixel-hunt, and there is nothing else up there to hit by mistake */
function hitHeightHandle(p) {
  const i = S.sel, it = i >= 0 ? S.items[i] : null;
  if (!hasProfile(it) || it.locked) return null;
  const q = elevationProfile(it);
  if (segDist(p, q[0], q[1]) > HEIGHT_HANDLE_HIT) return null;
  return { i, h0: it.hM, y0: p[1] };
}
/* PULLED ON THE PAPER, and it means exactly what pulling the yellow arrow in the room
   means: somebody has stated this height in a view that can judge it, so the plan-view
   cap stands aside from here on — see `capped` in solidRecord. */
function dragHeight(d, p, coarse) {
  const it = S.items[d.i];
  if (!it) return;
  let h = d.h0 + (d.y0 - p[1]) / pxPerMetre();
  if (coarse) h = Math.round(h / 0.05) * 0.05;      // SHIFT rounds to 5 cm, like the 3D
  it.hM = Math.max(0.05, Math.min(20, +h.toFixed(3)));
  it.hTouched = true;
  it.hFree = true;
  draw(); showSolidRow(d.i);
  liveNow();          // LIVE means live: the deck grows in the Scene Study as you pull
}

/* THE INVERSE of `solidPtsHere`. A boolean result comes back in the page as it is
   projected NOW; a fit is stored in the space the shape was DRAWN in. Note it is
   `worldToPageIn` and not `worldToPage` — the latter takes no view and would quietly
   land the result back in the current projection, which is right exactly as often as
   the two views happen to match. */
function pageToItemSpace(it, pts) {
  return ((it.view || 'plan') === S.projection)
    ? pts.map(p => [p[0], p[1]])
    : pts.map(p => worldToPageIn(pageToWorld(p, S.projection), it.view || 'plan'));
}

/* ==========================================================================
   2d · WHAT LEAVES THE PAD — take units, and why they are converted HERE.

   Everywhere else this panel declares and converts nothing: pixels and the scale
   travel, and the far side does the arithmetic once. A solid is the exception, and
   deliberately: the panel is the only thing that holds the fit — it decided which
   runs were arcs, which vertices survived and what radius each arc was rounded to —
   so it is not a second opinion about the geometry, it is the ONLY opinion. Handing
   the far side pixels and asking it to re-derive the fit would be the second
   opinion.

   So a solid crosses the wire in TAKE UNITS, like everything on the scene bridge.

   AND THE AXES CHANGE HERE TOO, which is the one thing to be careful about. The
   pad draws Z-up (X across the page, Y into the room, Z up the page in FRONT). The
   take counts [x, up, depth]. A plan-drawn solid's page-y is DEPTH; a front-drawn
   solid's page-y is HEIGHT and runs the other way, which mirrors the plane — so its
   bulges change sign, because a mirrored arc curves the other way.
   ========================================================================== */
/* ==========================================================================
   WHAT THE CUTS MAKE OF A SHAPE. Nothing here mutates anything: the fit stays the
   fit, every cut stays a red `cutout` item you can see and delete, and the geometry
   that leaves the pad is DERIVED from the two of them. That is what makes cuts
   cumulative — each red shape you add is another subtraction in this loop — and what
   makes deleting one give the shape its piece back.

   Two kinds of cut, and the distinction earns its keep: one that lands WHOLLY INSIDE
   is recorded as a hole and the outline is never touched, so the arcs survive. Only a
   cut that CROSSES the outline goes through the clipper, and only then does the
   affected span become straight — a boolean result is a polygon and has no radii.
   ========================================================================== */
/* A CUT BELONGS TO THE SHAPE IT CUTS, NOT TO THE VIEW YOU HAPPEN TO BE LOOKING FROM.

   This whole function used to run in the CURRENT page: `solidPtsHere` for the shape,
   `!isShadow(x)` for the cutters. Both halves broke the moment you changed projection.
   The cutters were dropped outright, and the shape's own outline was reprojected — a
   plan footprint seen in elevation collapses onto the ground line, so its ring had no
   area, nothing overlapped it and `outers` came back empty. The opening vanished from
   the drawing, and a BUILD made from Elevation sent a deck with no hole in it at all.

   A boolean between a shape and its cutter is a fact about the DRAWING. It is settled
   in the space the two of them were drawn in, where both are real polygons, and it
   comes out the same from either view because the view was never part of it. */
function cutGeometryFor(it) {
  const base = solidPoints(it, 0.5);
  const out = { outlineCut: false, outers: [], holes: [] };
  if (base.length < 3 || !it.fit.closed) return out;

  const itView = it.view || 'plan';
  const sameSpace = (x) => (x.view || 'plan') === itView;
  const cutters = S.items.filter(x => x.t === 'cutout' && sameSpace(x))
                         .map(x => solidPoints(x, 0.5));
  if (draftCut && draftCut.solid && sameSpace(draftCut.solid)) cutters.push(solidPoints(draftCut.solid, 0.5));

  let rings = [polyRingArea(base) > 0 ? base : base.slice().reverse()];
  const holes = [];
  for (const cut of cutters) {
    if (!cut || cut.length < 3 || !rings.length) continue;
    const next = [];
    for (const ring of rings) {
      if (polyRingArea(ring) < 0) { next.push(ring); continue; }      // a hole stays a hole
      if (!polysOverlap(cut, ring)) { next.push(ring); continue; }
      if (polyInPoly(cut, ring)) {                                    // a clean opening
        next.push(ring);
        holes.push(polyRingArea(cut) > 0 ? cut.slice().reverse() : cut);
        continue;
      }
      out.outlineCut = true;                                          // it reached the edge
      next.push(...boolPoly(ring, cut, 'diff'));
    }
    rings = next;
  }
  out.outers = rings.filter(r => polyRingArea(r) > 0)
                    .sort((a, b) => Math.abs(polyRingArea(b)) - Math.abs(polyRingArea(a)));
  out.holes = holes.concat(rings.filter(r => polyRingArea(r) < 0));
  return out;
}

/* one shape can leave as SEVERAL: a cut straight across it yields two pieces, and the
   larger keeps the plain id so whatever was built from it stays that thing. */
function solidTakes(it) {
  const g = cutGeometryFor(it);
  if (!g.outlineCut) return [solidRecord(it, null, g.holes, 0)];
  if (!g.outers.length) return [];
  return g.outers.map((ring, i) => solidRecord(it, ring,
    g.outers.length === 1 ? g.holes : g.holes.filter(h => pointInPoly(h[0], ring)), i));
}
/* the single-record view, for the callers that only ever want the main piece */
function solidToTake(it) {

  return r.length ? r[0] : solidRecord(it, [], [], 0);
}

/* `ring` null means "no cut reached the outline" — report the FIT, arcs and all.
   A ring means the outline is a boolean result, so it is plain vertices with no
   bulges, and `handEdited` says so without pretending the radii are still there. */
function solidRecord(it, ring, holeRings, idx) {
  const s = pxPerMetre(), U = HOST.unitsPerMetre;
  const k = U / s;                                   // pixels → take units
  const front = (it.view || 'plan') === 'elevation';
  /* THE CAP, AND THE ONE THING THAT LIFTS IT.
     A plan-drawn stage is capped at 0.5 m because from directly above there is nothing
     to judge a height against, and an accidental 6 m deck is worse than a wrong-but-flat
     one. That is right for a height nobody has stated.

     It was also being applied HERE, on the way out, on every single post — so a height
     pulled in the 3D survived exactly until the next thing anybody did on the paper, and
     then silently became 0.5 m again. From the outside: "the deck keeps resetting".
     `hFree` is the shape saying somebody has stated its height deliberately, in the one
     view where a height can be judged, and a cap has no business overruling that. */
  const capped = it.role === 'stage' && !front && !it.hFree;
  const builtHeightM = capped ? Math.min(0.5, it.hM) : it.hM;
  const [ax, ay] = solidCentre(it);
  const ox = originOf()[0];
  /* A FRONT PAGE HAS NO DEPTH AXIS, so a front-drawn shape's depth is not in its
     outline and never can be. It used to leave as a flat 0, which meant a wall pushed
     upstage in the room was pulled back to the front of the stage by the pad's next
     post. It is carried on the item instead — stated only by the room, which is the
     one surface that can see it. */
  const at = front
    ? [ (ax - ox) * k, -(ay - baseY('elevation')) * k, (it.depthM || 0) * U ]
    : [ (ax - ox) * k, it.baseM * U, (ay - baseY('plan')) * k ];
  const cut = !!ring;
  /* `cutGeometryFor` now settles the boolean in this shape's OWN space, so the rings
     that arrive here are already item-space and there is nothing to convert. It used to
     hand back current-page points, which is why this reached for `pageToItemSpace`. */
  const local = (pts) => pts.map(q => [q[0], q[1]]);
  const pVerts  = cut ? local(ring) : it.fit.verts;
  const pBulges = cut ? pVerts.map(() => 0) : it.fit.bulges;
  const toTake = (p) => [ +((p[0] - ax) * k).toFixed(2),
                          +((front ? -(p[1] - ay) : (p[1] - ay)) * k).toFixed(2) ];
  const verts = pVerts.map(toTake);
  const bulges = pBulges.map(b => +((front ? -b : b) || 0).toFixed(4));
  const led = it.role === 'led' ? ledGrid(it) : null;
  const holes = (holeRings || []).map(h => local(h).map(toTake)).filter(x => x.length >= 3);
  const baseId = it.sid || (it.sid = 'sk' + (++solidSeq));
  return {
    id: idx ? baseId + '#' + (idx + 1) : baseId,
    srcId: it.oid || baseId,
    units: 'take', role: it.role, name: it.name || null,
    /* WHERE THE ROLE CAME FROM. A stamped shape is a DECLARATION and nothing downstream
       may second-guess it; a defaulted one is an open question, and that is the only
       place a model gets a vote. Without this the reader could not tell them apart and
       had to either doubt everything or doubt nothing. */
    roleFrom: it.roleFrom || 'default',
    plane: front ? 'front' : 'floor',
    /* v5.8 · and which way it lies, for an LED — see `SOLIDS.md § led`. Absent means
       upright, which is what every shape drawn before this existed still means. */
    lay: isFlatLed(it) ? 'flat' : undefined,
    view: it.view || 'plan',
    closed: !!it.fit.closed,
    at: at.map(v => +v.toFixed(2)),
    verts, bulges, holes,
    h: +(builtHeightM * U).toFixed(2),
    /* WHETHER THAT HEIGHT IS A STATEMENT OR A DEFAULT. A plan-drawn deck's 0.5 m is
       the pad admitting it cannot know; a height pulled in the room is somebody's
       answer. The far side has to be able to tell them apart, because it is holding
       the only copy of that answer whenever this pad was not open to hear it. */
    hFree: !!it.hFree,
    /* A FRONT SHAPE'S TURN IS A FIELD, NOT GEOMETRY — see `solidPlaced`. So it is stated
       here, and the take takes the pad's word for it rather than holding its own copy. A
       floor shape states nothing: its turn is in the vertices above. */
    rot: front ? +(it.yawDeg || 0).toFixed(2) : undefined,
    /* WHICH TURN IS ALREADY IN THESE VERTICES. The pad has no rotation field — its own
       rotate handle turns the geometry — so a turn made in the room is baked in here on
       arrival, and this says how much of the take's angle that was. The take zeroes its
       own copy when the numbers match, and keeps it when they do not, which is what
       happens when this pad was not open to hear about the turn. */
    rotTaken: +(it.rotBaked || 0).toFixed(2),
    /* and the same for a size tried in the room: these vertices already carry it */
    scaleTaken: (it.scaleBaked || [1, 1, 1]).map(v => +(+v).toFixed(4)),
    base: +(it.baseM * U).toFixed(2),
    thick: +(it.thickM * U).toFixed(2),
    tile: it.role === 'led' ? { w: +(it.tileM.w * U).toFixed(2), h: +(it.tileM.h * U).toFixed(2) } : null,
    /* the fit, reported. Every one of these is a correction somebody should be
       able to argue with, so none of them is hidden. */
    fit: {
      raw: it.fit.rawCount, verts: it.fit.verts.length, arcs: it.fit.arcs,
      rms: +(it.fit.rms / s).toFixed(3), tol: it.tolM,
      symmetric: !!it.fit.symmetric, snapped: !!it.snap, handEdited: !!it.edited || cut,
      radii: it.fit.bulges.map((b, i) => {
        if (!b) return null;
        const n = it.fit.verts.length;
        const info = arcInfo(it.fit.verts[i], it.fit.verts[(i + 1) % n], b);
        return +(info.r / s).toFixed(2);
      }).filter(r => r !== null),
    },
    metrics: it.role === 'led'
      ? { cols: led.cols, rows: led.rows, tiles: led.tiles, facets: led.facets.length,
          w: +led.w.toFixed(2), h: +led.h.toFixed(2) }
      : it.fit.closed
        ? { area: +solidArea(it).toFixed(2), perimeter: +solidLength(it).toFixed(2) }
        : { length: +solidLength(it).toFixed(2) },
  };
}
let solidSeq = 0;
const solidItems = () => S.items.filter(i => i.t === 'solid');
/* ALREADY A FACT, or not yet. `solidToTake` describes the geometry and nothing else,
   so it is also what `built` is keyed on; the flag is stamped on afterwards, here,
   because it is a statement about the SCENE rather than about the shape.

   Why it matters beyond tidiness: an interpreter that restages a shape already in the
   take produces a plan full of ops that change nothing — and a plan under review
   parks every derived figure in the workspace, because the tool measures into the plan
   instead of into the take while one is up. So the payload says which shapes are
   already true, and the reader narrates those rather than proposing them. */
function solidsOut() {
  /* flatMap, not map: a cut straight across a shape leaves two pieces and both are
     real geometry. Returning only the larger silently dropped half a deck. */
  return solidItems().flatMap((it) => solidTakes(it).map((x) => {
    x.built = built.get(x.id) === solidKey(x);
    return x;
  }));
}

/* ==========================================================================
   3 · RENDERING — one function draws the panel and the PNG.
   `clean` drops the chrome that is for the person and keeps what orients the
   model: the ink, the anchors, the labels, the scale bar, the ground line and a
   small upstage caption. There is no second renderer to drift.
   ========================================================================== */
function tok(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ---------- THE VISIBLE PAPER, IN THE DRAWING'S OWN COORDINATES ----------
   The chrome — grid, axes, ground line, the caption at the top — used to be drawn over
   [0,0 → canvas W,H], as if the canvas and the paper were the same rectangle. They are
   only the same rectangle at 1:1 and unpanned. Zoom out and the grid stopped a third of
   the way across the view with the drawing floating in an empty void; pan and it slid
   off the side. Everything that describes the paper now asks where the paper actually
   IS, and everything drawn at a fixed size divides by the zoom so a one-pixel line
   stays one pixel and a 9px label stays 9px. */
function viewRect(clean) {
  if (clean) return { x0: 0, y0: 0, x1: box.w, y1: box.h, z: 1 };
  const z = S.viewport.zoom || 1;
  return { x0: -S.viewport.x / z, y0: -S.viewport.y / z,
           x1: (box.w - S.viewport.x) / z, y1: (box.h - S.viewport.y) / z, z };
}

/* said once per shape, and loudly in the console: a shape that will not draw is a

const drawBroken = new Set();
function drawFailed(it, err) {
  const k = (it.oid || it.t) + ':' + (err && err.message);

     the saved state is orphaned on the context's stack and the closing `restore` here
     pops the wrong one — so a single bad shape does not just lose one frame, it tints
     or dims every frame after it. `reset` empties that stack; the base transform is
     put back because it belongs to the canvas, not to the frame. */
  if (c.reset && c.__base) { c.reset(); c.setTransform(...c.__base); }
  c.save();
  c.clearRect(0, 0, W, H);
  if (clean) { c.fillStyle = tok('--surface-canvas'); c.fillRect(0, 0, W, H); }
  /* Viewport zoom changes only how the working canvas is seen. The clean raster sent
     for interpretation remains in canonical canvas coordinates. */
  if (!clean) {
    c.translate(S.viewport.x, S.viewport.y);
    c.scale(S.viewport.zoom, S.viewport.zoom);
  }

  const inkCol = tok('--text-primary');
  const meta = tok('--text-meta');

  const V = viewRect(clean);
  if (!clean) drawGrid(c, V, tok('--border-subtle'));
  drawAxes(c, V, clean);
  drawGround(c, V, meta, clean);

  /* ink — anything from the other view first and dimmer, so a shadow can never be

  c.lineCap = 'round'; c.lineJoin = 'round';
  [true, false].forEach((shadowPass) => {
    S.items.forEach((it) => {
      if (it.t !== 'stroke' || isShadow(it) !== shadowPass) return;
      c.save();
      if (shadowPass) { c.globalAlpha = 0.4; c.setLineDash([4, 3]); }
      c.strokeStyle = inkCol;

  /* ONE SHAPE THAT CANNOT BE DRAWN IS ONE SHAPE. `draw` is called by every gesture —
     right-click calls it on the line before it opens the menu — so a throw in here
     does not lose a frame, it ABORTS THE GESTURE, and the pad goes quiet with no
     error anywhere the person can see. Losing a shape's decoration is a bug; losing
     the pad is the report we kept getting. */
  offPaper = null;
  S.items.forEach((it, i) => {
    if (it.t !== 'solid') return;
    /* every shape in the set reads as held. Only the ONE has handles — see `drawSolid` —
       because a set is named and sent somewhere, not reshaped vertex by vertex.
       While a band is being swept, what it has TAKEN SO FAR reads as held too: a crossing
       selection that only shows its result on release is a gesture done blind. */
    const sweeping = marquee && marqueeTakes(marqueeRect(), i);
    try { drawSolid(c, it, (isSelected(i) || sweeping) && !clean, clean, i !== S.sel); }
    catch (err) { drawFailed(it, err); }
  });
  S.items.forEach((it) => { if (it.t === 'cutout') drawCutout(c, it); });

  // labels and anchors on top of the ink
  S.items.forEach((it, i) => {
    const sh = isShadow(it);
    if (it.t === 'label') { c.save(); if (sh) c.globalAlpha = 0.4; drawLabel(c, { ...it, at: ptsHere(it)[0] }, inkCol); c.restore(); }
    if (it.t === 'stamp') { c.save(); if (sh) c.globalAlpha = 0.65; drawStamp(c, { ...it, at: ptsHere(it)[0] }, i === S.sel && !clean); c.restore(); }
  });

  drawSelectionBox(c);
  drawScaleBar(c, V, meta);
  drawOrigin(c, meta, clean, V.z);
  drawUpstage(c, V, meta, clean);
  if (live) drawGhost(c, inkCol);
  if (!clean) drawCarriedStamp(c);
  if (!clean) drawRoomObjects(c);
  if (!clean) drawRoomFaces(c);       // v5.8 · and which of their surfaces can be taken
  if (!clean) drawCanvasTies(c);
  if (!clean) drawGroupBox(c);
  if (marquee && !clean) drawMarquee(c);
  c.restore();
  /* ONCE PER CHANGE, after the frame. A tall deck in a short panel has to read as "too
     tall to show" rather than as "no height on record" — but re-saying it every frame
     would park the footer on this message and the coordinate readout would never get a
     word in, so it is keyed on the thing that changed. */
  if (offPaper && !clean) {
    const key = (offPaper.sid || '') + ':' + offPaper.hM + ':' + box.h
              + ':' + S.viewport.zoom.toFixed(3);
    if (key !== offPaperSaid) {
      offPaperSaid = key;
      flash((offPaper.name || SOLID_ROLES[offPaper.role].label) + ' stands '
            + offPaper.hM.toFixed(2) + ' m — taller than the paper · press F to fit');
    }
  } else if (!offPaper) offPaperSaid = null;
}

/* WHICH WALLS ARE ONE CANVAS, said on the paper. A canvas is a fact about the room that
   only the Scene Study can work out, so the pad is told it and draws it: a line joining the
   shapes that share one, with a tick into each. Drawn in the same accent the 3D uses for the
   tie, and only in the view the shapes were drawn in — a canvas of plan-drawn walls means
   nothing on an elevation page. */
/* WHAT IS STANDING IN THE ROOM, DRAWN AS ITS FOOTPRINT. A model imported into the Scene Study
   is not a take fact and has no outline here, so the page showed clear floor where a truss tower
   or a set piece actually stands — and a deck drawn through one looks fine on paper and is
   impossible in the room. Dashed, crossed, in meta ink and never in the accent: it is not yours
   to edit, it is a shadow of something that lives in the room.
   v5.8 · AND ITS SILHOUETTE IN ELEVATION. This was plan-only on the argument that a footprint
   is a fact about the floor — which is true of a footprint and not of the thing casting it. A
   set piece is four metres tall or it is forty centimetres tall, and on a front page that is
   the one thing about it that matters: it is the difference between a wall you can throw over
   and a wall you cannot. The plan showed a box you must not draw through and the elevation
   showed clear air at the same place.
   So each view draws the pair of dimensions it can actually see — across × depth on the plan,
   across × height on the front — from the same published box. Neither is a projection of the
   other; both are two of the three numbers. */
function drawRoomObjects(c) {
  if (!roomObjects.length) return;
  const U = HOST.unitsPerMetre || 10, s = pxPerMetre(), o0 = originOf(S.projection);
  const z = S.viewport.zoom || 1;
  const elev = S.projection === 'elevation';
  /* upstage first on the front page, and faded by depth — the same cue the faces get */
  const oDepth = (o) => (o.at && o.at[2]) || 0;
  const order = elev ? roomObjects.slice().sort((a, b) => oDepth(a) - oDepth(b)) : roomObjects;
  const fade = elev ? depthFade(order, oDepth) : () => 1;
  c.save();
  c.strokeStyle = tok('--text-meta'); c.fillStyle = tok('--text-meta');
  c.lineWidth = 1.2 / z; c.setLineDash([5 / z, 3 / z]);
  order.forEach((o) => {
    c.globalAlpha = 0.7 * fade(o);
    const w = (o.w || 0) * s / U;
    /* THE SECOND DIMENSION IS WHICHEVER ONE THIS PAGE CAN SEE. */
    const h = ((elev ? o.h : o.d) || 0) * s / U;
    if (!(w > 1) || !(h > 1)) return;
    const x = o0[0] + (o.at[0] || 0) * s / U;
    /* ON THE FRONT PAGE IT STANDS ON THE GROUND. `at[1]` is the bottom of the published box
       and page y runs UP from the ground line, so the box hangs from its base rather than
       being centred on it the way a footprint is centred on its position. */
    const y = elev ? (o0[1] - ((o.at[1] || 0) * s / U) - h / 2)
                   : (o0[1] + (o.at[2] || 0) * s / U);
    c.save();
    c.translate(x, y);
    /* ONLY THE PLAN TURNS. `w` and `h` are the sizes of an axis-aligned box in the room, so on
       a front page the silhouette is already square to the page — turning it there would draw
       a leaning box for something standing upright. */
    if (!elev) c.rotate(-(o.rot || 0));
    c.strokeRect(-w / 2, -h / 2, w, h);
    /* the diagonals, so a footprint reads as an object and not as a room somebody drew */
    c.beginPath();
    c.moveTo(-w / 2, -h / 2); c.lineTo(w / 2, h / 2);
    c.moveTo(w / 2, -h / 2); c.lineTo(-w / 2, h / 2);
    c.stroke();
    c.restore();
    c.setLineDash([]);
    c.font = '600 8px ' + tok('--font');
    c.textAlign = 'center'; c.textBaseline = 'bottom';
    c.fillText(shortModelName(o.name), x, y - h / 2 - 3 / z);
    c.setLineDash([5 / z, 3 / z]);
  });
  c.restore();
}

/* ==========================================================================
   THE FACES A MODEL OFFERS, ON THE PAPER.

   A footprint says "something is standing here". It does not say what the thing is MADE of,
   and for an imported set that is the only interesting question — the deck, the upstage wall
   and the two returns are all in that one `.glb`, all pickable in the Scene Study, and until
   now nameable nowhere on the plan. So the paper showed a dashed box with a cross through it
   and the honest reading was "do not draw here", when what somebody actually wanted was to
   draw WITH it: that wall is the LED wall, and it already exists.

   So the Scene Study publishes its segmentation of every import — see `objectFaces` — as the
   OUTLINE EACH FACE WOULD BECOME, already projected onto the plan. This draws that set and
   lets you take one: right-click a face and it becomes an LED wall, a wall or a deck, built
   by the room and arriving back here as a shape of yours.

   THEY ARE NOT YOURS UNTIL YOU TAKE ONE, and they are drawn saying so — hairline, in meta
   ink, never in the accent unless the pointer is on one. A candidate that has already been
   taken is not drawn at all: the solid it became is on the plan in its own right, and drawing
   both would be drawing one surface twice.

   PLAN ONLY, for the same reason a footprint is: these are facts about where surfaces stand
   in the room, and an elevation page has no place to put them.
   ========================================================================== */
const shortModelName = (v) => String(v || 'MODEL').replace(/\.(glb|gltf)$/i, '')
  .toUpperCase().slice(0, 18);
let roomFaces = [];
let faceHover = null;
/* v5.8 · THE BUILT SURFACE THE PAPER IS POINTING AT. Not the same idea as `faceHeld`: held
   means "about to be taken", and this means "already a shape in the take, and selected".
   Held only ever contains candidates; this only ever contains a face that has been taken.
   It carries the face's id, which IS the solid's `srcId` — see `faceSolidOp` in the room. */
let faceSel = null;
/* v5.8 · A SET, not one. A screen in a modelled set is normally three or five faces, and
   naming them one at a time is the same work five times over. Shift-click accumulates here
   exactly as it does for your own shapes. */
const faceHeld = new Set();
const faceMenu = document.createElement('div');
faceMenu.className = 'menu'; faceMenu.id = 'm-face';
document.body.appendChild(faceMenu);
const closeFaceMenu = () => faceMenu.classList.remove('open');
const faceById = (id) => roomFaces.find(f => f.id === id) || null;
const heldFaces = () => [...faceHeld].map(faceById).filter(Boolean);
/* the faces a gesture on `f` is about: the SET when `f` is in it, and `f` alone otherwise —
   the same rule the role menu already follows for a set of your own shapes */
function faceActOn(f) {
  if (f && faceHeld.has(f.id) && faceHeld.size > 1) return heldFaces();
  if (f) return [f];
  return heldFaces();
}
/* take units -> the page, on the PLAN */
function faceXY(o0, s, U, q) { return [o0[0] + (q[0] || 0) * s / U, o0[1] + (q[1] || 0) * s / U]; }
/* ---------- THE SAME FACE, ON WHICHEVER PAGE YOU ARE ON ----------
   v5.8 · Both views get a shape rather than one view getting nothing, and it is the SAME two
   shapes swapped over: what is a rectangle from above is a line from the front, and what is a
   line from above is a rectangle from the front.

     PLAN       standing → the line its footprint makes · lying flat → the outline it covers
     ELEVATION  standing → the rectangle it stands in   · lying flat → the line at its height

   A face square to the front page collapses to a line there, and that is the honest answer for
   the same reason the pad already gives it for a shape drawn in the other view: the page has
   nothing true to say about the dimension it cannot see. */
function facePathsFor(f) {
  const U = HOST.unitsPerMetre || 10, s = pxPerMetre();
  const o0 = originOf(S.projection);
  const px = (v) => o0[0] + (v || 0) * s / U;                    // across, shared by both views
  if (S.projection !== 'elevation') {
    if (f.flat && Array.isArray(f.poly)) return { poly: f.poly.map(q => faceXY(o0, s, U, q)) };
    if (Array.isArray(f.line)) return { line: f.line.map(q => faceXY(o0, s, U, q)) };
    return null;
  }
  /* FRONT PAGE. Height runs UP from the ground line, which is what `o0[1]` is in this view. */
  const py = (v) => o0[1] - (v || 0) * s / U;
  const xsOf = (pts) => pts.map(q => q[0]);
  if (f.flat && Array.isArray(f.poly)) {
    const xs = xsOf(f.poly);
    return { line: [[px(Math.min(...xs)), py(f.h)], [px(Math.max(...xs)), py(f.h)]] };
  }
  if (Array.isArray(f.line)) {
    const xs = xsOf(f.line);
    const x0 = px(Math.min(...xs)), x1 = px(Math.max(...xs));
    const b = py(f.base || 0), t = py((f.base || 0) + (f.h || 0));
    /* a face seen edge-on has no width here — drawn as the line it honestly is */
    if (Math.abs(x1 - x0) < 0.6) return { line: [[x0, b], [x0, t]] };
    return { poly: [[x0, b], [x1, b], [x1, t], [x0, t]] };
