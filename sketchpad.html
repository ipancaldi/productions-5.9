}
function drawRoomFaces(c) {
  if (!roomFaces.length) return;
  const z = S.viewport.zoom || 1;
  const elev = S.projection === 'elevation';
  /* upstage first, so the near surfaces are drawn over them — see `faceDepth` */
  const order = elev ? roomFaces.slice().sort((a, b) => faceDepth(a) - faceDepth(b)) : roomFaces;
  const fade = elev ? depthFade(order, faceDepth) : () => 1;
  c.save();
  order.forEach((f) => {
    const g = facePathsFor(f); if (!g) return;
    /* v5.8 · A TAKEN FACE IS STILL DRAWN. It used to return here, on the argument that "the
       solid it became is on the plan in its own right" — which is true of a shape the PAD
       drew and false of one the room built from a model face: the pad holds no item for that,
       so taking a face made it vanish off the paper entirely and selecting it lit nothing.
       It is drawn as BUILT instead — solid line, the built ink, no dashes — because that is
       what it now is, and it stays selectable so the two surfaces can point at it together. */
    const on = (faceHover === f.id || faceHeld.has(f.id) || faceSel === f.id);
    c.strokeStyle = on ? tok('--status-active')
                  : f.taken ? tok('--status-complete') : tok('--text-meta');
    c.globalAlpha = (on ? 0.95 : f.taken ? 0.8 : 0.5) * (on ? 1 : fade(f));
    c.lineWidth = (on ? 2.2 : f.taken ? 1.8 : 1.1) / z;
    if (g.poly) {
      /* AN AREA ON THIS PAGE — a deck seen from above, or a standing face seen from the front.
         Dotted, because a surface you have not taken is a proposal and a solid line would read
         as an outline somebody drew. */
      c.setLineDash((on || f.taken) ? [] : [3 / z, 3 / z]);
      c.beginPath();
      g.poly.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]));
      c.closePath(); c.stroke();
      c.setLineDash([]);
    } else {
      /* A LINE ON THIS PAGE — a standing face's footprint from above, or a deck's height from
         the front. On the plan it carries a tick on the side it FACES, which is the difference
         between a screen the audience sees and one it does not; on the front page that normal
         points into or out of the paper, so there is nothing honest to draw for it. */
      const [a, b] = g.line;
      c.setLineDash([]);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
      const n = (S.projection !== 'elevation' && !f.flat && Array.isArray(f.nrm)) ? f.nrm : null;
      if (n) {
        const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        const L = (on ? 11 : 7) / z;
        c.beginPath(); c.moveTo(mx, my);
        c.lineTo(mx + (n[0] || 0) * L, my + (n[1] || 0) * L);
        c.stroke();
      }
    }
    /* THE SIZE, ONLY ON THE ONE UNDER THE POINTER. A plan of a set can offer twenty faces and
       twenty labels is a wall of text over the drawing. And only ONE of them: with the label
       on both the hovered face and the held one, pointing at a second face printed two
       readouts and neither said which was which. The pointer wins, because it is the more
       recent thing somebody did. */
    if (on && f.id === (faceHover || [...faceHeld][0] || faceSel)) {
      const mid = g.poly
        ? g.poly.reduce((acc, q) => [acc[0] + q[0] / 4, acc[1] + q[1] / 4], [0, 0])
        : [(g.line[0][0] + g.line[1][0]) / 2, (g.line[0][1] + g.line[1][1]) / 2];
      const U = HOST.unitsPerMetre || 10;
      c.globalAlpha = 1;
      c.fillStyle = tok('--status-active');
      c.font = '600 9px ' + tok('--font');
      c.textAlign = 'center'; c.textBaseline = 'bottom';
      c.fillText(((f.w || 0) / U).toFixed(1) + ' × ' + ((f.hM || 0) / U).toFixed(1) + ' m · '
        + (f.flat ? 'FLAT' : 'STANDING')
        + (faceHeld.size > 1 ? ' · ' + faceHeld.size + ' HELD' : '')
        + (f.taken ? ' — BUILT · right-click to change what it is'
                   : ' — right-click to take it'),
        mid[0], mid[1] - 6 / z);
    }
  });
  c.restore();
}
/* v5.8 · HOW FAR DOWNSTAGE A FACE IS, which the front page cannot show as a position and can
   show as ORDER. `+depth` is downstage — towards the audience — so sorting ascending draws the
   upstage surfaces first and the near ones over them, and fading by the same rank gives the one
   cue an elevation needs to read as a view FROM somewhere rather than a flat overlay of
   everything at once. Meaningless on the plan, where depth is a position and already drawn. */
const faceDepth = (f) => f.flat && Array.isArray(f.poly)
  ? f.poly.reduce((a, q) => a + (q[1] || 0), 0) / f.poly.length
  : Array.isArray(f.line) ? ((f.line[0][1] || 0) + (f.line[1][1] || 0)) / 2 : 0;
/* nearest = 1, furthest = 0.45 — enough to read as depth, not enough to hide anything */
function depthFade(list, depthOf) {
  const ds = list.map(depthOf);
  const lo = Math.min(...ds), hi = Math.max(...ds);
  return (v) => (hi - lo < 1 ? 1 : 0.45 + 0.55 * ((depthOf(v) - lo) / (hi - lo)));
}
/* WHICH CANDIDATE IS UNDER THE POINTER. Smallest first, so a face sitting inside a bigger one
   — a screen on a wall, which is the whole point of this — is the one you get. */
function hitRoomFace(p) {
  if (!roomFaces.length) return null;
  const tol = 6 / (S.viewport.zoom || 1);
  const near = [];
  roomFaces.forEach((f) => {
    const g = facePathsFor(f); if (!g) return;
    if (g.poly) {
      if (pointInPoly(p, g.poly) || onPolyEdge(p, g.poly, tol)) near.push([f, f.area || 0]);
    } else if (segDist(p, g.line[0], g.line[1]) <= tol) near.push([f, f.area || 0]);
  });
  if (!near.length) return null;
  near.sort((a, b) => a[1] - b[1]);
  return near[0][0];
}
/* HOVERING ONE LIGHTS IT IN THE ROOM TOO. That is the whole reason the set is published
   rather than a count: the paper and the room are looking at one model, and they should
   agree about which part of it is being pointed at. */
function hoverRoomFace(p) {
  /* NOT WHILE ANYTHING IS BEING DRAGGED. `hover` runs on every pointermove, including the
     ones that are moving a shape — and re-lighting a model's face in the room halfway
     through dragging your own wall across it is the tool answering a question nobody asked.
     SELECT only, for the same reason the click is: under a drawing tool the pointer is
     putting ink down, not pointing at things. */
  const idle = !(solidDrag || dragging || marquee || cornerDrag || rotateDrag || handleDrag
                 || heightDrag || groupDrag || aiming || live);
  const f = (S.tool === 'select' && !S.busy && idle) ? hitRoomFace(p) : null;
  const id = f ? f.id : null;
  if (id === faceHover) return;
  faceHover = id;
  post('hoverFace', { faceId: id });
  draw();
}
/* AND TAKING ONE IS THE ROOM'S JOB. The pad knows the outline because it was told it; it does
   not hold the geometry the fit came from, so it names the face and the Scene Study builds it
   — through the same `addSolid` a click in the viewport uses. */
function openFaceMenu(e, f) {
  closeRoleMenu();
  const act = faceActOn(f);
  if (!act.length) return;
  const many = act.length > 1;
  const allFlat = act.every(x => x.flat);
  const U = HOST.unitsPerMetre || 10;
  const area = act.reduce((a, x) => a + ((x.w || 0) / U) * ((x.hM || 0) / U), 0);
  faceMenu.innerHTML = '<div class="k">'
    + (many ? act.length + ' faces · ' + area.toFixed(1) + ' m² become'
            : shortModelName(f.name) + ' · ' + ((f.w || 0) / U).toFixed(1) + ' × '
              + ((f.hM || 0) / U).toFixed(1) + ' m '
              + (f.taken ? 'is BUILT · make it a…' : 'face becomes a…'))
    + '</div>'
    /* v5.8 · A HORIZONTAL FACE HAS TWO LED ANSWERS, the same two the Scene Study offers —
       a screen LYING in the surface, or cabinets standing up round its edge. The pad keeps
       its own STAGE / WALL / LED order; only LED splits, and only when every held face is
       flat, because laying a standing face's footprint flat is a screen with no width. */
    + ROLE_STAMPS.filter(r => !r.lay).flatMap(r => (r.role === 'led' && allFlat)
        ? [['led', 'flat', 'LED FLOOR', 'a screen lying in this surface — pitch, cabinets, a clip routed onto it'],
           ['led', '', 'LED WALL', 'cabinets standing up out of this outline — a fascia round its edge']]
        : [[r.role, '', r.label, (SOLID_ROLES[r.role] || {}).hint]])
      .map(([role, ly, label, hint]) => '<button data-role="' + role + '" data-lay="' + ly + '">'
        + label + (many ? 'S' : '') + '<i>' + hint + '</i></button>').join('')
    /* ONE CANVAS, ASKED FOR WHERE THE FACES ARE. A screen modelled as five flats is five walls
       each showing its own copy of the clip until somebody says otherwise, and this is where
       that gets noticed. Only for a SET: it is meaningless for one. */
    + (many && !allFlat
        ? '<button data-role="led" data-lay="" data-link="1"><b>LED WALLS · ONE CANVAS</b><i>'
          + act.length + ' screens as one surface, so a clip spans them</i></button>' : '')
    /* AND OFF THE MODEL ALTOGETHER. The mesh only exists in the Scene Study, so this is a
       request like every other one here — see `deleteFace`. */
    + '<button data-act="delete"><b>DELETE FROM THE MODEL</b><i>'
      + (many ? 'drop those ' + act.length + ' faces' : 'drop this face')
      + ' from the mesh · anything already taken stays</i></button>';
  faceMenu.style.left = Math.min(e.clientX, innerWidth - 232) + 'px';
  faceMenu.style.top = Math.min(e.clientY, innerHeight - 236) + 'px';
  faceMenu.classList.add('open');
  faceMenu.dataset.face = f.id;
}
faceMenu.addEventListener('click', (e) => {
  const b = e.target.closest('[data-role],[data-act]'); if (!b) return;
  const act = faceActOn(faceById(faceMenu.dataset.face));
  closeFaceMenu();
  if (!act.length) return flash('those faces are not in the scene any more');
  const ids = act.map(x => x.id);
  /* LETTING GO EITHER WAY. Whatever happens next, the set has been spent: the faces are
     about to come back as shapes of yours, or to stop existing. A candidate outline still
     lit under either outcome is the paper showing one surface twice. */
  const letGo = () => { faceHeld.clear(); faceHover = null;
                        post('hoverFace', { faceId: null }); draw(); status(); };
  if (b.dataset.act === 'delete') {
    post('deleteFace', { faceIds: ids });
    letGo();
    return flash(ids.length + (ids.length === 1 ? ' face' : ' faces')
      + ' — the Scene Study is taking ' + (ids.length === 1 ? 'it' : 'them') + ' off the model');
  }
  post('promoteFace', { faceIds: ids, role: b.dataset.role, link: b.dataset.link === '1',
                        lay: b.dataset.lay || undefined });
  letGo();
  /* SAID, BECAUSE THE ANSWER COMES BACK BY ANOTHER DOOR. The solids are built by the room and
     arrive in the next push, so between the click and the shapes appearing there is a beat
     with nothing in it — which reads as the menu having done nothing. */
  flash(ids.length + ' × '
    + (b.dataset.role === 'led' && b.dataset.lay === 'flat' ? 'LED FLOOR'
       : String(b.dataset.role).toUpperCase()) + ' from the model'
    + (b.dataset.link === '1' ? ' · as one canvas' : '')
    + ' — the Scene Study is building ' + (ids.length === 1 ? 'it' : 'them'));
});
document.addEventListener('pointerdown', (e) => {
  if (!faceMenu.contains(e.target)) closeFaceMenu();
});

function drawCanvasTies(c) {
  if (!ledCanvases.length) return;
  const z = S.viewport.zoom || 1;
  c.save();
  c.strokeStyle = tok('--status-active'); c.globalAlpha = 0.55;
  c.lineWidth = 1.4 / z; c.setLineDash([6 / z, 4 / z]);
  ledCanvases.forEach((g) => {
    const pts = [];
    g.sids.forEach((sid) => {
      const i = S.items.findIndex(x => x.t === 'solid' && x.sid === sid);
      if (i < 0 || isUntouchableHere(S.items[i])) return;
      const b = solidPtsHere(S.items[i], 1.5);
      const xs = b.map(q => q[0]), ys = b.map(q => q[1]);
      pts.push([(Math.min(...xs) + Math.max(...xs)) / 2, Math.max(...ys)]);
    });
    if (pts.length < 2) return;
    pts.sort((a, b2) => a[0] - b2[0]);
    /* the bar sits below the shapes, the way it sits below the screens in the room */
    const y = Math.max(...pts.map(q => q[1])) + 12 / z;
    c.beginPath();
    c.moveTo(pts[0][0], y); c.lineTo(pts[pts.length - 1][0], y);
    pts.forEach(q => { c.moveTo(q[0], y); c.lineTo(q[0], q[1] + 2 / z); });
    c.stroke();
    c.setLineDash([]);
    c.font = '600 8px ' + tok('--font');
    c.fillStyle = tok('--status-active'); c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText('ONE CANVAS · ' + pts.length + ' SCREENS',
               (pts[0][0] + pts[pts.length - 1][0]) / 2, y + 3 / z);
    c.setLineDash([6 / z, 4 / z]);
  });
  c.restore();
}

/* THE BAND, WHILE IT IS BEING SWEPT. Dashed, in the active ink, with a faint fill — the
   fill matters more than it looks: a crossing selection takes what it TOUCHES, so the
   band has to read as a region passing over things rather than a box being drawn around
   them. The shapes it has taken so far light up underneath it as it goes, which is the
   other half of saying that. */
function drawMarquee(c) {
  const r = marqueeRect(); if (!r) return;
  const z = S.viewport.zoom || 1;
  c.save();
  c.fillStyle = tok('--tint-emphasis');
  c.globalAlpha = 0.35;
  c.fillRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
  c.globalAlpha = 1;
  c.strokeStyle = tok('--status-active');
  c.lineWidth = 1.2 / z;
  c.setLineDash([5 / z, 4 / z]);
  c.strokeRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
  c.restore();
}

/* drawn FROM THE ORIGIN outward, not from the top-left: the squares have to line up
   with 0,0 or a metre on the canvas is not a metre from anywhere. */
function drawGrid(c, V, col) {
  const ox = originOf()[0], oy = baseY();
  /* the first gridline at or before the left/top edge of what is actually on screen */
  const first = (o, step, from) => o + Math.floor((from - o) / step) * step;
  /* a whole grid at 0.35× is thousands of lines and none of them legible, so the fine
     grid stops being drawn once its squares are smaller than the eye can use */
  const fine = GRID_PX * V.z >= 5;
  c.save(); c.strokeStyle = col; c.lineWidth = 1 / V.z;
  const run = (step, alpha) => {
    c.globalAlpha = alpha;
    for (let x = first(ox, step, V.x0); x <= V.x1; x += step) { c.beginPath(); c.moveTo(x, V.y0); c.lineTo(x, V.y1); c.stroke(); }
    for (let y = first(oy, step, V.y0); y <= V.y1; y += step) { c.beginPath(); c.moveTo(V.x0, y); c.lineTo(V.x1, y); c.stroke(); }
  };
  if (fine) run(GRID_PX, 0.45);
  run(GRID_PX * 10, 0.9);                 // every tenth, like the tool's 10 m major
  c.restore();
}

/* ---------- THE AXES ----------
   The same three colours the Scene Study paints on its floor and the gizmo paints on
   a device: X red, Y green, Z blue. In PLAN the two on the page are X across and Z
   into the room; in FRONT they are X across and Y up. Drawing them here is what makes
   the two panels one space rather than two pictures. */
function drawAxes(c, V, clean) {
  const ox = originOf()[0], oy = baseY();
  const plan = S.projection === 'plan';
  const z = V.z;
  c.save();
  c.globalAlpha = clean ? 0.85 : 0.7;
  c.lineWidth = 1.5 / z;
  c.strokeStyle = tok('--axis-x');
  c.beginPath(); c.moveTo(V.x0, oy); c.lineTo(V.x1, oy); c.stroke();
  /* down the page is INTO THE ROOM in a top view (Y, blue) and UP in a front view
     (Z, green) — the same two letters the Scene Study paints on its floor */
  c.strokeStyle = tok(plan ? '--axis-y' : '--axis-z');
  c.beginPath(); c.moveTo(ox, V.y0); c.lineTo(ox, V.y1); c.stroke();
  c.font = '600 ' + (9 / z) + 'px ' + tok('--font');
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.fillStyle = tok('--axis-x'); c.fillText('X', V.x1 - 12 / z, oy - 5 / z);
  c.fillStyle = tok(plan ? '--axis-y' : '--axis-z');
  c.fillText(plan ? 'Y' : 'Z', ox + 5 / z, plan ? V.y1 - 5 / z : V.y0 + 11 / z);
  c.restore();
}

function strokePath(c, it) {
  const p = it.pts;
  if (!p.length) return;
  c.lineWidth = it.w || 2;
  c.beginPath();
  if (it.kind === 'rect') {
    c.rect(p[0][0], p[0][1], p[1][0] - p[0][0], p[1][1] - p[0][1]);
  } else if (it.kind === 'ellipse') {
    const cx = (p[0][0] + p[1][0]) / 2, cy = (p[0][1] + p[1][1]) / 2;
    c.ellipse(cx, cy, Math.abs(p[1][0] - p[0][0]) / 2, Math.abs(p[1][1] - p[0][1]) / 2, 0, 0, Math.PI * 2);
  } else {
    c.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length; i++) c.lineTo(p[i][0], p[i][1]);
  }
  c.stroke();
  if (it.kind === 'arrow' && p.length > 1) arrowHead(c, p[0], p[1]);
}

function arrowHead(c, a, b) {
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), L = 9;
  c.beginPath();
  c.moveTo(b[0], b[1]);
  c.lineTo(b[0] - L * Math.cos(ang - 0.42), b[1] - L * Math.sin(ang - 0.42));
  c.moveTo(b[0], b[1]);
  c.lineTo(b[0] - L * Math.cos(ang + 0.42), b[1] - L * Math.sin(ang + 0.42));
  c.stroke();
}

function drawLabel(c, it, col) {
  c.save();
  c.font = '500 11px ' + tok('--font').replace(/^"/, '"');
  c.fillStyle = col; c.textBaseline = 'middle';
  c.fillText(it.text, it.at[0], it.at[1]);
  c.restore();
}

const STAMP_R = 13;
function drawStamp(c, it, selected) {
  const [x, y] = it.at;
  c.save();
  c.lineWidth = 1.5;
  c.strokeStyle = tok('--status-complete');
  c.fillStyle = tok('--surface-canvas');
  c.beginPath(); c.arc(x, y, STAMP_R, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = tok('--status-complete');
  c.font = '600 8.5px ' + tok('--font');
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(it.label.slice(0, 5), x, y);
  if (it.note) {
    c.textAlign = 'left'; c.fillStyle = tok('--text-meta'); c.font = '400 9px ' + tok('--font');
    c.fillText(it.note.slice(0, 28), x + STAMP_R + 4, y);
  }
  if (selected) {
    c.strokeStyle = tok('--ring-emphasis'); c.lineWidth = 1;
    c.beginPath(); c.arc(x, y, STAMP_R + 4, 0, Math.PI * 2); c.stroke();
  }
  c.restore();
  if (it.aim !== undefined && it.aim !== null) drawAim(c, it);
}

/* ==========================================================================
   THE CARRIED STAMP.

   A stamp used to be invisible between arming it and dropping it: the toolbar knew
   which one was armed and the paper did not, so the gesture was "click somewhere and
   find out". That is the discoverability hole underneath all three stamp complaints —
   you could not see what you were holding, and you could not see what it was about to
   land on.

   So the pad draws it: the puck, under the cursor, and the SHAPE IT WOULD NAME lit up
   underneath with a one-line statement of what the drop will actually do. Nothing here
   changes any state; it is drawn last and only on the live canvas, never in `clean`,
   because the rasterised PNG is evidence and a cursor is not evidence.
   ========================================================================== */
function carriedStampLabel() {
  if (paletteDrag) return paletteDrag.label;
  if (dragging && S.items[dragging.i] && S.items[dragging.i].t === 'stamp') return S.items[dragging.i].label;
  if (S.tool === 'stamp') return S.armed || 'PROJ';
  return null;
}
function drawCarriedStamp(c) {
  const label = carriedStampLabel();
  if (!label || !lastHoverPoint) return;
  const L = String(label).toUpperCase();
  const role = STAMP_ROLE[L];
  const p = lastHoverPoint;
  /* what a drop HERE would do — the same question dropStamp asks, asked out loud */
  const target = role ? hitShapeForStamp(p) : -1;
  const onShape = target >= 0 && S.items[target] &&
                  (S.items[target].t === 'solid' || S.items[target].t === 'stroke');
  const lockedTarget = onShape && isLocked(S.items[target]);
  const say = !role ? 'drops a ' + L + ' anchor here'
    : lockedTarget ? 'that shape is built — UNLOCK it first'
    : onShape ? 'names this shape ' + ((SOLID_ROLES[role] || {}).label || L)
    : L === 'LED' ? 'builds a 4 m ' + (S.projection === 'elevation' ? 'receiving face' : 'cabinet run') + ' here'
    : 'leaves a ' + L + ' pin here';

  const accent = tok(lockedTarget ? '--status-failed' : '--status-complete');

  /* the target, lit. Naming a shape is a change to THAT shape, so that shape is what
     has to acknowledge the gesture — not the cursor. */
  if (onShape && !lockedTarget) {
    const t = S.items[target];
    const pts = t.t === 'solid' ? solidPtsHere(t, 0.5) : ptsHere(t);
    if (pts && pts.length > 1) {
      c.save();
      c.strokeStyle = accent; c.lineWidth = 2.6; c.globalAlpha = 0.9;
      c.setLineDash([6, 4]); c.lineJoin = 'round';
      c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
      if (t.t === 'solid' ? t.fit.closed : t.kind === 'rect' || t.kind === 'ellipse') c.closePath();
      c.stroke(); c.restore();
    }
  }

  c.save();
  /* carried, not placed: it sits a little up and left of the point it would land on,
     the way a thing being held sits above the thing it is being held over, and the
     landing point keeps its own small crosshair so the aim is never in doubt */
  const x = p[0] + STAMP_R + 6, y = p[1] - STAMP_R - 6;
  c.strokeStyle = accent; c.lineWidth = 1; c.globalAlpha = 0.8;
  c.beginPath(); c.moveTo(p[0] - 6, p[1]); c.lineTo(p[0] + 6, p[1]);
  c.moveTo(p[0], p[1] - 6); c.lineTo(p[0], p[1] + 6); c.stroke();
  c.globalAlpha = 0.45; c.setLineDash([2, 2]);
  c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(x, y); c.stroke();
  c.setLineDash([]); c.globalAlpha = 1;

  c.fillStyle = tok('--surface-canvas'); c.strokeStyle = accent; c.lineWidth = 1.5;
  c.beginPath(); c.arc(x, y, STAMP_R, 0, Math.PI * 2); c.fill(); c.stroke();
  drawRoleGlyph(c, x, y, role, accent);
  c.fillStyle = accent;
  c.font = '600 8.5px ' + tok('--font');
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(L.slice(0, 5), x, y + (role ? 5 : 0));

  /* the caption. Left of the puck when the puck is near the right edge, so it never
     runs off the paper somebody is drawing on. */
  c.font = '400 10px ' + tok('--font');
  const w = c.measureText(say).width + 10;
  const right = x + STAMP_R + 6 + w < box.w;
  c.textAlign = right ? 'left' : 'right';
  const tx = right ? x + STAMP_R + 6 : x - STAMP_R - 6;
  c.fillStyle = tok('--surface-canvas'); c.globalAlpha = 0.86;
  c.fillRect(right ? tx - 4 : tx - w + 4, y - 8, w, 16);
  c.globalAlpha = 1;
  c.fillStyle = lockedTarget ? tok('--status-failed') : tok('--text-meta');
  c.fillText(say, tx, y);
  c.restore();
}
/* THE ROLES ARE NOT COLOURS — and they are not letters either. Each role stamp carries
   the same mark the shape itself will be drawn with once it lands: a deck is filled, a
   wall shows the face ticks, an LED wall is cabinets. Recognising the glyph is the same
   act as recognising the shape, which is the point of using one drawing language. */
function drawRoleGlyph(c, x, y, role, accent) {
  if (!role) return;
  c.save();
  c.strokeStyle = accent; c.fillStyle = accent; c.lineWidth = 1;
  const t = y - 4;
  if (role === 'stage') { c.globalAlpha = 0.85; c.fillRect(x - 6, t - 3, 12, 6); }
  else if (role === 'wall') {
    c.beginPath(); c.moveTo(x - 6, t + 2); c.lineTo(x + 6, t + 2); c.stroke();
    c.globalAlpha = 0.8;
    for (let i = -6; i <= 4; i += 3) {
      c.beginPath(); c.moveTo(i + x, t + 2); c.lineTo(i + x + 2, t - 2); c.stroke();
    }
  } else {                                   // led — the cabinets it is made of
    c.globalAlpha = 0.85;
    for (let i = 0; i < 4; i++) c.strokeRect(x - 6 + i * 3, t - 2, 3, 4);
  }
  c.restore();
}

/* the direction, drawn the colour of a beam — because on a projector that is exactly
   what it is, and on a camera it is the same idea pointed the other way. A cone, not a
   ray: a lens has a field, and an arrow alone reads as "this line and nothing either
   side of it". */
function drawAim(c, it) {
  const [x, y] = it.at;
  const a = (it.aim * Math.PI) / 180;
  const len = Math.max(26, Math.min(it.aimLen || 34, 240));
  const x1 = x + Math.cos(a) * (STAMP_R + 2), y1 = y + Math.sin(a) * (STAMP_R + 2);
  const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
  c.save();
  c.strokeStyle = tok('--scene-beam'); c.fillStyle = tok('--scene-beam');
  c.lineWidth = 1.5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  arrowHead(c, [x1, y1], [x2, y2]);
  c.globalAlpha = 0.13;
  c.beginPath(); c.moveTo(x1, y1); c.arc(x, y, len, a - 0.30, a + 0.30); c.closePath(); c.fill();
  c.restore();
}

function drawScaleBar(c, V, col) {
  if (!S.scale) return;
  const z = (V && V.z) || 1;
  const [a, b] = [S.scale.from, S.scale.to];
  c.save();
  c.strokeStyle = tok('--status-info'); c.fillStyle = tok('--status-info');
  c.lineWidth = 1.5 / z; c.setLineDash([5 / z, 4 / z]);
  c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
  c.setLineDash([]);
  [a, b].forEach(p => { c.beginPath(); c.arc(p[0], p[1], 2.5 / z, 0, Math.PI * 2); c.fill(); });
  c.font = '600 ' + (9.5 / z) + 'px ' + tok('--font'); c.textBaseline = 'bottom';
  c.fillText(S.scale.metres + ' M', (a[0] + b[0]) / 2 - 8 / z, (a[1] + b[1]) / 2 - 5 / z);
  c.restore();
}

function drawOrigin(c, col, clean, z) {
  const k = z || 1;
  const [x, y] = originOf();
  c.save();
  c.strokeStyle = clean ? col : tok('--status-active');
  c.globalAlpha = clean ? 0.7 : 1; c.lineWidth = 1 / k;
  const r = 8 / k;
  c.beginPath(); c.moveTo(x - r, y); c.lineTo(x + r, y); c.moveTo(x, y - r); c.lineTo(x, y + r); c.stroke();
  c.font = '600 ' + (8 / k) + 'px ' + tok('--font'); c.fillStyle = clean ? col : tok('--status-active');
  c.textAlign = 'left';
  c.fillText('0,0', x + 5 / k, y - 4 / k);
  c.restore();
}

/* the red X axis IS the ground in a front view, so this only labels it — a second
   dashed line on top of the axis was saying the same thing twice and disagreeing
   with it whenever the origin moved */
function drawGround(c, V, col, clean) {
  if (S.projection !== 'elevation') return;
  const y = baseY(), z = V.z;
  c.save();
  c.fillStyle = col; c.font = '600 ' + (8.5 / z) + 'px ' + tok('--font');
  c.textAlign = 'left';
  c.fillText('GROUND · Z 0', V.x0 + 6 / z, y - 5 / z);
  c.restore();
}

function drawUpstage(c, V, col, clean) {
  const z = V.z;
  c.save();
  c.fillStyle = col; c.globalAlpha = clean ? 0.9 : 0.65;
  c.font = '600 ' + (9 / z) + 'px ' + tok('--font'); c.textAlign = 'center';
  /* v5.8 · AND WHICH WAY YOU ARE LOOKING. The elevation has always been the FRONT view —
     the camera the Scene Study calls `front` sits at +depth, the audience side, and +across
     projects to the right of it exactly as it does on this page — but nothing here said so,
     and a view that does not name its direction is a view you have to take on trust. */
  c.fillText(S.projection === 'plan' ? '↑ UPSTAGE · PLAN'
                                     : 'ELEVATION · FROM THE AUDIENCE — X ACROSS, Z UP',
             (V.x0 + V.x1) / 2, V.y0 + 14 / z);
  c.restore();
}

/* WHAT SELECTED LOOKS LIKE on the things that have no handles of their own. A shape
   shows its vertices and an anchor shows its ring; a stroke and a label showed nothing
   at all, so SELECT appeared to do nothing on two of the four kinds of thing you can
   draw. A dashed box is the least it can be. */
function drawSelectionBox(c) {
  const it = S.sel >= 0 ? S.items[S.sel] : null;
  if (!it || isShadow(it)) return;
  if (it.t === 'solid' || it.t === 'stamp') return;        // those show their own
  const pts = it.t === 'stroke' ? ptsHere(it) : [ptsHere(it)[0]];
  if (!pts.length) return;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const pad = it.t === 'label' ? 10 : 5;
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + (it.t === 'label' ? 84 : pad);
  const y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  c.save();
  c.strokeStyle = tok('--ring-emphasis');
  c.lineWidth = 1; c.setLineDash([4, 3]);
  if (it.transformCorners && it.transformCorners.length === 4) {
    c.beginPath(); c.moveTo(it.transformCorners[0][0], it.transformCorners[0][1]);
    for (let k = 1; k < 4; k++) c.lineTo(it.transformCorners[k][0], it.transformCorners[k][1]);
    c.closePath(); c.stroke();
  } else c.strokeRect(x0 + 0.5, y0 + 0.5, x1 - x0, y1 - y0);
  c.restore();
  if (it.t === 'stroke') drawCorners(c, it);
}

/* the in-progress shape, drawn from `live` rather than committed to items —
   a preview that got into the record would be undone twice */
let live = null;
let handleDrag = null;     // a solid's vertex or arc apex, being dragged
let solidDrag = null;      // a whole solid, being moved
let cornerDrag = null;     // a transform corner, being dragged
let rotateDrag = null;     // the outer zone of a transform corner, rotating about centre
let heightDrag = null;     // the top edge of a plan solid's profile, in ELEVATION
/* the rubber band, while it is being dragged: {from, to, add} in page coordinates */
let marquee = null;
/* the set being scaled, turned or moved as one */
let groupDrag = null;
let draftSolid = null;     // the trace IN PROGRESS, fitted, for the live preview
let draftCut = null;       // an Option-drag IN PROGRESS: { solid } — a CUTTER, resolved per solid
let draftAt = 0;
let itemSeq = 0;
const nextItemId = (kind) => (kind || 'item') + '-' + Date.now().toString(36) + '-' + (++itemSeq);
function drawGhost(c, col) {
  c.save(); c.globalAlpha = 0.85; c.strokeStyle = live && live.negative ? '#D92D20' : col;
  if (live.t === 'stroke') strokePath(c, live);
  /* the trace in progress, dashed — it is not a shape yet, and drawing it as one
     would claim a fit that has not happened */
  if (live.t === 'trace' && live.pts.length > 1) {
    c.setLineDash([5, 3]); c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(live.pts[0][0], live.pts[0][1]);
    live.pts.forEach(q => c.lineTo(q[0], q[1]));
    c.stroke(); c.setLineDash([]);
  }
  if (live.t === 'scale') {
    c.strokeStyle = tok('--status-info'); c.setLineDash([5, 4]); c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(live.from[0], live.from[1]); c.lineTo(live.to[0], live.to[1]); c.stroke();
  }
  c.restore();
}

function drawCutout(c, it) {
  const pts = solidPtsHere(it, 0.5);
  if (pts.length < 3) return;
  c.save(); c.strokeStyle = '#D92D20'; c.lineWidth = 2.4; c.setLineDash([]);
  /* a cut drawn in the other view still CUTS — it just is not something you can grab
     from here, so it reads the way every other cross-view mark reads */
  if (isShadow(it)) { c.globalAlpha = 0.35; c.setLineDash([4, 3]); c.lineWidth = 1.6; }
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath(); c.stroke(); c.restore();
}

/* ---------- the underlay ---------- */
function setUnderlay(png) {
  if (!png) { S.underlay = null; uctx.clearRect(0, 0, box.w, box.h); return; }
  const blob = new Blob([png], { type: 'image/png' });
  createImageBitmap(blob).then((bmp) => { S.underlay = bmp; paintUnder(); })
    .catch(() => flash('the underlay could not be decoded'));
}
function paintUnder() {
  uctx.clearRect(0, 0, box.w, box.h);
  if (!S.underlay || !S.showUnder) return;
  const bmp = S.underlay;
  const s = Math.min(box.w / bmp.width, box.h / bmp.height);
  uctx.save(); uctx.translate(S.viewport.x, S.viewport.y); uctx.scale(S.viewport.zoom, S.viewport.zoom);
  uctx.drawImage(bmp, (box.w - bmp.width * s) / 2, (box.h - bmp.height * s) / 2,
                 bmp.width * s, bmp.height * s); uctx.restore();
}


/* ==========================================================================
   3b · DRAWING A SOLID — the raw and the fit, together.

   THE ROLES ARE NOT COLOURS. It is tempting to give STAGE, WALL and LED an accent
   each, and it is wrong twice over: this palette's accents already mean status, and
   a role is not a status. So all three draw in the same ink and are told apart by
   WHAT IS DRAWN — a stage is filled, a wall carries the hatch marks that say which
   face is the surface, and an LED wall is drawn as the cabinets it is made of. The
   difference is the drawing, which is also the difference in the room.
   ========================================================================== */
const SOLID_HANDLE = 4.5;
/* set by `drawSolid` while a frame is being painted, read by `draw` when it is done —
   a shape whose height ran off the top of the paper, so the footer can say which */
let offPaper = null, offPaperSaid = null;

function drawSolid(c, it, sel, clean, alsoHeld) {
  const shadow = isShadow(it);
  const pts = solidPtsHere(it, clean ? 0.3 : 0.5);
  if (pts.length < 2) return;
  /* THE BAND IS A FACE WHETHER OR NOT THE OUTLINE WAS. `elevationProfile` returns the
     side of the solid, and the side of a solid is closed even when the footprint that
     made it was an open run. */
  const profile = hasProfile(it);
  const closedHere = profile || !!it.fit.closed;
  const ink = tok('--text-primary'), meta = tok('--text-meta');
  c.save();
  /* the faint dashed treatment says "drawn elsewhere, not yours to touch here", so the
     profile does not get it: it IS yours to touch here, and it reads as what it is —
     an ordinary shape, built or not, exactly like the ones drawn in this view */
  if (shadow && !profile) { c.globalAlpha = 0.35; c.setLineDash([4, 3]); }
  /* RECESSIVE, BECAUSE IT IS ALREADY TRUE. A built shape has stopped being a proposal,
     so it stops competing for attention with the one still being drawn. It is drawn in
     the meta ink at reduced weight — quieter than the active shapes and still clearly
     the same object, which is the point: you have to be able to see the room you have
     already built while you draw the next thing into it.
     NOT in `clean`: the rasterised PNG is evidence for a reader, and a shape faded out
     of the picture is a shape the reader does not know about. */
  /* AND THE PROFILE SAYS SO TOO. A height okayed in the room is built, and a built
     shape is blocked — so the band carries the same recessive ink and the same dashed
     keyline as any other built shape, and the top edge offers no handle until UNLOCK. */
  const locked = !clean && (!shadow || profile) && !!it.locked;
  if (locked) c.globalAlpha = 0.42;

  /* the raw ink underneath, faint — this is the evidence the fit is answerable to,
     and it stays in the rasterised PNG so the model sees both */
  if (!shadow && it.raw.length > 1) {
    c.save();
    c.globalAlpha = clean ? 0.30 : 0.22;
    c.strokeStyle = ink; c.lineWidth = 1.4; c.setLineDash([]);
    c.beginPath(); c.moveTo(it.raw[0][0], it.raw[0][1]);
    it.raw.forEach(p => c.lineTo(p[0], p[1]));
    c.stroke(); c.restore();
  }

  const trace = () => {
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    if (closedHere) c.closePath();
  };

  /* FILLED, and visibly so. A closed outline is a face — that is the whole claim of
     the shape — and an 8% tint was not enough for anyone to see that the thing has an
     inside. Every closed solid is filled, not just a deck: a closed wall is a face
     too, and an LED ring encloses a floor. */
  if (closedHere) {
    c.fillStyle = tok(it.role === 'led' ? '--tint-emphasis-s' : '--tint-emphasis');
    trace(); c.fill();
  }
  c.strokeStyle = locked ? meta : ink; c.lineWidth = sel ? 2.4 : 1.8; c.lineJoin = 'round';
  trace(); c.stroke();

  if (it.role === 'wall') drawWallHatch(c, pts, it, meta);
  /* not on a profile: the cabinet grid is laid out in the plan the run was drawn in,
     so drawn from the front it would collapse onto the ground under a band that is
     standing above it — two marks for one object, disagreeing */
  if (it.role === 'led' && !profile) drawLedTiles(c, it, shadow, ink, meta);
  /* Role decoration must not consume the geometry. Reassert the silhouette above LED
     cabinets/hatching so the selected object remains legible and stampable. */
  c.strokeStyle = locked ? meta : ink; c.lineWidth = sel ? 2.8 : 1.8; c.setLineDash([]);
  trace(); c.stroke();
  /* HELD, SAID IN THE INK EVERY OTHER HELD THING USES. Drawn AFTER the silhouette above,
     which exists to reassert the outline over role decoration — and was therefore painting
     straight over this, so a set of three read as one yellow shape and two white ones.
     THE LAST ONE PICKED GETS IT TOO. It used to be left in the ordinary ink on the grounds
     that its handles are already yellow — but handles are small and an outline is not, so
     a set of three read as two held shapes and one that looked like it had been dropped.
     Everything in the set looks the same, because everything in the set IS the same. */
  if (sel && !clean) {
    c.save(); c.strokeStyle = tok('--status-active');
    c.lineWidth = 2.4; c.globalAlpha = 1; c.setLineDash([]);
    trace(); c.stroke(); c.restore();
  }
  /* the lock, said in the drawing rather than only in a panel: a built shape carries a
     fine dashed keyline just inside its own outline */
  if (locked) {
    c.save(); c.strokeStyle = meta; c.lineWidth = 1; c.setLineDash([3, 3]); c.globalAlpha = 0.9;
    trace(); c.stroke(); c.restore();
  }

  /* the vertices ARE the object now — a fit that cannot be seen as vertices is a
     smooth line somebody has to take on trust. A LOCKED shape draws none: they are
     handles, and drawing handles on something that will not move is a lie about what
     the pointer can do. */
  if (!shadow && !locked && !alsoHeld) {
    const n = it.fit.verts.length, last = it.fit.closed ? n : n - 1;
    c.setLineDash([]);
    it.fit.verts.forEach((p) => {
      c.fillStyle = sel && !clean ? tok('--status-active') : ink;
      c.fillRect(p[0] - SOLID_HANDLE / 2, p[1] - SOLID_HANDLE / 2, SOLID_HANDLE, SOLID_HANDLE);
    });
    if (sel && !clean && selectedItems().length < 2) drawCorners(c, it);
    /* the apex of every arc, draggable — this is where a curve is corrected by
       hand when the fit read the drawing more literally than the hand meant it */
    if (sel && !clean) {
      for (let i = 0; i < last; i++) {
        const b = it.fit.bulges[i] || 0;
        const A = it.fit.verts[i], B = it.fit.verts[(i + 1) % n];
        const ap = apexOf(A, B, b);
        c.fillStyle = tok(b ? '--status-info' : '--text-disabled');
        c.beginPath(); c.arc(ap[0], ap[1], 3.2, 0, Math.PI * 2); c.fill();
      }
    }
  }
  /* THE HEIGHT, WRITTEN DOWN. A band the right size is not the same as a height that
     has been stated: a reader has to be able to see WHAT the number is and whether
     anybody has agreed to it. So the profile carries a dimension, the way a drawing
     does — witness lines, arrows, the metres — and it says which of the two it is:
     approved once the shape is built, proposed while it is still in hand. */
  if (profile && !clean) drawHeightDim(c, it, pts, locked, meta);
  /* WHAT THE AUDIENCE ACTUALLY SEES of a turned wall. In its own view the outline is
     drawn as drawn — it is the drawing, and it stays the thing you edit — but a wall
     swung in the room is not that wide from the front any more, and an elevation that
     said otherwise would be the one view lying about the one thing it is for. So the
     foreshortened silhouette is drawn over it, dashed, and the caption names the angle.
     Only when there IS an angle: at 0° the two outlines are the same line. */
  if (!shadow && !clean && (it.view || 'plan') === 'elevation' && Math.abs(it.yawDeg || 0) > 0.5) {
    drawYawGhost(c, it, pts, meta);
  }
  /* AND IF IT DOES NOT FIT, SAY SO. A band taller than the paper is drawn above the top
     edge, which looks exactly like a height that was never recorded — the complaint this
     whole view exists to answer. So the drawing does not fail quietly: it reports the
     number it cannot show you, and names the key that would. */
  /* against what is ON SCREEN, not against the canvas: zoomed out, a 18 m deck fits
     perfectly well, and saying it does not would be the drawing arguing with itself */
  if (profile && !clean && pts[0][1] < viewRect(false).y0 + 2 / S.viewport.zoom) offPaper = it;

  /* THE ONE HANDLE THIS VIEW IS ENTITLED TO. The outline belongs to the plan and is not
     editable from the front, so the profile shows no vertices and no corners — but the
     top edge is the height, and the height is what the elevation is for. Same promise
     as every other handle: it appears only when the shape is selected and unlocked. */
  if (profile && sel && !clean && !locked) {
    const h = heightHandleAt(it);
    c.save(); c.setLineDash([]);
    c.strokeStyle = tok('--status-active'); c.lineWidth = 2.4; c.globalAlpha = 0.9;
    c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); c.lineTo(pts[1][0], pts[1][1]); c.stroke();
    c.fillStyle = tok('--status-active');
    c.beginPath(); c.arc(h[0], h[1], 4.5, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  drawSolidCaption(c, it, pts, sel, clean, meta);
  c.restore();
}

/* the apex of a segment: the point the bulge is measured to, and the handle that
   sets it. A straight segment's apex is its midpoint, which is exactly where you
   would grab to bend it. */
function apexOf(A, B, bulge) {
  const mid = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];
  const ch = vsub(B, A), L = vlen(ch) || 1;
  const n = [-ch[1] / L, ch[0] / L];
  const sag = (bulge || 0) * L / 2;
  return [mid[0] + n[0] * sag, mid[1] + n[1] * sag];
}

/* which side of the line is the surface. A wall drawn in plan is a line, and a line
   says nothing about which way it faces — so the ticks do, on the side the normal
   points, which is the side a projector is meant to be on. */
function drawWallHatch(c, pts, it, col) {
  c.save();
  c.strokeStyle = col; c.lineWidth = 1; c.globalAlpha = 0.55; c.setLineDash([]);
  const step = Math.max(2, Math.floor(pts.length / 14));
  for (let i = step; i < pts.length - 1; i += step) {
    const a = pts[i - 1], b = pts[i + 1];
    const ch = vsub(b, a), L = vlen(ch) || 1;
    const n = [-ch[1] / L, ch[0] / L];
    c.beginPath();
    c.moveTo(pts[i][0], pts[i][1]);
    c.lineTo(pts[i][0] + n[0] * 7, pts[i][1] + n[1] * 7);
    c.stroke();
  }
  c.restore();
}

/* THE CABINETS, DRAWN AS CABINETS. This is the whole argument for LED having its
   own builder: the wall is not a curve, it is N flat panels of M×K tiles, and once
   it is drawn that way the question "does this curve cost me three extra cabinets"
   answers itself. */
function drawLedTiles(c, it, shadow, ink, col) {
  const g = ledGrid(it);
  c.save();
  c.setLineDash([]);
  /* AN ELEVATION LED IS A FACE, NOT A RUN, and `ledGrid` has always said so: in
     Elevation it returns ONE facet carrying a tile count and nothing else — no `a`
     and no `b`, because there is no cabinet line to draw between them, there is a
     wall of tiles seen square on. Drawing it the Plan way read `f.a` off that facet,
     got `undefined`, and threw. That throw happened inside `draw()`, which every
     gesture calls, and the right-click handler calls it one line BEFORE it opens the
     menu — so from the moment an LED was named in Elevation the pad stopped
     repainting and stopped answering right-clicks on anything. That is the whole of
     "once an LED is assigned, nothing else works", and it is why it only ever
     happened in Elevation. A face is drawn as what it is: its seams. */
  /* a floor's seams are drawn the same way a face's are — see `ledGrid`. In ELEVATION a
     floor is a plate seen edge-on and has no seams to show, which `elevationProfile` draws. */
  if ((it.view || 'plan') === 'elevation'
      || (isFlatLed(it) && S.projection !== 'elevation')) {
    const pts = solidPtsHere(it, 0.5);
    if (!shadow && pts.length > 2 && g.cols > 0 && g.rows > 0) {
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs);
      const y0 = Math.min(...ys), y1 = Math.max(...ys);
      c.save();
      /* clipped to the outline, so a notched or curved face shows seams only where
         it actually carries cabinets */
      c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
      c.closePath(); c.clip();
      c.strokeStyle = col; c.lineWidth = 1; c.globalAlpha = 0.7;
      for (let k = 1; k < g.cols; k++) {
        const x = x0 + (x1 - x0) * k / g.cols;
        c.beginPath(); c.moveTo(x, y0); c.lineTo(x, y1); c.stroke();
      }
      for (let k = 1; k < g.rows; k++) {
        const y = y0 + (y1 - y0) * k / g.rows;
        c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke();
      }
      c.restore();
    }
    c.restore();
    return;
  }
  g.facets.forEach((f) => {
    /* and nothing without both ends is drawn as a line again */
    if (!f || !f.a || !f.b) return;
    const to = (p) => (it.view || 'plan') === S.projection ? p : worldToPage(pageToWorld(p, it.view || 'plan'));
    const a = to(f.a), b = to(f.b);
    c.strokeStyle = ink; c.lineWidth = 2.2; c.globalAlpha = shadow ? 0.4 : 1;
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
    /* the seams between cabinets, and a tick at each end for the frame */
    c.strokeStyle = col; c.lineWidth = 1; c.globalAlpha = shadow ? 0.25 : 0.7;
    const ch = vsub(b, a), L = vlen(ch) || 1;
    const n = [-ch[1] / L, ch[0] / L];
    for (let k = 0; k <= f.cols; k++) {
      const t = k / f.cols;
      const p = [a[0] + ch[0] * t, a[1] + ch[1] * t];
      const len = (k === 0 || k === f.cols) ? 6 : 3.5;
      c.beginPath(); c.moveTo(p[0] - n[0] * len, p[1] - n[1] * len);
      c.lineTo(p[0] + n[0] * len, p[1] + n[1] * len); c.stroke();
    }
  });
  c.restore();
}

/* the same outline, squeezed by cos of the turn about the vertical — which is what an
   orthographic front view of a turned face IS. Drawn over the true outline rather than
   instead of it, so both the drawing and its appearance are answerable. */
function drawYawGhost(c, it, pts, meta) {
  const k = Math.abs(Math.cos((it.yawDeg || 0) * Math.PI / 180));
  const xs = pts.map(p => p[0]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
  const q = pts.map(p => [cx + (p[0] - cx) * k, p[1]]);
  c.save();
  c.strokeStyle = tok('--status-info'); c.lineWidth = 1.4;
  c.setLineDash([5, 4]); c.globalAlpha = 0.85; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(q[0][0], q[0][1]);
  for (let i = 1; i < q.length; i++) c.lineTo(q[i][0], q[i][1]);
  if (it.fit.closed) c.closePath();
  c.stroke();
  c.font = '600 8px ' + tok('--font');
  c.fillStyle = tok('--status-info'); c.textAlign = 'center'; c.textBaseline = 'top';
  c.fillText('SEEN FROM THE FRONT', cx, Math.max(...q.map(p => p[1])) + 4);
  c.restore();
}

/* ---------- the height dimension on an elevation profile ----------
   Drawn just outside the band so it never sits on top of the object it measures, and
   flipped to the inside when the band is against the edge of the paper. */
function drawHeightDim(c, it, pts, approved, meta) {
  const top = pts[0][1], foot = pts[2][1];
  const x0 = Math.min(pts[0][0], pts[1][0]), x1 = Math.max(pts[0][0], pts[1][0]);
  const OFF = 14;
  /* outside on the left by default; inside when there is no paper left out there */
  const x = (x0 - OFF > 26) ? x0 - OFF : x0 + OFF;
  const ink = approved ? meta : tok('--status-active');
  const arrow = (y, dir) => {
    c.beginPath();
    c.moveTo(x, y); c.lineTo(x - 3, y + 5 * dir); c.moveTo(x, y); c.lineTo(x + 3, y + 5 * dir);
    c.stroke();
  };
  c.save();
  c.globalAlpha = 1; c.setLineDash([]);
  c.strokeStyle = ink; c.fillStyle = ink; c.lineWidth = 1;
  /* the witness lines: where the measurement is taken FROM, said in the drawing */
  c.globalAlpha = 0.5;
  c.beginPath();
  c.moveTo(x - 4, top); c.lineTo(Math.min(x1, x0 + 10), top);
  c.moveTo(x - 4, foot); c.lineTo(Math.min(x1, x0 + 10), foot);
  c.stroke();
  c.globalAlpha = 1;
  c.beginPath(); c.moveTo(x, top); c.lineTo(x, foot); c.stroke();
  /* arrows only when there is room for them to point at anything */
  if (foot - top > 16) { arrow(top, 1); arrow(foot, -1); }
  c.font = '600 9px ' + tok('--font');
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const label = it.hM.toFixed(2) + ' M';
  const ty = (top + foot) / 2;
  const w = c.measureText(label).width + 6;
  /* knocked out of the line, so the number is readable where the line runs through it */
  c.save();
  c.fillStyle = tok('--surface-canvas'); c.globalAlpha = 0.92;
  c.fillRect(x - w / 2, ty - 6.5, w, 13);
  c.restore();
  c.fillStyle = ink;
  c.fillText(label, x, ty);
  /* and whether it is a fact or a proposal — the same word the row and the lock use */
  c.font = '600 7.5px ' + tok('--font');
  c.globalAlpha = 0.8;
  c.textBaseline = 'top';
  c.fillText(approved ? 'BUILT' : 'PROPOSED', x, foot + 5);
  c.restore();
}

function drawSolidCaption(c, it, pts, sel, clean, col) {
  const b = solidBBox(it);
  const anchor = (it.view || 'plan') === S.projection
    ? [(b.x0 + b.x1) / 2, b.y0 - 8]
    : (() => { const p = solidPtsHere(it, 2); const ys = p.map(q => q[1]), xs = p.map(q => q[0]);
               return [(Math.min(...xs) + Math.max(...xs)) / 2, Math.min(...ys) - 8]; })();
  /* clamped into the canvas: a caption above a shape drawn near the top edge is a
     caption nobody — and no model reading the PNG — ever sees */
  const two = sel && !clean;
  const y = Math.max(26 + (two ? 11 : 0), Math.min(box.h - 6, anchor[1]));
  const x = Math.max(60, Math.min(box.w - 60, anchor[0]));
  c.save();
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillStyle = col;
  c.font = '600 9px ' + tok('--font');
  c.fillText(solidTitle(it), x, y);
  if (two) {
    c.font = '500 8.5px ' + tok('--font');
    c.fillStyle = tok('--status-info');
    c.fillText(solidFitLine(it), x, y - 11);
  }
  c.restore();
}
/* what it IS and how big, in one line — the caption is in the PNG, so this is
   also what the model reads off the drawing */
function solidTitle(it) {
  const R = isFlatLed(it) ? 'LED FLOOR' : SOLID_ROLES[it.role].label;
  const nm = it.name ? it.name + ' · ' : '';
  if (it.role === 'led') {
    const g = ledGrid(it);
    return nm + R + ' · ' + g.cols + '×' + g.rows + ' TILES · '
      + g.w.toFixed(1) + '×' + g.h.toFixed(1) + ' M' + (g.facets.length > 1 ? ' · ' + g.facets.length + ' PANELS' : '');
  }
  /* THE ANGLE, IN WORDS, for the shapes whose drawing cannot show it. A floor outline
     turns on the page and needs no caption; a front outline is drawn in a plane the turn
     is not in, so the number is the only place the turn is legible from here. */
  const turn = ((it.view || 'plan') === 'elevation' && Math.abs(it.yawDeg || 0) > 0.5)
    ? ' · ' + Math.round(it.yawDeg) + '° IN PLAN' : '';
  if (it.fit.closed) return nm + R + ' · ' + solidArea(it).toFixed(1) + ' M² · H ' + it.hM.toFixed(2) + ' M' + turn;
  return nm + R + ' · ' + solidLength(it).toFixed(1) + ' M LONG · H ' + it.hM.toFixed(2) + ' M' + turn;
}
function solidFitLine(it) {
  const f = it.fit, s = pxPerMetre();
  const bits = [f.rawCount + ' PTS → ' + f.verts.length + ' VERTS'];
  if (f.arcs) bits.push(f.arcs + (f.arcs === 1 ? ' ARC' : ' ARCS'));
  bits.push('±' + (f.rms / s * 100).toFixed(0) + ' CM');
  if (f.symmetric) bits.push('SYMMETRISED');
  if (it.edited) bits.push('HAND-EDITED');
  return bits.join(' · ');
}

/* ==========================================================================
   4 · SIZE — the panel is dragged, split and maximised constantly, so the canvas
   follows its box rather than the window.
   ========================================================================== */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  /* A ZERO-SIZED BOX IS NOT A SIZE. A panel that is collapsed, in a hidden tab, or
     mid-relayout measures 0×0, and taking that at its word poisoned everything
     downstream: the origin moved to (0,0), a rasterised PNG came out empty, and AID3N
     was handed a payload with no picture in it and correctly said it had nothing to look
     at. The last real measurement is the truthful one until there is another. */
  const m = { w: stage.clientWidth, h: stage.clientHeight };
  if (m.w > 0 && m.h > 0) box = m;
  else if (!box.w || !box.h) box = { w: 1200, h: 700 };      // first paint, never measured
  [ink, under].forEach((cv) => {
    cv.width = Math.max(1, Math.round(box.w * dpr));
    cv.height = Math.max(1, Math.round(box.h * dpr));
  });
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  uctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.__base = uctx.__base = [dpr, 0, 0, dpr, 0, 0];
  /* A GROUND LINE OFF THE PAPER IS NOT A GROUND LINE. It is fixed on purpose — moving it
     would change what every height already drawn against it means — but it was fixed at
     whatever the panel measured the first time the Elevation was opened, and a panel that
     is later made shorter left it below the bottom edge. Everything standing on it went
     with it, so the Elevation came up empty and a height that had been stated and okayed
     was simply not on the paper. Only ever corrected when it has actually fallen off:
     an unreadable view is worse than a re-anchored one, and inside the paper nothing
     moves. */
  if (S.groundLine != null && (S.groundLine > box.h - 6 || S.groundLine < 6)) {
    S.groundLine = Math.round(box.h * 0.78);
    if (S.projection === 'elevation') flash('the ground line was off the paper — put back at ' + S.groundLine + ' px');
  }
  paintUnder(); draw();
  /* AND THE SHAPES THAT WERE WAITING FOR A PAGE TO BE PUT ON. The scene arrives on the
     handshake, which is often before the panel has been measured — a collapsed pane, a
     background tab — and placing an outline against a guessed box would be placing it
     wrong. `adoptSceneSolids` says so and asks to be called back; this is the callback. */
  if (adoptWanted) adoptSceneSolids();
}
new ResizeObserver(resize).observe(stage);

/* ==========================================================================
   5 · INPUT — one pointer handler, dispatched on the armed tool.
   ========================================================================== */
const pt = (e) => {
  const r = ink.getBoundingClientRect();
  return [(e.clientX - r.left - S.viewport.x) / S.viewport.zoom,
          (e.clientY - r.top - S.viewport.y) / S.viewport.zoom];
};

/* Pointer-centred viewport zoom. The logical point below the cursor is solved before
   changing zoom, then the display translation is adjusted so that exact point lands
   under the same screen pixel afterwards. Geometry and the scale calibration do not
   change. */
/* ---------- SCROLL PANS. PINCH ZOOMS. ----------
   Every wheel event used to zoom, which on a trackpad means two fingers on the pad —
   the gesture everybody uses to move around a drawing — changed the magnification
   instead. And there was no pan at all, so zooming in trapped you looking at whatever
   happened to be under the cursor with no way to travel.

   The mapping is the one every drawing tool on a Mac uses: a plain scroll moves the
   paper, a pinch (which the browser reports as a wheel with ctrlKey) zooms about the
   pointer, and ⌘/Ctrl-scroll zooms too for a mouse with only a wheel. */
function zoomAt(sx, sy, next) {
  next = Math.max(0.15, Math.min(8, next));
  if (Math.abs(next - S.viewport.zoom) < 1e-5) return false;
  const lx = (sx - S.viewport.x) / S.viewport.zoom;
  const ly = (sy - S.viewport.y) / S.viewport.zoom;
  S.viewport.zoom = next;
  S.viewport.x = sx - lx * next;
  S.viewport.y = sy - ly * next;
  return true;
}
function afterViewport() { paintUnder(); draw(); paintZoom(); }
function paintZoom() {
  const el = document.getElementById('c-zoom');
  if (el) el.textContent = Math.round(S.viewport.zoom * 100) + '%';
}
ink.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = ink.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  if (e.ctrlKey || e.metaKey) {
    /* a pinch reports much smaller deltas than a wheel notch, so the exponent is the
       same either way and the gesture decides how far it goes */
    if (!zoomAt(sx, sy, S.viewport.zoom * Math.exp(-e.deltaY * 0.01))) return;
  } else {
    S.viewport.x -= e.deltaX;
    S.viewport.y -= e.deltaY;
  }
  afterViewport();
}, { passive: false });

/* ---------- AND A HAND, for a mouse with no second axis ----------

   keydown for the same reason Option is: in an iframe a key event goes where FOCUS is,
   not where the pointer is. */
let spaceHeld = false, panDrag = null;
window.addEventListener('keydown', (e) => {

});
window.addEventListener('keyup', (e) => { if (e.code === 'Space') { spaceHeld = false; paintCursor(lastHoverPoint || [0, 0]); } });
window.addEventListener('blur', () => { spaceHeld = false; });
ink.addEventListener('pointerdown', (e) => {
  if (e.button !== 1 && !spaceHeld) return;
  e.preventDefault(); e.stopPropagation();
  panDrag = { x: e.clientX, y: e.clientY, vx: S.viewport.x, vy: S.viewport.y };
  ink.style.cursor = 'grabbing';

}, true);
window.addEventListener('pointermove', (e) => {
