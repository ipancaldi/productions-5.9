window.addEventListener('pointerup', () => {
  if (!panDrag) return;
  panDrag = null;
  ink.style.cursor = spaceHeld ? 'grab' : 'crosshair';
  paintCursor(lastHoverPoint || [0, 0]);
});

/* ---------- BACK TO SOMETHING YOU CAN SEE ----------
   FIT frames everything drawn; 1:1 is the same reset the drawing started at. Both exist
   because "I have lost my drawing" and "I want it at true size" are different problems
   and scrolling back exactly as far as you scrolled in solves neither. */
function resetZoom() {
  S.viewport = { zoom: 1, x: 0, y: 0 };
  afterViewport();
  flash('1:1');
}
function fitZoom() {
  const pts = [];
  S.items.forEach(it => {
    if (it.t === 'solid') solidPtsHere(it, 2).forEach(q => pts.push(q));
    else if (it.pts) ptsHere(it).forEach(q => pts.push(q));
    else if (it.at) pts.push(ptsHere(it)[0]);
  });
  if (pts.length < 2) return resetZoom();
  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = 40;
  const z = Math.max(0.15, Math.min(8,
    Math.min((box.w - pad * 2) / Math.max(1, x1 - x0), (box.h - pad * 2) / Math.max(1, y1 - y0))));
  S.viewport.zoom = z;
  S.viewport.x = (box.w - (x1 - x0) * z) / 2 - x0 * z;
  S.viewport.y = (box.h - (y1 - y0) * z) / 2 - y0 * z;
  afterViewport();
  flash('fit · ' + Math.round(z * 100) + '%');
}
document.getElementById('c-zoom').addEventListener('click', (e) => { e.shiftKey ? resetZoom() : fitZoom(); });
const near = (a, b, d) => Math.hypot(a[0] - b[0], a[1] - b[1]) <= d;

let dragging = null;      // a stamp being moved
let paletteDrag = null;   // an anchor being dragged out of the toolbar — see 'SAYING WHAT SOMETHING IS'
let aiming = null;        // a stamp being pointed
let scaleFirst = null;    // the first click of the scale gesture
/* only things that POINT can be aimed. Audience is a facing region, not inert room
   geometry: its target determines which way the people look. */
const AIMABLE = new Set(['PROJ', 'CAM', 'TRACK', 'AUDIENCE', 'PERSON']);
/* tools whose whole job is "put this HERE": they must not be intercepted by a
   selection's own handles */
const PLACING_TOOLS = new Set(['stamp', 'text', 'origin', 'scale', 'erase']);
/* and the ones whose whole job is to leave a new mark: they must not be intercepted by
   the BODY of what is already on the paper */
const DRAW_TOOLS = new Set(['trace', 'pen', 'line', 'rect', 'ellipse']);

ink.addEventListener('pointerdown', (e) => {
  if (S.busy) return;
  /* THE RIGHT BUTTON IS NOT A DRAW AND NOT A GRAB. It fires `pointerdown` before
     `contextmenu`, so every right-click was running the whole dispatch below first —
     which selected whatever was under it and, once a SET could be held, collapsed the
     set on the way to the menu that was about to offer an action on it. Right-click has
     exactly one meaning here and it is handled where that meaning lives. */
  if (e.button === 2) return;
  ink.setPointerCapture(e.pointerId);
  const p = pt(e);

  /* OPTION OUTRANKS EVERY GRAB, and it has to, or the feature cannot exist. A cut-out
     must START INSIDE A CLOSED SOLID — and that is the exact condition that makes the
     "drag the whole solid" branch below fire and return. So every Option-drag was being
     read as "pick this solid up and move it": no cut, no red outline, and not even the
     flash that would have explained it. The gesture was unreachable, not broken.
     Handles and anchors are excluded for the same reason — a cut aimed at the middle of
     a shape lands on the handles that are there because it is selected. */
  const cutting = e.altKey && CUT_TOOLS.has(S.tool);

  /* A SELECTED SOLID'S HANDLES COME FIRST — before any tool and before the anchors,
     because they are only there while it is selected and they are what you are looking
     at when they are.

     EXCEPT FOR THE TOOLS THAT PUT SOMETHING AT A POINT. A stamp is aimed at a place,
     and the place you most want to stamp is the middle of the shape you just traced —
     which is exactly where its handles are. Letting them win meant dropping LED on a
     freshly drawn wall silently dragged a vertex instead, and the shape stayed a deck
     with no error to explain it. */
  /* A TRANSFORM CORNER OUTRANKS A VERTEX. They sit on top of each other at the corners
     of a rectangular shape, and the one you are aiming at when you go to the corner of a
     selection is the one that resizes it. */
  /* AND NOT THE SELECTED SHAPE'S HANDLES EITHER, under a drawing tool.
     Naming a shape SELECTS it, which is what turns its handles on — so from the moment
     you assign the first role, the whole outline and all four corners of that shape are
     grab targets. A stage plan is drawn edge to edge: the next shape almost always
     starts on or beside the last one's line. The press resized the named shape instead
     of drawing, no new shape existed, and right-clicking where it should have been
     found only the shape that had just been stretched.
     Reshaping is what SELECT is for, and it is one key away. */
  const drawing = DRAW_TOOLS.has(S.tool);
  /* THE SET'S FURNITURE OUTRANKS THE MEMBER'S. Both boxes are on screen at once when
     several shapes are held — the set's, and the one belonging to whichever member is on
     top — and their corners sit within a few pixels of each other. Asked in the other
     order, grabbing the set's rotate zone turned ONE wall out of three and left the
     others where they were, which looks like the group transform simply not working.
     A set is what is being pointed at while a set is held. */
  if (!cutting && !drawing && !PLACING_TOOLS.has(S.tool)) {
    const gr = hitGroupRotate(p);
    if (gr) { mark(); groupDrag = { kind: 'rot', pivot: gr.pivot, cs: gr.cs,
                                    a0: Math.atan2(p[1] - gr.pivot[1], p[0] - gr.pivot[0]),
                                    applied: 0 }; return; }
    const gc = hitGroupCorner(p);
    if (gc) { mark(); groupDrag = { kind: 'scale', k: gc.k, cs: gc.cs, applied: 1 }; return; }
  }
  const ch = (cutting || drawing || PLACING_TOOLS.has(S.tool)) ? null : hitCorner(p);
  if (ch) {
    mark();
    const target = S.items[ch.i];
    cornerDrag = Object.assign(ch, target.t === 'solid' ? {
      raw0: target.raw.map(q => q.slice()),
      verts0: target.fit.verts.map(q => q.slice()),
      bulges0: target.fit.bulges.slice(),
    } : { pts0: target.pts.map(q => q.slice()) });
    return;
  }
  const rh = (cutting || drawing || PLACING_TOOLS.has(S.tool)) ? null : hitRotateCorner(p);
  if (rh) {
    mark();
    const target = S.items[rh.i];
    const turnPts = target.t === 'stroke' ? strokePointsForRotation(target) : null;
    if (turnPts) { target.pts = turnPts; target.kind = 'pen'; }
    rotateDrag = Object.assign(rh, {
      angle0: Math.atan2(p[1] - rh.pivot[1], p[0] - rh.pivot[0]),
      raw0: target.t === 'solid' ? target.raw.map(q => q.slice()) : null,
      verts0: target.t === 'solid' ? target.fit.verts.map(q => q.slice()) : null,
      pts0: target.t === 'stroke' ? target.pts.map(q => q.slice()) : null,
    });
    return;
  }
  /* SHIFT-DRAG IS A BAND FROM ANYWHERE. A marquee that can only start on empty paper is a
     marquee you cannot use on a crowded plan — press on a wall meaning to sweep three and
     you have picked up one wall instead, which is exactly what "only one gets selected"
     was. SHIFT already means "add to what is held", so shift-drag means "add a band", and
     a shift-press that never travels still just toggles the shape under it. */
  /* v5.8 · A SHIFT-BAND FROM A MODEL'S FACE IS A SHIFT-CLICK ON IT. The marquee comes before
     everything on purpose — "sweep three walls" has to work over a crowded plan — but a
     candidate outline is not one of your shapes, so a shift-press on one would start a band
     over it and the set could never be built up. Held back only when nothing of YOURS is
     under the pointer, so the band still wins everywhere it used to. */
  if (e.shiftKey && S.tool === 'select' && !cutting && !drawing
      && !(hitAny(p) < 0 && hitRoomFace(p))) {
    marquee = { from: p, to: p, add: true, fromShape: hitSolid(p) };
    return;
  }
  const sh = (cutting || drawing || PLACING_TOOLS.has(S.tool)) ? null : hitSolidHandle(p);
  if (sh) { mark(); handleDrag = sh; dragSolidHandle(sh, p); return; }
  /* the height handle sits where a vertex handle would and is checked in the same
     breath, for the same reason: a handle you can see has to win over the body under it */
  const hh = (cutting || drawing || PLACING_TOOLS.has(S.tool)) ? null : hitHeightHandle(p);
  if (hh) { mark(); heightDrag = hh; return; }

  /* AN ANCHOR TAKES PRECEDENCE OVER ANY TOOL — grabbing what you can see is what
     everybody tries first. TWO EXCEPTIONS, and both of them were bugs:

     1. NOT FOR A TOOL WHOSE JOB IS "PUT THIS HERE". The stamp tool reached this line,
        found the pin left by the LAST stamp, and picked it up instead of stamping —
        and returned, so `case 'stamp'` was never reached. Dropping LED on a shape
        therefore made every FURTHER stamp near that spot do nothing at all. Handles are
        already excluded here for exactly this reason; pins had been missed.

     2. NOT A ROLE PIN THAT IS SITTING ON ITS OWN SHAPE. A role pin is a NOTE about a
        place — `marker: true`, contributing nothing to the scene. Letting one outrank
        the shape it labels meant that after stamping LED, every click in the middle of
        that shape grabbed the little pin instead, and the shape could not be selected
        or dragged from its body any more. The pin is still reachable everywhere it is
        not covering a shape, and always with the eraser. */
  const placing = PLACING_TOOLS.has(S.tool);
  let hit = cutting ? -1 : hitStamp(p);
  /* A ROLE PIN NEVER OUTRANKS THE SHAPE IT LABELS. */
  if (hit >= 0 && S.items[hit].marker && hitSolid(p) >= 0) hit = -1;
  /* AIM: drag out of an anchor to say which way it points. Its own tool AND
     shift-drag from any tool, because nobody wants to change tool to turn a camera —
     which is why this is checked BEFORE the placing-tool guard below rather than after. */
  if (hit >= 0 && (S.tool === 'aim' || e.shiftKey) && AIMABLE.has(String(S.items[hit].label).toUpperCase())) {
    selectItem(hit);
    aiming = { i: hit, from: S.items[hit].aim, fromLen: S.items[hit].aimLen };
    setAim(hit, p);
    return;
  }
  /* PICKING A PIN UP IS NOT WHAT A PLACING TOOL IS FOR. This branch is what swallowed
     every stamp dropped near an earlier one: it fired, dragged the old pin, and
     RETURNED before `case 'stamp'` could run. */
  if (hit >= 0 && !placing) {
    selectItem(hit);
    dragging = { i: hit, moved: false, from: S.items[hit].at.slice() };
    draw();
    return;
  }

  /* ---------- the body of a solid: select it, and drag it whole ----------
     BUT NOT UNDER A TOOL WHOSE JOB IS TO PUT NEW INK DOWN. This branch used to fire for
     every tool except erase, stamp and text — so the whole body of any existing solid
     was a grab target, and pressing inside one with TRACE or RECT armed picked the old
     shape up instead of starting a new one. The new shape simply never existed.

     It reads as "assigning LED stopped everything working" because assigning a role is
     what CREATES the condition: a role is what turns a stroke into a solid, and only a
     solid has a body to grab. Draw a wall, name it, try to draw the next thing over or
     inside it, and nothing happens — then right-click and you get the wall's menu,
     because the wall is what is under the pointer.

     Moving a shape is what SELECT is for, and it is one key away. */
  const si = (cutting || drawing) ? -1 : hitSolid(p);
  /* A PRESS INSIDE THE SET MOVES THE SET. Without this, grabbing one of three held walls
     dropped the other two and dragged that one — the selection was real and the drag was
     not about it. Checked before the single-shape branch, because the shape under the
     pointer is a member of the thing being asked for rather than the thing itself. */
  if (!cutting && !drawing && !PLACING_TOOLS.has(S.tool) && S.tool !== 'erase'
      && selectedItems().length > 1 && inGroupBox(p)) {
    mark();
    groupDrag = { kind: 'move', from: p, moved: false };
    return;
  }
  if (si >= 0 && S.tool !== 'erase' && S.tool !== 'stamp' && S.tool !== 'text') {
    selectItem(si);
    /* A LOCKED SHAPE IS STILL SELECTABLE — it has to be, or its own UNLOCK button is
       unreachable and the lock is a trap rather than a guard. What it does not do is
       move. */
    if (isLocked(S.items[si])) {
      flash(solidTitle(S.items[si]) + ' is built — UNLOCK it to edit');
      draw();
      return;
    }
    /* THE OUTLINE BELONGS TO THE PLAN. Seen from the front the only true thing this
       view knows about the shape is how tall it is, so its body selects and nothing
       more — dragging it here would push a footprint sideways through a view that
       cannot see where it lands. The top edge is the handle this view does own. */
    if (hasProfile(S.items[si])) {
      flash(solidTitle(S.items[si]) + ' — pull the top edge to set the height · the outline is edited in PLAN');
      draw();
      return;
    }
    solidDrag = { i: si, from: p, moved: false };
    draw();
    return;
  }

  /* SELECT takes anything else that is there — a stroke, a label — and moves it.
     Clicking nothing is a real answer: it clears the selection, here and in the Scene
     Study, which is the only way to say "I am done with that one". */
  if (S.tool === 'select') {
    const any = hitAny(p);
    if (any >= 0) {
      selectItem(any);
      if (isLocked(S.items[any])) {
        flash(solidTitle(S.items[any]) + ' is built — UNLOCK it to edit');
        draw();
        return;
      }
      if (hasProfile(S.items[any])) {
        flash(solidTitle(S.items[any]) + ' — pull the top edge to set the height · the outline is edited in PLAN');
        draw();
        return;
      }
      solidDrag = { i: any, from: p, moved: false };
      draw();
      return;
    }
    /* v5.8 · EXCEPT THAT EMPTY PAPER MAY HAVE A MODEL'S FACE ON IT. A candidate is not one
       of your shapes, so it is not in `hitAny` and it must not outrank anything that is —
       which is why it is asked here, last, once nothing of yours has answered. Clicking one
       holds it and says what it is; TAKING it is the right-click, the same gesture that
       names any other outline on this paper. */
    const cf = hitRoomFace(p);
    if (cf) {
      /* v5.8 · A BUILT FACE IS SELECTED, NOT HELD. Held means "about to be taken", and this
         one has been: it is a shape in the take now. `faceSel` is set BEFORE `selectItem`
         because that is what announces the selection, and announcing it with the old value
         is how the room ends up lighting the surface you just stopped pointing at. */
      if (cf.taken) {
        faceHeld.clear();
        faceSel = cf.id;
        selectItem(-1);
        post('hoverFace', { faceId: cf.id });
        const U = HOST.unitsPerMetre || 10;
        flash(shortModelName(cf.name) + ' · ' + ((cf.w || 0) / U).toFixed(1) + ' × '
          + ((cf.hM || 0) / U).toFixed(1) + ' m — BUILT and selected'
          + ' · right-click to change what it is');
        draw(); status();
        return;
      }
      faceSel = null;
      selectItem(-1);
      /* SHIFT ACCUMULATES, exactly as it does for your own shapes — which is what makes
         "these five flats are one screen" a single act instead of five. A plain click is a
         fresh single choice, so the one-face flow is unchanged. */
      if (e.shiftKey) {
        if (faceHeld.has(cf.id)) faceHeld.delete(cf.id); else faceHeld.add(cf.id);
      } else { faceHeld.clear(); faceHeld.add(cf.id); }
      post('hoverFace', { faceId: faceHeld.has(cf.id) ? cf.id : null });
      const U = HOST.unitsPerMetre || 10;
      if (faceHeld.size > 1) {
        const held = heldFaces();
        const area = held.reduce((a, x) => a + ((x.w || 0) / U) * ((x.hM || 0) / U), 0);
        flash(faceHeld.size + ' faces held · ' + area.toFixed(1) + ' m²'
          + ' — right-click to name them all, or DEL to take them off the model');
      } else if (faceHeld.size === 1) {
        flash(shortModelName(cf.name)
          + ' · ' + ((cf.w || 0) / U).toFixed(1) + ' × ' + ((cf.hM || 0) / U).toFixed(1) + ' m '
          + (cf.flat ? 'flat face' : 'standing face')
          + ' — right-click to make it a shape · shift-click to hold more');
      } else flash('nothing held');
      draw(); status();
      return;
    }
    faceHeld.clear();
    faceSel = null;
    /* NOTHING UNDER THE POINTER IS A MARQUEE, not an answer. Clearing the selection is
       still what a CLICK on empty paper means — `marqueeUp` does it when the rectangle
       never went anywhere — but a DRAG from empty paper is the gesture everybody already
       has in every other tool, and without it picking out three walls means three
       separate aimed clicks with a modifier held. */
    selectItem(-1);
    marquee = { from: p, to: p, add: e.shiftKey };
    draw();
    return;
  }

  switch (S.tool) {
    case 'trace': {
      /* clicking an EXISTING stroke converts it, which is the cheapest way to get a
         solid out of a drawing that already exists */
      const st = hitAny(p);
      if (st >= 0 && S.items[st].t === 'stroke') { convertStroke(st); return; }
      /* NO TARGET AT PRESS-TIME. A cutter is allowed to start on empty paper and
         find what it overlaps when it is finished — asking "are you inside something?"
         on the way down is what made this refuse to draw at all. */
      const negative = e.altKey;
      live = { t: 'trace', oid: nextItemId(negative ? 'cutout' : 'shape'), pts: [p],
               view: S.projection, negative };
      return;
    }
    case 'erase': {
      /* the eraser is the one placing tool that has to REACH a pin, so it asks for one
         first — `hitAny` is body-first and would take the shape out from under it */
      const st = hitStamp(p);
      const i = st >= 0 ? st : hitAny(p);
      if (i >= 0) { mark(); S.items.splice(i, 1); selectItem(-1); hideAsk(); draw(); status(); dirty(); ghostSoon(); }
      return;
    }
    case 'text': openTextInput(p); return;
    case 'origin': mark(); S.origin = p; draw(); status(); return;
    case 'scale':
      if (!scaleFirst) { scaleFirst = p; live = { t: 'scale', from: p, to: p }; draw(); }
      else { askScale(scaleFirst, p); scaleFirst = null; live = null; draw(); }
      return;
    case 'stamp':
      /* shift on the paper means the same thing as shift on the palette: keep placing */
      if (e.shiftKey) S.armedSticky = true;
      dropStamp(S.armed || 'PROJ', p);
      return;
    case 'pen':
      live = { t: 'stroke', oid: nextItemId(e.altKey ? 'cutout' : 'stroke'), kind: 'pen', pts: [p],
               w: penWidth(e), view: S.projection, negative: e.altKey };
      return;
    default:
      live = { t: 'stroke', oid: nextItemId(e.altKey ? 'cutout' : 'stroke'), kind: S.tool, pts: [p, p], w: 2,
               view: S.projection, negative: e.altKey && ['rect', 'ellipse'].includes(S.tool) };
      return;
  }
});

/* THE PAD USUALLY LIVES IN AN IFRAME, and a key event goes where FOCUS is, not
   where the pointer is. Hovering the canvas inside the Hub does not focus this
   document, so the Option keydown below was being delivered to the Hub instead and
   the cursor never changed — the feature looked absent rather than unfocused.
   Two answers, because either alone leaves a hole: take the focus when the pointer
   arrives, so real keydown/keyup work; and read `altKey` off every pointer event,
   which is true whether or not anybody focused anything. */
ink.addEventListener('pointerenter', (e) => {
  optionHeld = !!e.altKey;
  /* only when the person is not typing somewhere else in the host */
  const ae = (window.parent && window.parent !== window) ? null : document.activeElement;
  if (!ae || !/^(INPUT|TEXTAREA)$/.test(ae.tagName)) { try { window.focus(); } catch (_) {} }
  paintCursor(pt(e));
});
ink.addEventListener('pointerleave', () => { optionHeld = false; });

ink.addEventListener('pointermove', (e) => {
  const p = pt(e);
  optionHeld = !!e.altKey;
  hover(p);
  if (rotateDrag) { rotateItem(rotateDrag, p); return; }
  if (cornerDrag) { scaleItem(cornerDrag, p, e.shiftKey); return; }
  if (handleDrag) { dragSolidHandle(handleDrag, p); return; }
  if (heightDrag) { dragHeight(heightDrag, p, e.shiftKey); return; }
  if (groupDrag) {
    if (groupDrag.kind === 'rot') return rotateGroup(groupDrag, p);
    if (groupDrag.kind === 'scale') return scaleGroup(groupDrag, p);
    const locked = moveGroup(p[0] - groupDrag.from[0], p[1] - groupDrag.from[1]);
    groupDrag.from = p; groupDrag.moved = true;
    if (locked && !groupDrag.said) { groupDrag.said = true; flash(locked + ' built · UNLOCK to move those too'); }
    draw(); liveNow();
    return;
  }
  if (marquee) { marquee.to = p; draw(); status(); return; }
  if (solidDrag) {
    translateItem(solidDrag.i, p[0] - solidDrag.from[0], p[1] - solidDrag.from[1]);
    solidDrag.from = p; solidDrag.moved = true;
    draw();
    /* LIVE means live: a shape already built follows the pointer in the Scene Study
       while it is being dragged, rather than after it is let go */
    if (S.items[solidDrag.i] && ['solid', 'stroke'].includes(S.items[solidDrag.i].t)) liveNow();
    return;
  }
  if (aiming) { setAim(aiming.i, p); return; }
  if (dragging) {
    moveStampHere(S.items[dragging.i], p); dragging.moved = true; draw();
    /* Positional stamps use the same stable preview operation as their initial drop.
       Re-send it while dragging so projector and camera ghosts move with the anchor;
       AIM remains independent and continues to supply the operation's `look` target. */
    if (['PROJ', 'CAM', 'AUDIENCE', 'PERSON'].includes(String(S.items[dragging.i].label || '').toUpperCase())) liveNow();
    return;
  }
  if (scaleFirst) { live = { t: 'scale', from: scaleFirst, to: p }; draw(); return; }
  if (!live) return;
  if (live.t === 'trace') {
    const last = live.pts[live.pts.length - 1];
    if (!near(last, p, 2)) live.pts.push(p);
    draw();
    /* THE SHAPE COMES TO LIFE WHILE THE HAND IS STILL MOVING. The ghost used to wait for
       the pen to come up, which meant the 3D said nothing during the one moment somebody
       is actually looking for feedback. The partial path is fitted and ghosted like any
       other proposal — it just happens to be a proposal that is still being drawn. */
    /* throttled: a pointermove fires far faster than a fit is worth running, and the
       fit walks the whole path each time */
    previewGesture(live);
    return;
  }
  if (live.kind === 'pen') {
    const last = live.pts[live.pts.length - 1];
    if (!near(last, p, 2)) live.pts.push(p);
  } else {
    live.pts[1] = p;
  }
  draw();
  previewGesture(live);
});

ink.addEventListener('pointerup', () => {
  if (groupDrag) {
    const g = groupDrag; groupDrag = null;
    dirty(); ghostSoon(); status(); draw();
    if (g.kind !== 'move' || g.moved) {
      const n = selectedItems().length;
      flash(n + ' shapes ' + (g.kind === 'rot' ? 'turned' : g.kind === 'scale' ? 'resized' : 'moved') + ' as one');
    }
    return;
  }
  if (marquee) { marqueeUp(); return; }
  if (rotateDrag) { rotateDrag = null; dirty(); ghostSoon(); status(); return; }
  if (cornerDrag) { cornerDrag = null; dirty(); ghostSoon(); status(); return; }
  if (handleDrag) { handleDrag = null; dirty(); ghostSoon(); status(); return; }
  /* the same landing as every other transform: the edit is a fact, the take hears
     about it, and BUILD is what puts the lock back on */
  if (heightDrag) {
    const it = S.items[heightDrag.i];
    heightDrag = null; dirty(); ghostSoon(); status(); draw();
    if (it) flash(solidTitle(it) + ' — BUILD 3D to okay it');
    return;
  }
  if (solidDrag) {
    if (solidDrag.moved) { mark(); dirty(); ghostSoon(); }
    solidDrag = null; draw();
    return;
  }
  if (live && live.t === 'trace') {
    const trace = live;
    const raw = trace.pts; live = null;
    draftSolid = null;              // the committed shape takes over from the draft
    draftCut = null;                // ...and so does the committed cut
    /* DISTANCE, NOT POINT COUNT. `raw.length < 4` looked like a sensible guard against a
       stray click and was a real bug: a pointermove fires when the pointer moves, not on
       a clock, so a quick drag with a mouse or a trackpad delivers three points for a
       gesture that crossed half the panel — and the trace was silently thrown away with
       a footer flash nobody reads in a 260px panel. What makes a trace a trace is that it
       WENT somewhere; the resampler fills in the rest. */
    const span = raw.length < 2 ? 0 : Math.max(
      Math.max(...raw.map(p => p[0])) - Math.min(...raw.map(p => p[0])),

   be selected at two of its corners and nowhere else, an ellipse at two points off the
   curve entirely, and a line anywhere except along the line. And a pen stroke drawn

/* the aim is stored in DEGREES IN CANVAS SPACE — 0 along +x, clockwise as the screen

     happened to be SELECTED instead. That is what broke every stamp after an LED one.

    convertStroke(drawn);

    return;

     live ghosts, and BUILD all use the same established path. */

      ? [[at[0] - half, at[1] - half], [at[0] + half, at[1] - half],

         [at[0] - half, at[1] - half]]

     silently doing nothing was the other half of "the stamps stopped working" */

  selectItem(i);
  draw(); status(); dirty(); ghostSoon();

}

/* ==========================================================================
   SAYING WHAT SOMETHING IS

   Two different questions used to share one control, and sharing it was the whole
   problem. "Where is the projector" and "what is this outline" are not the same act:
   the first is a POSITION and the second is a PROPERTY OF A SHAPE YOU ARE POINTING AT.
   One dropdown answered both, which meant arming a mode, aiming, and hoping — and
   getting the role onto a shape depended on hitting it.

   So they are split by what they are:

     A SHAPE'S ROLE            right-click the shape. STAGE / WALL / LED, on the thing
                               itself. Nothing to arm, nothing to aim, and the menu can
                               show you which one it already is.
     A THING YOU PUT SOMEWHERE three icons in the toolbar — PROJ, CAM, AUDIENCE — that
                               you drag onto the paper.

   TRACK and SCREEN are gone. SCREEN was a second name for WALL, and a tracking base is
   not something this pad had a way to say anything useful about.
   ========================================================================== */
const ROLE_STAMPS = [
  { label: 'STAGE', role: 'stage' },
  { label: 'WALL',  role: 'wall'  },
  { label: 'LED',   role: 'led'   },
  /* v5.8 · the horizontal reading of LED, offered on a closed plan outline — see `isFlatLed`.
     `lay` is what marks it as a variant rather than a role, which is how the face menu knows
     to leave it out: that one does its own split off the picked face's orientation. */
  { label: 'LED FLOOR', role: 'led', lay: 'flat',
    hint: 'a screen LYING in this outline — pitch, cabinets, a clip routed onto it' },
];

/* ---------- arming an anchor, and coming back ----------
   A STAMP IS A ONE-SHOT. Arming used to put the pad in STAMP mode and leave it there:
   every click afterwards dropped another one, so the honest answer to "why has nothing
   else worked since I placed that" was that the pad was still placing. Nothing was
   broken and nothing said so, which is the worst shape a mode can have.

   So it hands the pad back to the tool you were using. Shift keeps it armed, for the
   case the mode was actually for — five projectors in a row. */
function armStamp(name, keep) {
  if (S.tool !== 'stamp') S.armedFrom = S.tool;
  S.armed = name;
  S.armedSticky = !!keep;
  setTool('stamp');
  paintAnchorArmed();
  flash(name + ' — drop it on the drawing · shift to keep placing');
}
function disarmStamp() {
  if (S.tool !== 'stamp' || S.armedSticky) { paintAnchorArmed(); return; }
  setTool(S.armedFrom || 'select');
  paintAnchorArmed();
}
function paintAnchorArmed() {
  document.querySelectorAll('#anchors [data-anchor]').forEach(b => {
    b.classList.toggle('on', S.tool === 'stamp' && b.dataset.anchor === S.armed);
  });
}

/* ---------- DRAGGING ONE OUT OF THE TOOLBAR ----------
   Press an icon and drag it onto the paper: the press arms, the drag carries the glyph
   across the drawing (`drawCarriedStamp` draws what it would do to whatever is under
   it), and the release places it. A press that ends back on the icon is just a click,
   so the anchor stays armed and the next press on the paper places it. */
const anchorBar = document.getElementById('anchors');
anchorBar.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('[data-anchor]');

const overInk = (e) => {

};
window.addEventListener('pointermove', (e) => {

});
window.addEventListener('pointerup', (e) => {

/* ---------- THE ROLE MENU, ON THE SHAPE ---------- */
const roleMenu = document.getElementById('m-role');
function closeRoleMenu() { roleMenu.classList.remove('open'); }
function openRoleMenu(e, i) {
  const it = S.items[i];

  /* SEVERAL LED WALLS HELD IS A CANVAS WAITING TO BE NAMED. Offered here because this is
     the menu that is already on the shape, and because the alternative — go to the 3D and
     pick them out again — is doing the same work twice. */
  const leds = heldLeds();
  /* A MENU ON A SET SAYS SO. Naming three walls at once from a menu headed with one wall's
     name is the tool doing something bigger than it admitted to. */
  const held = selectedItems();
  const many = held.length > 1 && isSelected(i) ? held.length : 0;
  const head = many ? (many + ' shapes are…')
             : (isSolid ? (solidTitle(it) || 'This shape') : 'This outline') + ' is a…';
  /* the tick means "all of them are", not "the one under the pointer is" */
  /* THE TICK HAS TO ASK ABOUT THE VARIANT TOO, or LED and LED FLOOR both light up on a
     shape that is one of them */
  const layOf = (x) => (x && x.lay === 'flat') ? 'flat' : '';
  const allAre = (role, lay) => many
    ? held.every(k => S.items[k].t === 'solid' && S.items[k].role === role
                      && layOf(S.items[k]) === (lay || ''))
    : (isSolid && it.role === role && layOf(it) === (lay || ''));
  /* LINK, JOIN or UNLINK — whichever of the three the held set actually means. Offering
     LINK over a set that is already one canvas is offering to do again what is done, and
     offering nothing at all is why a canvas could be made and never taken apart from here. */
  const cans = heldCanvases();
  const already = cans.length === 1 && leds.length > 1
    && leds.every(x => cans[0].sids.includes(x.sid)) && cans[0].sids.length === leds.length;
  const joining = cans.length === 1 && leds.some(x => !cans[0].sids.includes(x.sid));
  roleMenu.innerHTML = '<div class="k">' + head + '</div>'
    + ROLE_STAMPS.filter(r => !r.lay || (many ? held.every(k => canLieFlat(S.items[k]))
                                              : canLieFlat(it)))
      .map(r => '<button data-role="' + r.role + '" data-label="' + r.label + '"'
        + ' data-lay="' + (r.lay || '') + '"'
        + (allAre(r.role, r.lay) ? ' class="on"' : '') + '>' + r.label
        + '<i>' + (r.hint || (SOLID_ROLES[r.role] || {}).hint) + '</i></button>').join('')
    + (leds.length > 1 && !already
        ? '<button data-act="link"><b>' + (joining ? 'JOIN THE CANVAS' : 'LINK LEDS') + '</b><i>'
          + (joining ? 'add ' + leds.filter(x => !cans[0].sids.includes(x.sid)).length
                       + ' to a canvas of ' + cans[0].sids.length
                     : leds.length + ' screens as one canvas in the Scene Study')
          + '</i></button>' : '')
    + (cans.length
        ? '<button data-act="unlink"><b>UNLINK</b><i>' + cans.reduce((n, g) => n + g.sids.length, 0)
          + ' screens go back to showing the video each</i></button>' : '');
  roleMenu.style.left = Math.min(e.clientX, innerWidth - 232) + 'px';
  roleMenu.style.top = Math.min(e.clientY, innerHeight - 172) + 'px';
  roleMenu.classList.add('open');
  roleMenu.dataset.i = String(i);
}
roleMenu.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]');
  if (act && act.dataset.act === 'unlink') {
    const cans = heldCanvases();
    closeRoleMenu();
    if (!cans.length) return flash('none of those is part of a canvas');
    post('unlinkLeds', { ids: cans.map(g => g.id) });
    flash(cans.reduce((n, g) => n + g.sids.length, 0)
      + ' screens unlinked — each one shows the whole video again');
    return;
  }
  if (act && act.dataset.act === 'link') {
    const leds = heldLeds();
    closeRoleMenu();
    if (leds.length < 2) return flash('hold SHIFT and click two or more LED walls first');
    /* A CANVAS IS MADE OF WALLS THAT ARE IN THE ROOM. The Scene Study holds the geometry, so
       a wall that has not been built is a wall it has never heard of — and a JOIN naming one
       used to drop it and link the rest, which is "press JOIN and watch nothing happen".
       Building is what the person is asking for implicitly: they have said these walls are
       one canvas, and a canvas is a fact about the room. So it is done, and said. */
    const unbuilt = leds.filter(x => !isBuiltShape(x));

      postSolids(true);

        + ' not in the scene — built ' + (unbuilt.length === 1 ? 'it' : 'them') + ' first');

     the same rule the menu already follows by offering LINK LEDS there. */
  if (selectedItems().length > 1 && isSelected(i))
    return nameHeld(b.dataset.label, b.dataset.role, b.dataset.lay);
  if (isLocked(it)) return flash(solidTitle(it) + ' is built — UNLOCK it before changing what it is');
  /* an outline that is still a STROKE becomes a solid first: saying what a drawing is
     is the same act as declaring it geometry, and making somebody trace it separately
     is a step that exists only because of how this file used to be organised */
  if (it.t === 'stroke') {
    convertStroke(i);
    if (!S.items[i] || S.items[i].t !== 'solid') return;
  }
  nameSolid(i, b.dataset.label, b.dataset.role, b.dataset.lay);
});
/* right-click IS the gesture. On a shape it asks what the shape is; anywhere else it
   does nothing, rather than opening a menu about nothing. */
ink.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  closeRoleMenu();
  if (S.busy) return;
  const i = hitShapeForStamp(pt(e));
  /* v5.8 · A MODEL'S FACE ANSWERS THE SAME QUESTION. Asked only once no shape of yours has —
     a candidate never outranks your own ink — and it opens its own menu, because what it
     offers is not "what is this shape" but "what should this surface become". */
  if (i < 0) {
    const cf = hitRoomFace(pt(e));

       own shapes. Right-clicking a face you are holding is pointing at the set; right-clicking
       one you are not is a fresh single choice. */
    if (cf) {

         still opens on it, because changing what a surface IS is the useful thing to do
         with one, and the room replaces its solid by `srcId` rather than stacking a second */
      if (cf.taken) { faceHeld.clear(); faceSel = cf.id; }

      draw(); status();

document.addEventListener('pointerdown', (e) => {

/* ==========================================================================
   5b · EDITING A SOLID — the vertices and the arcs are the handles.

   The fit is a proposal about what was drawn, so it has to be arguable: drag a
   vertex and it moves; drag an arc's apex and the curve bends; and either of those
   marks the solid HAND-EDITED, so a later REFIT is a deliberate act rather than
   something that quietly throws the correction away.
   ========================================================================== */
function pointInPoly(p, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a[1] > p[1]) !== (b[1] > p[1])
        && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
  }
  return inside;
}
/* DOES THIS LOOP SIT WHOLLY INSIDE THAT ONE? One point cannot answer it, and for a
   long time this asked one point: whether the cut-out's bounding-box CENTRE landed
   inside the parent. That says yes to a cut-out hanging half out of the solid — and
   a hole that leaves the thing it is subtracted from is not an opening, it is a
   contradiction, which is exactly what an extruder cannot build. So ask it properly:
   every vertex in, and no edge crossing an edge. The second half is what a CONCAVE
   parent needs — all-vertices-in still lets an edge bulge out through a bay and come
   back — and it is also the only thing that notices a cut-out larger than its own
   parent, whose centre is of course inside. */
function segsCross(a, b, c, d) {
  const o = (p, q, r) => (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]);
  const s1 = Math.sign(o(a, b, c)), s2 = Math.sign(o(a, b, d)),
        s3 = Math.sign(o(c, d, a)), s4 = Math.sign(o(c, d, b));
  /* STRICT signs only. An edge that merely touches the parent's outline, or runs
     along it — a notch flush with the wall — is a real opening somebody drew on
     purpose, so collinear and touching are not crossings. */
  return !!(s1 && s2 && s3 && s4 && s1 !== s2 && s3 !== s4);

  return false;
}
function polyInPoly(inner, outer) {
  if (inner.length < 3 || outer.length < 3) return false;
  /* on the outline counts as in: ray-casting is undefined exactly on the boundary,
     and a flush notch must not fail on a rounding error. */
  for (const p of inner) if (!pointInPoly(p, outer) && !onPolyEdge(p, outer)) return false;
  for (let i = 0; i < inner.length; i++) {
    const a = inner[i], b = inner[(i + 1) % inner.length];
    for (let j = 0; j < outer.length; j++)
      if (segsCross(a, b, outer[j], outer[(j + 1) % outer.length])) return false;
  }
  return true;
}
/* ==========================================================================

   wholly inside is not a subtraction, it is a hole punch. Option-drag now cuts
   wherever it OVERLAPS, and an overlap that crosses the outline has to change
   the outline: a bite out of the edge, not a hole floating next to it.

   Greiner-Hormann. Two things about it are worth knowing before touching it:

   1. `boolPoly(subject, cutter, 'diff')` inverts the SUBJECT's entry flags, not
      the cutter's. Inverting the cutter is the thing that looks right and it
      silently returns the INTERSECTION — the shape you meant to remove, rather
      than the shape you meant to keep.
   2. It cannot survive exact collinearity, and the RECTANGLE tool produces exact
      axis-aligned edges all day. So the cutter is nudged by ~2e-4 px first —
      deterministic, four orders below the 0.5 px tessellation, invisible to

   ========================================================================== */

}

el('sol-square').addEventListener('click', () => {
  const it = S.items[solSel]; if (!it) return;

  const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const q = pts.slice().sort((a,b) => a[0]-b[0] || a[1]-b[1]);

    const n=hull[(i+1)%hull.length], a=-Math.atan2(n[1]-p[1],n[0]-p[0]), ca=Math.cos(a), sa=Math.sin(a);

/* ==========================================================================
   8b · SOLIDS ON THE WIRE — build it, or ghost it first.

   Two messages, one payload. `preview` ghosts the solids in the Scene Study
   without touching the take, which is how you check a 14 m curve is the curve you
   meant before anything is built. `apply` asks the host to build them, through the
   same mutators an accepted plan uses — so the checklist, the cost panel and the
   measurements cannot tell a built sketch from hand work.

   This is NOT the agent path and does not pretend to be: nobody is interpreting
   anything. A person drew a shape, said what it was, and pressed build. The agent
   still sees the same solids inside `interpret`, where it can argue with them.
   ========================================================================== */
/* WHAT THIS PAD HAS BUILT, and exactly as it was built — id → the serialised solid.
   Two things need it.

   ONE: deleting a traced shape and pressing BUILD again should leave the scene
   matching the sketch, so the pad names the traces that no longer exist rather than
   letting the host infer it — a second pad open on the same take must not lose its
   work to this one.

   TWO, and this one was a real bug: A GHOST OF SOMETHING ALREADY BUILT IS NOT A
   PROPOSAL. The Scene Study measures into the PLAN rather than into the take while
   anything is ghosted — deliberately, so a proposal can never quietly become derived
   truth — so a live ghost that never went away parked the tool in preview mode for
   good and every derived figure in the workspace stopped updating. The fix is the
   honest one rather than a flag: only propose what actually differs from what was
   built, and when nothing differs, there is nothing to ghost. */
/* ---------- BUILT, AND THEREFORE LOCKED ----------
   `built` is the record of what the TAKE holds, keyed by the take's own id. `it.locked`
   is the pad's own statement about a shape: it has been committed, so it stops being
   part of the proposal. The two are set together at BUILD and the lock is what the
   drawing shows and the pointer obeys.

   Why a lock at all: once a deck is in the scene, every further gesture on the pad is
   about the NEXT thing, and a built shape sitting in the middle of the paper at full
   contrast is both a thing you drag by accident and a thing you cannot tell apart from
   the one you are still drawing. Recessive says "this is already true"; locked means
   the pad will not let you change it by accident. UNLOCK is one click, in the shape's
   own row, and it puts the shape back in BUILD's set. */
const built = new Map();
const isLocked = (it) => !!(it && it.t === 'solid' && it.locked);
/* a locked shape under the pointer, for the cursor and for the flash that explains it */
function lockedAt(p) {
  for (let i = S.items.length - 1; i >= 0; i--) {
    const it = S.items[i];
    if (it.t !== 'solid' || !it.locked || isUntouchableHere(it)) continue;
    const pts = solidPtsHere(it, 1.5);
    for (let k = 1; k < pts.length; k++) if (segDist(p, pts[k - 1], pts[k]) < 8) return i;
    if ((it.fit.closed || hasProfile(it)) && pts.length > 2 && pointInPoly(p, pts)) return i;
  }
  return -1;
}
/* A solid is locked once EVERY take it produces is in the scene. Every, not any: a
   shape cut in two contributes two records, and locking it on the strength of one
   would freeze a shape that is only half true. */
/* A SHAPE THAT HAS BEEN UNLOCKED IS IN HAND AGAIN. BUILD has something to say about it
   even when nothing about its geometry has changed, because confirming it is what puts
   it back. Without this the button greys out the moment LIVE has carried the edit into
   the take, and the shape can never be re-locked through the only control that locks. */
const unlockedBuilt = () => solidItems().some(it => !it.locked &&
  solidTakes(it).some(x => built.has(x.id)));
function lockBuiltItems() {
  S.items.forEach(it => {
    if (it.t !== 'solid') return;
    const takes = solidTakes(it);
    it.locked = takes.length > 0 && takes.every(x => built.get(x.id) === solidKey(x));
  });
  if (S.sel >= 0 && S.items[S.sel] && S.items[S.sel].t === 'solid') showSolidRow(S.sel);
  draw();
}
function unlockSolid(i) {
  const it = S.items[i];
  if (!it || !it.locked) return;
  mark();
  it.locked = false;
  /* it is a proposal again, so BUILD has something to do */
  S.solidRev++;
  draw(); status(); dirty(); showSolidRow(i); ghostSoon();
  flash(solidTitle(it) + ' unlocked — edit it and BUILD 3D will send the change');
}
/* the key is the GEOMETRY. `built` is a statement about the scene rather than about
   the shape, so it is excluded — otherwise every solid would differ from itself the
   moment it was built and nothing would ever compare equal again. */
const solidKey = (x) => JSON.stringify(x, (k, v) => (k === 'built' ? undefined : v));

let ghostTimer = 0;
/* every call site of this IS a change to a solid, so it is where the revision moves */
function ghostSoon() {
  S.solidRev++;
  status();
  if (!S.live) return;
  clearTimeout(ghostTimer);
  ghostTimer = setTimeout(() => postSolids(false), 320);
}
function postSolids(apply) {
  /* The set BUILD sees is the set LIVE showed. Completed basic shapes remain strokes
     in the drawing UI, but their fitted provisional volumes are declared geometry too;
     serialising them through the same helper prevents preview/build drift. */
  const solids = solidsOut().concat(strokeGhostsOut());
  const here = new Set(solids.map(x => x.id));
  if (apply) {
    const drop = [...built.keys()].filter(id => !here.has(id));
    const previewOps = stampPreviewOps();
    /* BUILD SENDS ONLY WHAT IS NOT ALREADY TRUE. It used to send every solid on the
       pad every time — which re-stated a deck that had been in the scene for an hour,
       and made "build" mean "resend everything" rather than "commit what is new".
       A shape counts as new if the take has never seen its id, or if its geometry has
       changed since it was last sent (which is what UNLOCK-then-edit produces). */
    const send = solids.filter(x => built.get(x.id) !== solidKey(x));
    if (!send.length && !drop.length && !previewOps.length) {
      /* LIVE may already have carried the edit into the take while the hand was still
         moving, so "nothing to send" is a normal outcome of unlock-edit-build — and the
         pad's own lock state still has to catch up with it. */
      lockBuiltItems();
      S.builtRev = S.solidRev;
      status();     // BEFORE the flash, for the same reason
      flash(solids.length ? 'already built — nothing has changed since the last BUILD'
                          : 'nothing to build — trace a shape or place an anchor first');
      return;
    }
    /* Declared anchors take the exact same operations across the boundary that made
       their ghosts. The host replaces/updates them by stable sketch source id. */
    post('solids', { solids: send, drop, apply: true, preview: false, previewOps,
                     projection: S.projection, unitsPerMetre: HOST.unitsPerMetre });
    /* the map still describes the WHOLE take, not just this batch: a shape left out of
       `send` because it was unchanged is still in the scene, and forgetting it here
       would put it in `drop` on the next pass and delete it */
    built.clear();
    solids.forEach(x => built.set(x.id, solidKey(x)));
    /* what has been committed is no longer a proposal: it goes recessive and locks */
    lockBuiltItems();
    S.builtRev = S.solidRev;
    flash([send.length ? send.length + (send.length === 1 ? ' solid' : ' solids') : null,
           previewOps.length ? previewOps.length + (previewOps.length === 1 ? ' anchor' : ' anchors') : null].filter(Boolean).join(' · ')
          + (drop.length ? ' built · ' + drop.length + ' removed' : ' built') + ' in the scene');
    /* the proposal and the fact are now the same thing, so there is nothing left to
       propose — and the tool goes back to measuring into the take */
    post('solids', { solids: [], preview: true, clear: true });
    post('inventory', { inventory: sketchInventory() });
    status();                     // BUILD goes quiet: the scene matches the sketch
    /* AND THE SELECTION IS RESTATED, because it has only just become sayable. The pad
       names shapes by the trace they came from and the Scene Study resolves those against
       the TAKE — so a set announced before BUILD names shapes the take does not have yet,
       the room holds nothing, and the two panels disagree about a selection the person is
       looking at. Nothing else re-announces: the selection did not change, the world it
       is expressed in did. */
    announced = null;
    announceSelection();
    return;
  }

  /* ---------- LIVE ----------
     "Live preview" means two different things depending on whether a shape has been
     built yet, and both of them are what somebody dragging a deck expects:

       not built yet   ghost it, violet, and touch nothing in the take
       already built   MOVE IT, in the take, as the pointer moves

     Ghosting an already-built shape would have drawn a violet copy floating beside the
     real one that stayed where it was — two of the same thing, neither of them right.
     And it parked the tool in preview mode, which stops every derived figure in the
     workspace from updating. So a built shape is applied, and only what is genuinely
     still a proposal is proposed. */
  const changed = solids.filter(x => built.has(x.id) && built.get(x.id) !== solidKey(x));
  const drop = [...built.keys()].filter(id => !here.has(id));
  if (changed.length || drop.length) {
    post('solids', { solids: changed, drop, apply: true, preview: false,
                     projection: S.projection, unitsPerMetre: HOST.unitsPerMetre });
    changed.forEach(x => built.set(x.id, solidKey(x)));
    drop.forEach(id => built.delete(id));
  }
  const fresh = solids.filter(x => !built.has(x.id));
  if (draftSolid) fresh.push(...solidTakes(draftSolid));
  const previewOps = stampPreviewOps();
  post('solids', { solids: fresh, preview: true, clear: !fresh.length && !previewOps.length,
                   previewOps, inventory: sketchInventory(),
                   projection: S.projection, unitsPerMetre: HOST.unitsPerMetre });
  if (!fresh.length) S.builtRev = S.solidRev;      // nothing left to build
  status();
}

/* the drag's own channel: throttled hard, because this one writes to the take and a
   pointermove fires far faster than anything needs to be mutated */
let liveAt = 0;
function liveNow() {
  if (!S.live) return;
  const now = Date.now();
  if (now - liveAt < 110) return;
  liveAt = now;
  clearTimeout(ghostTimer);
  postSolids(false);
}
el('b-live').addEventListener('click', (e) => {
  S.live = !S.live;
  e.currentTarget.classList.toggle('on', S.live);
  e.currentTarget.setAttribute('aria-pressed', String(S.live));
  e.currentTarget.lastChild.textContent = S.live ? 'LIVE ON' : 'LIVE OFF';
  e.currentTarget.title = S.live
    ? 'LIVE ON — Scene Study follows the sketch with a translucent provisional shape. Click to pause the preview.'
    : 'LIVE OFF — click to restore the translucent Scene Study preview.';
  if (S.live) postSolids(false); else post('solids', { solids: [], preview: true, clear: true });
  flash(S.live ? 'ghosting solids in the scene as you draw' : 'ghosting off');

/* ==========================================================================
   7 · TOOLS, KEYS, HISTORY
   ========================================================================== */
function setTool(t) {

  cornerDrag = null; rotateDrag = null; draftSolid = null; draftCut = null;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  paintAnchorArmed();
  /* THE FOOTER HAS TO AGREE WITH THE BAR. It did not: the chip that names the armed tool
     is painted by `status()`, and this never called it — so pressing SELECT armed select
     and the footer went on saying TRACE. On an icon bar that chip is the only place the
     mode is written in words, which makes a stale one worse than none: it reads as the
     button having done nothing. */
  status();

}
document.getElementById('tools').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tool]');

});
document.getElementById('b-undo').addEventListener('click', undo);
document.getElementById('b-redo').addEventListener('click', redo);
document.getElementById('b-clear').addEventListener('click', () => { mark(); reset(true); dirty(); });
document.getElementById('b-under').addEventListener('click', (e) => {
  S.showUnder = !S.showUnder;
  e.currentTarget.classList.toggle('on', S.showUnder && !!S.underlay);

});
function undo() { if (!past.length) return; future.push(snap()); restore(past.pop()); hideAsk(); dirty(); }
function redo() { if (!future.length) return; past.push(snap()); restore(future.pop()); hideAsk(); dirty(); }
function reset(keepDecls) {

  S.selMany.clear();

  if (!keepDecls) { S.scale = null; S.origin = null; S.groundLine = null; }
  hideAsk(); hideSolidRow(); draw(); status();
  /* CLEAR does not un-build: what is in the take is a fact and clearing a drawing is
     not a decision about the room. BUILD after a clear is what removes them, and the
     footer says so. */
  /* the ghosts belong to solids that no longer exist */
  if (S.live) post('solids', { solids: [], preview: true, clear: true });
}

/* `a` is gone with the ARROW tool it armed: an arrow drawn on a sketch said nothing the
   AIM gesture does not say better, and it was one more thing in a bar that had too many.
   `v` is SELECT, which is where every other tool in the world puts it. */
const TOOL_NAME = { select: 'select', pen: 'pen', line: 'line', rect: 'rectangle',
                    ellipse: 'ellipse', text: 'label', erase: 'erase', scale: 'scale',
                    origin: 'origin', aim: 'aim', trace: 'trace', stamp: 'stamp' };

document.addEventListener('keydown', (e) => {
  if (e.key === 'Alt') {
    optionHeld = true;
    paintCursor(lastHoverPoint || [0, 0]);
    return;
  }
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && k === 'z') { e.shiftKey ? redo() : undo(); e.preventDefault(); return; }

  if (k === '0') { resetZoom(); return; }

  if (k === '=' || k === '+') { zoomAt(box.w / 2, box.h / 2, S.viewport.zoom * 1.25); afterViewport(); return; }
  if (k === '-' || k === '_') { zoomAt(box.w / 2, box.h / 2, S.viewport.zoom / 1.25); afterViewport(); return; }

       for them — and a face plainly outlined and held in front of you is what DEL is about. */

        + ' — the Scene Study is taking ' + (ids.length === 1 ? 'it' : 'them') + ' off the model');

    if (S.sel >= 0) { mark(); S.items.splice(S.sel, 1); selectItem(-1); hideAsk(); draw(); status(); dirty(); ghostSoon(); }

  if (e.key !== 'Alt') return;

window.addEventListener('blur', () => {
  optionHeld = false;

});

/* ==========================================================================
   8 · WHAT TRAVELS — the payload. Both halves of it.
   ========================================================================== */
function vectorRecord() {
  const strokes = S.items.filter(i => i.t === 'stroke').map(i => ({
    // rounded on the way out: a sketch does not mean anything to a tenth of a pixel
    pts: i.pts.map(p => [Math.round(p[0]), Math.round(p[1])]),
    w: +(i.w || 2).toFixed(1), kind: i.kind, view: i.view || 'plan',
  }));
  return {
    canvas: { w: Math.round(box.w), h: Math.round(box.h) },
    projection: S.projection,
    /* ALWAYS a scale now. Absent an explicit one, the grid IS the scale: one square is
       one metre, the same metre the Scene Study's floor draws. `basis` says which of
       the two it was, so the far side can be honest about it. */
    scale: S.scale
      ? { pxPerMetre: S.scale.pxPerMetre, metres: S.scale.metres, basis: 'drawn',
          from: S.scale.from.map(Math.round), to: S.scale.to.map(Math.round) }
      : { pxPerMetre: GRID_PX / GRID_M, metres: GRID_M, basis: 'grid', square_px: GRID_PX },
    grid: { px: GRID_PX, metres: GRID_M },
    origin: originOf().map(Math.round),
    groundLine: S.projection === 'elevation' ? Math.round(S.groundLine == null ? box.h * 0.78 : S.groundLine) : null,
    strokes,
    /* what is drawn in the OTHER view travels too, tagged with the view that drew
       it — otherwise switching to top and interpreting would throw away every height
       the front view had established */
    stamps: S.items.filter(i => i.t === 'stamp').map(i => ({
      label: i.label, at: i.at.map(Math.round), rot: 0, note: i.note || '',
      view: i.view || 'plan',
      /* degrees in canvas space, and how far the drag went — the length is a hint
         about distance, not a promise, and it is read as one */
      aim: (i.aim === undefined || i.aim === null) ? null : i.aim,
      aimLen: i.aimLen || null,
    })),
    labels: S.items.filter(i => i.t === 'label')
      .map(i => ({ text: i.text, at: i.at.map(Math.round), view: i.view || 'plan' })),
    /* v5.5 · SOLIDS, and the one place in this payload that is not in pixels.
       See § 2d: the pad holds the fit, so it is the only opinion about this
       geometry rather than a second one, and it hands over take units. Each solid
       says `units: 'take'` on itself so that can never be read the other way. */
    solids: solidsOut(),
    /* both grounds travel, because an item drawn in the other view was measured
       against that view's zero */
    groundLine_elevation: Math.round(S.groundLine == null ? box.h * 0.78 : S.groundLine),
    origin_y: Math.round(originOf()[1]),
    note: document.getElementById('note').value.trim(),
  };
}

/* the raster, drawn by the SAME function that draws the panel — `clean` drops the
   grid, the selection ring and the hover chrome and keeps what orients a reader */
function renderPng() {
  return new Promise((resolve) => {
    if (!(box.w > 0 && box.h > 0)) return resolve(null);      // nothing to draw onto
    const off = document.createElement('canvas');
    const s = Math.min(2, Math.max(1, 1400 / Math.max(1, box.w)));   // long edge ≈1400px
    off.width = Math.round(box.w * s); off.height = Math.round(box.h * s);
    const c = off.getContext('2d');
    c.setTransform(s, 0, 0, s, 0, 0);
    c.__base = [s, 0, 0, s, 0, 0];
    draw(c, true);
    off.toBlob((blob) => blob ? blob.arrayBuffer().then(resolve) : resolve(null), 'image/png');
  });
}

async function interpret(rec) {
  if (S.busy) return;
  rec = rec || vectorRecord();
  if (!rec.strokes.length && !rec.stamps.length && !rec.solids.length) { flash('nothing drawn yet'); return; }
  /* the panel's own share of the wait: rasterising a large canvas is not instant,
     and it happens before the host has anything to report */
  setBusy(true, 'PREPARING', 'rasterising what you drew');
  const png = await renderPng();
  setBusy(true, 'SENDING', 'the drawing and its vector record');
  post('interpret', Object.assign({ png }, rec), png ? [png] : []);
  if (!EMBEDDED) {
    // standalone: this panel is never an API client, so it shows the payload
    // instead of sending it. That is the whole standalone contract.
    console.log('[sketchpad] payload', rec);
    setTimeout(() => { setBusy(false); flash('standalone — payload logged, not sent'); }, 700);
  }
}
async function make3d() {
  if (S.busy) return;
  const png = await renderPng();
  if (!png) { flash('nothing visible to convert'); return; }
  post('convert3d', { name: 'sketch-pad.png', mime: 'image/png', png, bytes: png }, [png]);
  flash('sent to local image-to-3D');
}
/* ==========================================================================
   BUILD 3D — one action, two halves, and the split is not arbitrary.

   A traced shape needs no interpreting. Somebody drew the outline, the fitter
   corrected it, and a stamp said what it is: that is a DECLARATION, and it goes
   straight into the scene through the same mutators an accepted plan uses. Sending
   it to a model to be told what it already says would be theatre.

   Everything else in the drawing — the anchors, the loose strokes, the note — is
   READ, because none of it says what it is. That half is a plan you accept.

   Two buttons made that a choice somebody had to understand before they could press
   anything. One button does both halves in the order that matters: the room first,
   then the kit that goes in it — which is also why the agent gets the solids in its
   payload, so it places a projector against a stage that already exists.
   ========================================================================== */
async function buildAll() {
  if (S.busy) return;
  const rec = vectorRecord();
  const pendingSolids = S.solidRev !== S.builtRev || unlockedBuilt();
  const declaredAnchors = stampPreviewOps();
  /* PROJ, CAM and AUDIENCE are declared geometry, not ambiguous ink. They build from
     the exact preview operations; TRACK and any future non-preview stamp still go to
     interpretation. Removing only those labels prevents a second inferred device. */
  if (declaredAnchors.length) {
    const direct = new Set(['PROJ', 'CAM', 'AUDIENCE', 'PERSON']);
    rec.stamps = rec.stamps.filter(x => !direct.has(String(x.label).toUpperCase()));
  }
  /* AN UNSTAMPED SHAPE IS A QUESTION, so it is readable material.
     This used to be strokes, anchors and the note only — which meant a drawing made
     entirely of traced shapes was built and never read, and AID3N was never asked
     anything about it. But an unstamped shape is precisely the case where somebody has
     not said what the thing is, and that is the one judgement worth asking a model for.
     A drawing where every shape IS stamped still goes, and comes back saying so. */
  if (!pendingSolids && !declaredAnchors.length) {
    /* THE LOCK STILL HAS TO CATCH UP. With LIVE on, unlocking a shape and moving it
       carries the edit into the take while the hand is still moving, so by the time
       BUILD is pressed there is genuinely nothing left to send — and this early return
       used to leave the shape sitting there unlocked and active for ever, with the pad
       insisting it was already built. Saying so and re-locking are the same statement. */
    lockBuiltItems();
    S.builtRev = S.solidRev;
    status();       // BEFORE the flash: `status` repaints the element `flash` writes to
    flash(rec.solids.length ? 'already built — the scene matches the sketch' : 'nothing drawn yet');
    return;
  }
  postSolids(true);
  /* NO INTERPRETATION, and no leaving the pad. The second half used to send the
     ambiguous remainder — loose strokes, the note, unstamped shapes — to be read
     back as a plan, which parked the pad in review while somebody accepted it.
     The drawing already says what it is, so building is the whole action: the pad
     stays live, and anything drawn from here on ghosts until it is built in turn. */
}
document.getElementById('b-go').addEventListener('click', buildAll);
/* `make3d` and `interpret` are deliberately still here and deliberately unbound.
   Both are whole capabilities — a generated mesh from the picture, and a read of the
   ambiguous remainder — and deleting them would make bringing either back an
   archaeology exercise rather than re-attaching a listener. */
document.getElementById('b-cancel').addEventListener('click', () => {
  post('cancel', { planId: S.lastPlan });
  setBusy(false);
});

/* the note is READABLE material: a sketch with nothing but "five projectors from the
   balcony" in it is worth sending, so typing in it has to wake the button up */
document.getElementById('note').addEventListener('input', () => status());

let dirtyTimer = 0;
function dirty() {
  clearTimeout(dirtyTimer);
  dirtyTimer = setTimeout(() => post('dirty', {
    strokes: S.items.filter(i => i.t === 'stroke').length,
    stamps: S.items.filter(i => i.t === 'stamp').length,
  }), 400);
}

/* ==========================================================================
   9 · STATE THE PANEL SHOWS — what has been declared, and what has not.
   The footer is deliberately about the three declarations rather than about the
   drawing: a sketch with 200 strokes and no scale is worth less than a sketch
   with 4 strokes and one.
   ========================================================================== */
function status() {
  document.getElementById('c-proj').textContent = S.projection === 'plan' ? 'PLAN · ↑ UPSTAGE' : 'ELEVATION · FROM THE AUDIENCE';
  const sc = document.getElementById('c-scale');
  /* never a warning any more: there is always a scale, because the grid is one */
  sc.className = 'chip ok';
  sc.textContent = S.scale ? S.scale.metres + ' M DRAWN' : 'GRID · 1 SQUARE = 1 M';
  const sols = solidItems();
  const sc2 = document.getElementById('c-solids');
  sc2.className = 'chip' + (sols.length ? ' ok' : '');
  sc2.textContent = sols.length
    ? sols.length + (sols.length === 1 ? ' SOLID · ' : ' SOLIDS · ')
      + sols.reduce((n, i) => n + i.fit.verts.length, 0) + ' VERTS · '
      + (() => { const a = sols.reduce((n, i) => n + i.fit.arcs, 0);
                 return a + (a === 1 ? ' ARC' : ' ARCS'); })()
    : '0 SOLIDS';
  /* v5.8 · AND WHAT THE MODELS IN THE ROOM ARE OFFERING. The outlines are deliberately quiet
     — they are not your ink — which means that without a count, the only way to discover a
     face is to happen to hover one. Hidden entirely when there are none, so the bar does not
     carry a permanent "0" for a feature this drawing is not using. PLAN only, because that is
     the only page they are drawn on. */
  const fc = document.getElementById('c-faces');
  const open = roomFaces.filter(f => !f.taken).length;
  if (roomFaces.length) {
    fc.hidden = false;
    fc.className = 'chip' + (faceHeld.size ? ' ok' : '');
    const built = roomFaces.length - open;
    fc.textContent = faceHeld.size
      ? faceHeld.size + ' OF ' + open + ' FACES HELD'
      : open + (open === 1 ? ' MODEL FACE' : ' MODEL FACES')
        + (built ? ' · ' + built + ' BUILT' : '');
    fc.title = 'faces of the imported models in the room, found by the Scene Study — '
      + 'click to hold, shift-click to hold more, right-click to make them decks, walls or '
      + 'LED walls, DEL to take them off the model';
  } else fc.hidden = true;
  /* a REVISION COUNTER rather than a re-serialise: status() runs on every draw and
     comparing the whole payload there would re-tessellate every arc for a button's
     enabled state */
  const pending = S.solidRev !== S.builtRev || unlockedBuilt();
  const anchorsPending = S.items.some(i => i.t === 'stamp');
  const go = document.getElementById('b-go');
  go.disabled = S.busy || (!pending && !anchorsPending);
  /* WHAT IT WOULD BUILD is shapes AND strokes: a completed rectangle is geometry that
     has not been named yet, not a decoration, and the count that ignored it read "Build
     0 shapes" over a pad with a rectangle on it. */
  const buildable = sols.length + S.items.filter(i => i.t === 'stroke').length;
  /* the TITLE says what pressing it will do, because "why is this greyed out" and
     "what is this about to do" are the two questions one button has to answer
     without being pressed */
  go.title = go.disabled
    ? (buildable ? 'Everything drawn is already built and locked — the scene matches the sketch'
                 : 'Trace a shape, or drop an anchor, and this builds it')
    : 'Build ' + buildable + ' shape' + (buildable === 1 ? '' : 's') + ' into the scene';
  const anchors = S.items.filter(i => i.t === 'stamp').length;
  const ac = document.getElementById('c-anchors');
  ac.className = 'chip' + (anchors ? ' ok' : ' warn');
  ac.textContent = anchors + (anchors === 1 ? ' ANCHOR' : ' ANCHORS');
  statusStrokes();
  document.getElementById('b-undo').disabled = !past.length;
  document.getElementById('b-redo').disabled = !future.length;
}
function statusStrokes() {
  const tl0 = document.getElementById('c-tool');
  if (tl0) tl0.textContent = (TOOL_NAME[S.tool] || S.tool).toUpperCase()
    + (['rect', 'ellipse', 'pen', 'trace'].includes(S.tool) ? ' · OPTION = CUT OUT' : '');
  if (flashHolding()) return;              // a message is up; the count can wait
  const here = S.items.filter(i => i.t === 'stroke' && !isShadow(i)).length;
  const there = S.items.filter(i => i.t === 'stroke' && isShadow(i)).length;
  document.getElementById('c-strokes').textContent =
    here + (here === 1 ? ' STROKE' : ' STROKES') + (there ? ' · ' + there + ' FROM THE OTHER VIEW' : '');
  const tl = document.getElementById('c-tool');
  if (tl) tl.textContent = (TOOL_NAME[S.tool] || S.tool).toUpperCase()
    + (['rect', 'ellipse', 'pen', 'trace'].includes(S.tool) ? ' · OPTION = CUT OUT' : '');
}

function setBusy(on, label, note) {
  S.busy = on;
  document.getElementById('veil').classList.toggle('on', on);
  stage.classList.toggle('locked', on);
  if (label) document.getElementById('veil-t').textContent = label;
  if (note) document.getElementById('veil-s').textContent = note;
  status();
}

/* ---------- THE FLASH OWNS THE LINE WHILE IT IS UP ----------
   `flash`, `statusStrokes` and the hover readout all write to `#c-strokes`, and the
   other two run on every pointer move. So any message raised by a gesture that also
   moved the pointer — which is all of them — was being wiped in the same tick by the
   hover that followed it. The message was not missing, it was overwritten, which is why
   several of them read as "nothing happened".

   A flash now claims the line for its own 2.6 s and the other two stand off. */
let flashTimer = 0, flashUntil = 0;
const flashHolding = () => Date.now() < flashUntil;
function flash(msg) {
  const el = document.getElementById('c-strokes');
  clearTimeout(flashTimer);
  flashUntil = Date.now() + 2600;
  el.textContent = msg.toUpperCase();
  flashTimer = setTimeout(() => { flashUntil = 0; statusStrokes(); }, 2600);
}

/* ==========================================================================
   10 · BOOT
   ========================================================================== */
paintAnchorArmed();
paintZoom();
resize();
status();
document.getElementById('dev').classList.toggle('on', !EMBEDDED);
if (!EMBEDDED) {
  devLog('in', 'standalone', { note: 'no host — BUILD 3D logs its payload' });
  document.getElementById('veil-s').textContent =
    'Standalone: this panel never calls the API. The payload is logged instead.';
}
/* A HANDLE, standalone only, and the same one the Scene Study carries: standing this
   panel up on its own and asking it what it thinks it is holding — which shapes, at what
   height, whether an inbound message landed — is otherwise guesswork from screenshots.
   The host never gets it and nothing above this line reads it. */
if (!EMBEDDED) window.SP = { S, IN, el, draw, status, solidToTake,
  solids: () => S.items.filter(i => i.t === 'solid')
    .map(i => ({ sid: i.sid, oid: i.oid, role: i.role, hM: i.hM, touched: !!i.hTouched })) };

document.getElementById('b-live').classList.toggle('on', S.live);
post('ready', { capabilities: ['sketch', 'stamps', 'scale', 'projection', 'underlay',
                               'solids', 'arcs', 'led-tiles', 'build'] });
</script>
</body>
</html>
